<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>手势物理照片</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a0f;
  overflow:hidden;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  color:#e8d5c4;
  user-select:none
}
#canvas-3d{
  display:block;
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh
}

/* ── Loading Screen ── */
#loading{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:#0a0a0f;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:100;
  transition:opacity .8s
}
#loading.hidden{opacity:0;pointer-events:none}
.spinner{
  width:30px;height:30px;
  border:2px solid rgba(212,165,116,.15);
  border-top-color:#d4a574;
  border-radius:50%;
  animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{
  font-size:14px;letter-spacing:4px;
  color:rgba(232,213,196,.5);margin-top:20px
}
#camera-feed{display:none}

/* === Liquid Glass Panels === */
.glass-panel{
  background:rgba(18,16,24,.45);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06),inset 0 0 0 1px rgba(255,255,255,.03)
}

/* Camera Preview */
#cam-preview{
  position:fixed;bottom:90px;right:16px;
  width:140px;height:105px;
  border-radius:14px;
  overflow:hidden;
  z-index:10;
  opacity:.6;
  transition:opacity .5s
}
#cam-preview:hover{opacity:.85}
#cam-preview video{
  width:100%;height:100%;
  object-fit:cover;
  /* no mirror — direct mapping to 3D */
}
#cam-label{
  position:absolute;bottom:4px;left:50%;
  transform:translateX(-50%);
  font-size:9px;letter-spacing:1px;
  color:rgba(232,213,196,.4);
  text-shadow:0 0 4px rgba(0,0,0,.8)
}

/* Toast */
.glass-toast{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  padding:10px 24px;
  border-radius:24px;
  background:rgba(18,16,24,.55);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  border:1px solid rgba(255,255,255,.06);
  font-size:14px;letter-spacing:2px;
  color:rgba(232,213,196,.7);
  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
  z-index:20
}
.glass-toast.show{opacity:1}

/* Toolbar */
#toolbar{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%);
  display:flex;gap:2px;
  padding:6px;
  border-radius:24px;
  z-index:10
}
.tool-btn{
  display:flex;align-items:center;gap:6px;
  padding:8px 18px;
  border:none;
  border-radius:20px;
  background:transparent;
  color:rgba(232,213,196,.5);
  font-size:12px;letter-spacing:1px;
  cursor:pointer;
  transition:all .3s;
  font-family:inherit
}
.tool-btn:hover{background:rgba(255,255,255,.04);color:rgba(232,213,196,.85)}
.tool-btn.active{background:rgba(212,165,116,.1);color:#d4a574}
.tool-icon{font-size:16px}
.tool-label{font-size:11px}

/* Info Card */
.info-card{
  position:fixed;
  padding:12px 18px;
  border-radius:14px;
  z-index:10;
  transition:opacity .3s;
  pointer-events:none
}
.info-card.hidden{opacity:0}
.info-card.visible{opacity:1}
#info-name{font-size:16px;letter-spacing:2px;color:rgba(232,213,196,.85);margin-bottom:4px}
#info-material,#info-weight{font-size:11px;letter-spacing:1px;color:rgba(232,213,196,.4)}

/* Help Modal */
#help-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  z-index:50;
  opacity:0;
  pointer-events:none;
  transition:opacity .4s
}
#help-overlay.show{opacity:1;pointer-events:auto}
#help-card{padding:36px 40px 28px;border-radius:20px;max-width:440px;width:90%;text-align:center}
#help-title{font-size:18px;letter-spacing:4px;font-weight:300;margin-bottom:20px;color:rgba(232,213,196,.7)}
.help-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid rgba(232,213,196,.04);text-align:left}
.help-row:last-child{border-bottom:none}
.help-icon{font-size:22px;width:36px;text-align:center}
.help-text{font-size:13px;letter-spacing:1px;color:rgba(232,213,196,.6)}
.help-detail{font-size:10px;color:rgba(232,213,196,.25);letter-spacing:.5px;margin-top:2px}
#help-dismiss{
  margin-top:20px;padding:8px 32px;
  border-radius:20px;
  border:1px solid rgba(212,165,116,.2);
  background:transparent;
  color:rgba(212,165,116,.6);
  font-size:12px;letter-spacing:2px;
  cursor:pointer;font-family:inherit;
  transition:all .3s
}
#help-dismiss:hover{border-color:rgba(212,165,116,.4);color:rgba(212,165,116,.9)}

/* Responsive */
@media(max-width:640px){
  #cam-preview{width:100px;height:75px;bottom:80px;right:8px}
  #toolbar{bottom:10px;padding:4px}
  .tool-btn{padding:6px 12px}
  .tool-label{display:none}
  #help-card{padding:24px 20px 20px}
}
</style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="spinner"></div>
  <p id="loading-text">加载 Three.js...</p>
</div>

<!-- Camera preview (glass panel) -->
<div id="cam-preview" class="glass-panel">
  <video id="cam-preview-video" muted playsinline></video>
  <div id="cam-label">手势预览</div>
</div>

<!-- Toast -->
<div id="hint-toast" class="glass-toast"></div>

<!-- Bottom toolbar -->
<div id="toolbar" class="glass-panel">
  <button class="tool-btn" id="btn-upload" title="上传图片">
    <span class="tool-icon">📷</span>
    <span class="tool-label">上传</span>
  </button>
  <button class="tool-btn" id="btn-reset" title="重置场景">
    <span class="tool-icon">🔄</span>
    <span class="tool-label">重置</span>
  </button>
  <button class="tool-btn" id="btn-help" title="手势帮助">
    <span class="tool-icon">❓</span>
    <span class="tool-label">帮助</span>
  </button>
</div>

<!-- Object info card -->
<div id="info-card" class="glass-panel info-card hidden">
  <div id="info-name"></div>
  <div id="info-material"></div>
  <div id="info-weight"></div>
</div>

<!-- Hidden file input -->
<input type="file" id="file-input" accept="image/*" style="display:none">

<!-- Help modal -->
<div id="help-overlay">
  <div id="help-card" class="glass-panel">
    <div id="help-title">手势控制</div>
    <div class="help-row">
      <div class="help-icon">👆</div>
      <div class="help-text">捏合抓起 · 张开放下<div class="help-detail">主手（金色骨架）拇指+食指捏合抓取物体，张开释放</div></div>
    </div>
    <div class="help-row">
      <div class="help-icon">🤚</div>
      <div class="help-text">镜头始终跟在手后面 · 两指缩放<div class="help-detail">辅手（蓝色骨架）控制镜头，主手（金色）捏合抓取</div></div>
    </div>
<button id="help-dismiss" onclick="document.getElementById('help-overlay').classList.remove('show')">知道了</button>
  </div>
</div>

<video id="camera-feed" playsinline style="display:none"></video>

<!-- 3D canvas -->
<canvas id="canvas-3d"></canvas>

<!-- MediaPipe Hands CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>

<!-- Three.js import map -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

// ═══════════════════════════════════════════
// 1. CONFIG
// ═══════════════════════════════════════════
const CFG = {
  gravity: -9.82,
  pinchThreshold: 0.02,
  openThreshold: 0.7,
  fistThreshold: 0.2,
  depthScale: 0.5,
  cameraFOV: 50,
  cameraNear: 0.1,
  cameraFar: 50,
  groundZ: -2,
  backgroundZ: 5
};

const MATERIAL_PARAMS = {
  wood:   { density: 600,  restitution: 0.3,  friction: 0.6 },
  metal:  { density: 7800, restitution: 0.05, friction: 0.25 },
  fabric: { density: 200,  restitution: 0.02, friction: 0.9 },
  glass:  { density: 2500, restitution: 0.01, friction: 0.3 },
  plastic:{ density: 1000, restitution: 0.4,  friction: 0.5 },
  paper:  { density: 700,  restitution: 0.1,  friction: 0.7 }
};

// ═══════════════════════════════════════════
// 2. STATE
// ═══════════════════════════════════════════
const S = {
  objects: [],
  hands: [],
  grabbedObj: null,
  constraint: null,
  prevPinch: false,
  cameraBaseZ: 5.0,
  cameraTarget: new THREE.Vector3(0, 0, 0),
  prevDualDist: null,
};

// Scene group reference (must be before buildScene)
let currentObjectGroup = null;

// ═══════════════════════════════════════════
// 3. THREE.JS SETUP
// ═══════════════════════════════════════════

// Renderer
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  canvas: document.getElementById('canvas-3d')
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.autoClear = true;

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.008);

// Camera
const camera = new THREE.PerspectiveCamera(
  CFG.cameraFOV,
  window.innerWidth / window.innerHeight,
  CFG.cameraNear,
  CFG.cameraFar
);
camera.up.set(0, 0, 1);
camera.position.set(0, 5.0, 0);
S.cameraTarget.set(0, 0, -1.5);
camera.lookAt(S.cameraTarget);

const cameraTargetPos = camera.position.clone();
const cameraTargetLook = S.cameraTarget.clone();

// ── Lights ──

// Ambient
const ambientLight = new THREE.AmbientLight(0x2a2040, 1.5);
scene.add(ambientLight);

// Key light (with shadows)
const keyLight = new THREE.DirectionalLight(0xffeedd, 6);
keyLight.position.set(5, 8, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 1024;
keyLight.shadow.mapSize.height = 1024;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -10;
keyLight.shadow.bias = -0.0001;
scene.add(keyLight);

// Rim light
const rimLight = new THREE.DirectionalLight(0x4466aa, 2);
rimLight.position.set(-3, 2, -2);
scene.add(rimLight);

// Fill light
const fillLight = new THREE.DirectionalLight(0xd4a574, 1.5);
fillLight.position.set(0, -0.5, 5);
scene.add(fillLight);

// ── Ground (solid box) ──
const groundGeo = new THREE.BoxGeometry(12, 8, 0.3);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x3a3530,
  roughness: 0.6,
  metalness: 0.05,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.position.z = CFG.groundZ - 0.15;
ground.receiveShadow = true;
scene.add(ground);

// ── Grid Helper ──
const grid = new THREE.PolarGridHelper(8, 32, 16, 64, 0x222233, 0x222233);
scene.add(grid);

// ═══ 3b. PHYSICS (Cannon-es) ═══

const world = new CANNON.World({
  gravity: new CANNON.Vec3(0, 0, CFG.gravity),
});
world.defaultContactMaterial.restitution = 0;
world.defaultContactMaterial.friction = 0.8;
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 5;

// Physics ground (static box instead of plane for stability)
const groundBody = new CANNON.Body({
  type: CANNON.Body.STATIC,
  shape: new CANNON.Box(new CANNON.Vec3(10, 10, 0.1)),
});
groundBody.position.set(0, 0, CFG.groundZ - 0.05);
world.addBody(groundBody);

// Contact material factory
function createPhysMaterial(type) {
  const params = MATERIAL_PARAMS[type];
  if (!params) {
    console.warn('Unknown material type:', type);
    return { material: world.defaultContactMaterial, params: null };
  }
  const material = new CANNON.Material(type);
  // Contact with ground (world.defaultMaterial)
  const contactGround = new CANNON.ContactMaterial(world.defaultMaterial, material, {
    friction: params.friction,
    restitution: params.restitution
  });
  world.addContactMaterial(contactGround);
  // Contact between same material types
  const contactSelf = new CANNON.ContactMaterial(material, material, {
    friction: params.friction * 0.8,
    restitution: params.restitution * 0.5
  });
  world.addContactMaterial(contactSelf);
  return { material, params };
}

// ═══ 3c. MOCK DATA ═══

const MOCK_ANALYSIS = {
  objects: [
    {
      id: 1, name: '书本', material: 'paper', mesh_type: 'box',
      pos: [-1.2, 0.3, -0.5], size: [1.4, 0.2, 1.0], color: '#c4956b',
    },
    {
      id: 2, name: '咖啡杯', material: 'glass', mesh_type: 'cylinder',
      pos: [0.4, -0.1, -0.3], size: [0.35, 0.35, 0.8], color: '#e8ddd0',
    },
    {
      id: 3, name: '苹果', material: 'plastic', mesh_type: 'sphere',
      pos: [1.3, 0.1, -0.4], size: [0.35], color: '#cc3333',
    },
    {
      id: 4, name: '笔筒', material: 'metal', mesh_type: 'cylinder',
      pos: [-0.8, -0.2, -0.6], size: [0.25, 0.3, 1.1], color: '#8899aa',
    },
    {
      id: 5, name: '橡皮', material: 'plastic', mesh_type: 'box',
      pos: [1.8, 0.2, -0.35], size: [0.3, 0.15, 0.2], color: '#ee8844',
    },
  ],
  background_color: '#2a2520',
};

// ═══ 3d. SCENE BUILDER ═══

function computeVolume(obj) {
  if (obj.mesh_type === 'box') {
    const [w, h, d] = obj.size;
    return w * h * d;
  } else if (obj.mesh_type === 'sphere') {
    const [r] = obj.size;
    return (4 / 3) * Math.PI * r * r * r;
  } else if (obj.mesh_type === 'cylinder') {
    const [rTop, rBot, h] = obj.size;
    const rAvg = (rTop + rBot) / 2;
    return Math.PI * rAvg * rAvg * h;
  }
  return 0.001;
}

function createShadowTexture() {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  gradient.addColorStop(0, 'rgba(0,0,0,0.6)');
  gradient.addColorStop(0.5, 'rgba(0,0,0,0.2)');
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}

function buildScene(analysisData) {
  // Clear any existing objects before building new scene
  clearAllObjects();
  const objectGroup = new THREE.Group();
  currentObjectGroup = objectGroup;

  for (const obj of analysisData.objects) {
    const physMat = createPhysMaterial(obj.material);
    let mesh, shape;

    if (obj.mesh_type === 'box') {
      const [w, h, d] = obj.size;
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(obj.color),
        roughness: obj.material === 'metal' ? 0.3 : 0.7,
        metalness: obj.material === 'metal' ? 0.8 : 0.05,
      });
      mesh = new THREE.Mesh(geo, mat);
      shape = new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2));
    } else if (obj.mesh_type === 'sphere') {
      const [r] = obj.size;
      const geo = new THREE.SphereGeometry(r, 32, 32);
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(obj.color),
        roughness: obj.material === 'metal' ? 0.3 : 0.7,
        metalness: obj.material === 'metal' ? 0.8 : 0.05,
      });
      mesh = new THREE.Mesh(geo, mat);
      shape = new CANNON.Sphere(r);
    } else if (obj.mesh_type === 'cylinder') {
      const [rTop, rBot, h] = obj.size;
      const geo = new THREE.CylinderGeometry(rTop, rBot, h, 32);
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(obj.color),
        roughness: obj.material === 'metal' ? 0.3 : 0.7,
        metalness: obj.material === 'metal' ? 0.8 : 0.05,
      });
      mesh = new THREE.Mesh(geo, mat);
      shape = new CANNON.Cylinder(rTop, rBot, h, 16);
    } else {
      // fallback: box
      const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(obj.color || '#888888'),
        roughness: obj.material === 'metal' ? 0.3 : 0.7,
        metalness: obj.material === 'metal' ? 0.8 : 0.05,
      });
      mesh = new THREE.Mesh(geo, mat);
      shape = new CANNON.Box(new CANNON.Vec3(0.25, 0.25, 0.25));
    }

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const volume = computeVolume(obj);
    const density = physMat.params ? physMat.params.density : 1000;
    const mass = density * volume;

    const body = new CANNON.Body({
      mass,
      shape,
      material: physMat.material,
      linearDamping: 0.4,
      angularDamping: 0.6,
      sleepSpeedLimit: 0.15,
      sleepTimeLimit: 0.5,
    });
    body.position.set(obj.pos[0], obj.pos[1], obj.pos[2]);

    mesh.position.copy(body.position);

    objectGroup.add(mesh);
    world.addBody(body);

    // Drop shadow disc
    const shadowSize = obj.mesh_type === 'box'
      ? Math.max(obj.size[0], obj.size[2]) * 1.15
      : (obj.size[0] || 0.5) * 2.2;
    const shadowGeo = new THREE.PlaneGeometry(shadowSize, shadowSize);
    const shadowTex = createShadowTexture();
    const shadowMat = new THREE.MeshBasicMaterial({
      map: shadowTex,
      transparent: true,
      opacity: 0.3,
      depthWrite: false,
    });
    const shadowDisc = new THREE.Mesh(shadowGeo, shadowMat);
    shadowDisc.rotation.x = -Math.PI / 2;
    shadowDisc.position.x = mesh.position.x;
    shadowDisc.position.y = mesh.position.y;
    shadowDisc.position.z = CFG.groundZ + 0.002;
    shadowDisc.renderOrder = 1;
    shadowDisc.material.depthTest = false;
    objectGroup.add(shadowDisc);

    S.objects.push({ id: obj.id, name: obj.name, mesh, body, shadowDisc, material: obj.material, physParams: physMat.params });
  }

  scene.add(objectGroup);

  // Background plane
  const bgGeo = new THREE.PlaneGeometry(16, 10);
  const bgMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(analysisData.background_color),
    roughness: 0.9,
    metalness: 0.05,
  });
  const bgPlane = new THREE.Mesh(bgGeo, bgMat);
  bgPlane.position.z = CFG.backgroundZ;
  bgPlane.receiveShadow = true;
  scene.add(bgPlane);
}

buildScene(MOCK_ANALYSIS);

// ═══ 3e. GESTURE TRACKING (MediaPipe Hands) ═══

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],
  [0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17],
];

const handSkeletons = new THREE.Group();
handSkeletons.visible = false;
scene.add(handSkeletons);

const videoEl = document.getElementById('camera-feed');
const camPreviewVideo = document.getElementById('cam-preview-video');
let handsInstance = null;

async function initHands() {
  document.getElementById('loading-text').textContent = '初始化摄像头...';

  const Hands = window.Hands;
  handsInstance = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
  });

  handsInstance.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.3,
  });

  handsInstance.onResults(onHandResults);
  document.getElementById('loading-text').textContent = '加载 AI 模型...';

  // Get camera
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480, facingMode: 'user' }
  });
  videoEl.srcObject = stream;
  camPreviewVideo.srcObject = stream;
  document.getElementById('loading-text').textContent = '启用手势追踪...';
  await videoEl.play();

  // Process frames
  async function processFrame() {
    if (videoEl.readyState >= 2) {
      await handsInstance.send({ image: videoEl });
    }
    requestAnimationFrame(processFrame);
  }
  processFrame();
  document.getElementById('loading-text').textContent = '就绪';
  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
  }, 500);
}

function onHandResults(results) {
  S.hands = [];

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    handSkeletons.visible = true;

    // Collect all detections, keep up to 2, fix duplicate labels
    const detections = results.multiHandLandmarks.map((landmarks, idx) => ({
      landmarks,
      label: results.multiHandedness[idx].label,
      x: landmarks[0].x, // wrist X for position-based disambiguation
    }));

    // If both hands have same label, use position to assign Left/Right
    if (detections.length === 2 && detections[0].label === detections[1].label) {
      // Left side of frame = Left hand, right side = Right hand
      detections.sort((a, b) => a.x - b.x);
      detections[0].label = 'Left';
      detections[1].label = 'Right';
    }

    // Take at most 2, prefer one of each
    const kept = [];
    const seen = {};
    detections.forEach(d => {
      if (kept.length >= 2) return;
      if (seen[d.label]) return;
      seen[d.label] = true;
      kept.push(d);
    });

    kept.forEach(d => {
      const gesture = recognizeGesture(d.landmarks);
      S.hands.push({
        landmarks: d.landmarks,
        handedness: d.label,
        gesture,
        worldCoords: d.landmarks.map(lm => ({
          x: (lm.x - 0.5) * 2,
          y: -(lm.y - 0.5) * 2,
          z: lm.z * -CFG.depthScale,
        })),
      });
    });

    updateHandSkeletons();
  } else {
    handSkeletons.visible = false;
    S.hands = [];
  }
}

function recognizeGesture(landmarks) {
  const fingerTips = [4, 8, 12, 16, 20];
  const fingerPips = [2, 6, 10, 14, 18];

  const extensions = [];
  for (let i = 0; i < 5; i++) {
    const tip = landmarks[fingerTips[i]];
    const pip = landmarks[fingerPips[i]];
    const wrist = landmarks[0];
    const tipDist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y, tip.z - wrist.z);
    const pipDist = Math.hypot(pip.x - wrist.x, pip.y - wrist.y, pip.z - wrist.z);
    extensions.push(tipDist / Math.max(pipDist, 0.001));
  }

  const thumbTip = landmarks[4];
  const indexTip = landmarks[8];
  const thumbIndexDist = Math.hypot(
    thumbTip.x - indexTip.x,
    thumbTip.y - indexTip.y,
    thumbTip.z - indexTip.z
  );

  const allFingersExt = (extensions[1] + extensions[2] + extensions[3] + extensions[4]) / 4;

  if (thumbIndexDist < 0.06) return 'pinch';
  if (allFingersExt < CFG.fistThreshold) return 'fist';
  if (allFingersExt > CFG.openThreshold) return 'open';
  return 'relaxed';
}

// Helper: create a cylinder between two 3D points
function createBone(a, b, radius, material) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 0.001) return new THREE.Group();
  const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  const geo = new THREE.CylinderGeometry(radius, radius, len, 8);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.copy(mid);
  // Align cylinder (default Y axis) to the direction vector
  const up = new THREE.Vector3(0, 1, 0);
  const quat = new THREE.Quaternion().setFromUnitVectors(up, dir.normalize());
  mesh.setRotationFromQuaternion(quat);
  return mesh;
}

function updateHandSkeletons() {
  while (handSkeletons.children.length > 0) {
    const child = handSkeletons.children[0];
    if (child.geometry) child.geometry.dispose();
    if (child.material) child.material.dispose();
    handSkeletons.remove(child);
  }

  S.hands.forEach((hand) => {
    const isPrimary = hand.handedness === 'Right';
    const color = isPrimary ? 0xd4a574 : 0x7eb8da;

    const points = hand.worldCoords.map(wc =>
      new THREE.Vector3(wc.x, wc.y, wc.z)
    );

    // Shared material for this hand
    const boneMat = new THREE.MeshStandardMaterial({
      color,
      roughness: 0.3,
      metalness: 0.1,
      transparent: true,
      opacity: 0.75,
    });

    // Bones: cylinders between connected joints
    HAND_CONNECTIONS.forEach(([a, b]) => {
      const radius = [4,8,12,16,20].includes(b) ? 0.008 : 0.012;
      const bone = createBone(points[a], points[b], radius, boneMat);
      handSkeletons.add(bone);
    });

    // Joints: spheres
    points.forEach((p, i) => {
      const isTip = [4, 8, 12, 16, 20].includes(i);
      const r = isTip ? 0.018 : 0.014;
      const geo = new THREE.SphereGeometry(r, 12, 12);
      const mat = new THREE.MeshStandardMaterial({
        color,
        roughness: 0.2,
        metalness: 0.2,
        transparent: true,
        opacity: isTip ? 0.9 : 0.7,
      });
      const sphere = new THREE.Mesh(geo, mat);
      sphere.position.copy(p);
      handSkeletons.add(sphere);
    });
  });
}

// ═══ 3f. INTERACTION ═══

function getPinchCenter(hand) {
  const thumb = hand.worldCoords[4];
  const index = hand.worldCoords[8];
  return {
    x: (thumb.x + index.x) / 2,
    y: (thumb.y + index.y) / 2,
    z: (thumb.z + index.z) / 2,
  };
}

function tryGrab(hand) {
  const pinch = getPinchCenter(hand);
  const pinchPos = new CANNON.Vec3(pinch.x, pinch.y, pinch.z);

  let closest = null;
  let closestDist = Infinity;

  S.objects.forEach(obj => {
    const dist = obj.body.position.distanceTo(pinchPos);
    if (dist < 0.5 && dist < closestDist) {
      closest = obj;
      closestDist = dist;
    }
  });

  if (closest) {
    S.grabbedObj = closest.id;
    closest.body.wakeUp();

    const localPinch = new CANNON.Vec3(
      pinch.x - closest.body.position.x,
      pinch.y - closest.body.position.y,
      pinch.z - closest.body.position.z
    );

    S.constraint = new CANNON.PointToPointConstraint(
      closest.body,
      localPinch,
      new CANNON.Vec3(pinch.x, pinch.y, pinch.z)
    );
    world.addConstraint(S.constraint);

    // Visual feedback: highlight object
    closest.mesh.material.emissive = new THREE.Color(0x332211);
    closest.mesh.material.emissiveIntensity = 0.5;

    console.log('Grabbed:', closest.name);
  }
}

function updateGrabAnchor(hand) {
  const pinch = getPinchCenter(hand);
  if (S.constraint) {
    S.constraint.pivotB.set(pinch.x, pinch.y, pinch.z);
  }
}

function releaseObject() {
  if (S.constraint) {
    world.removeConstraint(S.constraint);
    S.constraint = null;
  }

  if (S.grabbedObj !== null) {
    const obj = S.objects.find(o => o.id === S.grabbedObj);
    if (obj) {
      obj.mesh.material.emissive = new THREE.Color(0x000000);
      obj.mesh.material.emissiveIntensity = 0;
      console.log('Released:', obj.name);
    }
    S.grabbedObj = null;
  }
}

let prevSecFingerDist = null;
// Smoothing: reduce hand tracking jitter
const smoothWrist = { x: 0, y: 0, z: 0 };
let smoothWristInit = false;

function handleSceneControl(hand) {
  const wrist = hand.worldCoords[0];

  // Exponential smoothing to reduce jitter
  const alpha = 0.3; // lower = smoother
  if (!smoothWristInit) {
    smoothWrist.x = wrist.x;
    smoothWrist.y = wrist.y;
    smoothWrist.z = wrist.z;
    smoothWristInit = true;
  } else {
    smoothWrist.x += (wrist.x - smoothWrist.x) * alpha;
    smoothWrist.y += (wrist.y - smoothWrist.y) * alpha;
    smoothWrist.z += (wrist.z - smoothWrist.z) * alpha;
  }

  // Layout: OBJECTS ← HAND ← CAMERA (camera behind hand, looking at objects)
  const camDist = 2.5;
  cameraTargetPos.set(
    smoothWrist.x,
    smoothWrist.y + camDist,
    smoothWrist.z + 0.5
  );
  // Look past the hand toward the objects on the ground
  cameraTargetLook.set(
    smoothWrist.x,
    smoothWrist.y - 1.5,
    -2.0
  );

  // Two-finger spread = zoom
  const indexTip = hand.worldCoords[8];
  const middleTip = hand.worldCoords[12];
  const fingerDist = Math.hypot(
    indexTip.x - middleTip.x,
    indexTip.y - middleTip.y,
    indexTip.z - middleTip.z
  );
  if (prevSecFingerDist !== null && fingerDist > 0.001) {
    const ratio = fingerDist / Math.max(prevSecFingerDist, 0.001);
    const newDist = Math.max(1.0, Math.min(6.0, camDist / ratio));
    cameraTargetPos.set(
      smoothWrist.x,
      smoothWrist.y + newDist,
      smoothWrist.z + 0.5
    );
  }
  prevSecFingerDist = fingerDist;

}

// ═══ 3g. PARTICLE SYSTEM ═══

// Particle pool
const MAX_PARTICLES = 200;
const particlesPool = [];
const particleGroup = new THREE.Group();
scene.add(particleGroup);

// Create shared geometry (small sphere)
const particleGeo = new THREE.SphereGeometry(0.015, 4, 4);

for (let i = 0; i < MAX_PARTICLES; i++) {
  const mat = new THREE.MeshBasicMaterial({
    color: 0xd4a574,
    transparent: true,
    opacity: 0,
  });
  const p = new THREE.Mesh(particleGeo, mat);
  p.visible = false;
  p.userData = { life: 0, velocity: new THREE.Vector3() };
  particleGroup.add(p);
  particlesPool.push(p);
}

function spawnParticles(position, count = 15) {
  let spawned = 0;
  const pos = new THREE.Vector3(position.x, position.y, position.z);
  particlesPool.forEach(p => {
    if (spawned >= count) return;
    if (p.userData.life <= 0) {
      p.position.copy(pos);
      p.userData.velocity.set(
        (Math.random() - 0.5) * 0.05,
        (Math.random() - 0.5) * 0.05,
        (Math.random() - 0.5) * 0.05
      );
      p.userData.life = 0.6 + Math.random() * 0.4;
      p.visible = true;
      p.material.opacity = 1;
      p.scale.setScalar(1);
      spawned++;
    }
  });
}

function updateParticles(dt) {
  particlesPool.forEach(p => {
    if (p.userData.life > 0) {
      p.userData.life -= dt;
      const vel = p.userData.velocity.clone().multiplyScalar(dt * 0.3);
      p.position.add(vel);
      p.userData.velocity.z += CFG.gravity * dt * 0.1;
      p.material.opacity = Math.max(0, p.userData.life);
      p.scale.setScalar(Math.max(0, p.userData.life));
      if (p.userData.life <= 0) {
        p.visible = false;
        p.material.opacity = 0;
      }
    }
  });
}

// ═══ 3h. PROXIMITY GLOW ═══

function updateProximityGlow() {
  S.objects.forEach(obj => {
    // Skip grabbed objects (they already have highlight)
    if (S.grabbedObj === obj.id) return;

    // Reset glow for non-grabbed objects
    if (obj.mesh.material.emissive) {
      obj.mesh.material.emissive = new THREE.Color(0x000000);
      obj.mesh.material.emissiveIntensity = 0;
    }

    // Check hand proximity
    S.hands.forEach(hand => {
      const pinch = getPinchCenter(hand);
      const objPos = obj.mesh.position;
      const dist = Math.hypot(
        pinch.x - objPos.x,
        pinch.y - objPos.y,
        pinch.z - objPos.z
      );

      if (dist < 0.35) {
        // Closer = brighter golden glow
        const glowIntensity = (1 - dist / 0.35) * 0.4;
        obj.mesh.material.emissive = new THREE.Color(0xd4a574);
        obj.mesh.material.emissiveIntensity = glowIntensity;

        // Contact particles when very close
        if (dist < 0.08) {
          spawnParticles({ x: pinch.x, y: pinch.y, z: pinch.z }, 2);
        }
      }
    });
  });
}

// ═══ 6. UI HANDLERS ═══

// ── Toast ──
function showToast(msg) {
  const toast = document.getElementById('hint-toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ── Reset Scene ──
function clearAllObjects() {
  releaseObject();
  S.objects.forEach(obj => {
    world.removeBody(obj.body);
    if (obj.mesh.parent) obj.mesh.parent.remove(obj.mesh);
    if (obj.shadowDisc && obj.shadowDisc.parent) obj.shadowDisc.parent.remove(obj.shadowDisc);
  });
  S.objects = [];
  if (currentObjectGroup && currentObjectGroup.parent) {
    currentObjectGroup.parent.remove(currentObjectGroup);
    // Dispose geometries and materials
    currentObjectGroup.traverse(child => {
      if (child.geometry) child.geometry.dispose();
      if (child.material) {
        if (child.material.map) child.material.map.dispose();
        child.material.dispose();
      }
    });
  }
  currentObjectGroup = null;
}

function resetScene() {
  clearAllObjects();
  buildScene(MOCK_ANALYSIS);
}

// ── Info Card ──
function updateInfoCard() {
  const card = document.getElementById('info-card');
  if (S.grabbedObj !== null) {
    const obj = S.objects.find(o => o.id === S.grabbedObj);
    if (obj) {
      card.classList.remove('hidden');
      card.classList.add('visible');
      document.getElementById('info-name').textContent = obj.name;
      document.getElementById('info-material').textContent = '材质: ' + obj.material;
      document.getElementById('info-weight').textContent = '质量: ' + obj.body.mass.toFixed(2) + ' kg';

      const pos = obj.mesh.position.clone();
      pos.project(camera);
      const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-pos.y * 0.5 + 0.5) * window.innerHeight;
      card.style.left = Math.max(10, Math.min(window.innerWidth - 160, x - 60)) + 'px';
      card.style.top = Math.max(10, Math.min(window.innerHeight - 120, y - 100)) + 'px';
    }
  } else {
    card.classList.add('hidden');
    card.classList.remove('visible');
  }
}

// ── Button Handlers ──
document.getElementById('btn-upload').addEventListener('click', () => {
  document.getElementById('file-input').click();
});

document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  showToast('AI 分析中...');
  // Future: replace with real API call
  setTimeout(() => showToast('使用演示场景'), 1500);

document.getElementById('btn-reset').addEventListener('click', () => {
  resetScene();

});

document.getElementById('btn-help').addEventListener('click', () => {
  document.getElementById('help-overlay').classList.add('show');
});


// ═══════════════════════════════════════════
// 4. ANIMATION LOOP
// ═══════════════════════════════════════════
const clock = new THREE.Clock();

function updateCameraEasing(dt) {
  const lerpFactor = 1 - Math.exp(-15 * dt);
  camera.position.lerp(cameraTargetPos, lerpFactor);
  S.cameraTarget.lerp(cameraTargetLook, lerpFactor);
  camera.lookAt(S.cameraTarget);
}

function animate() {
  requestAnimationFrame(animate);

  let dt = clock.getDelta();
  if (dt > 0.1) dt = 0.1;

  // Physics step (fixed timestep for stability)
  world.step(1 / 60, dt, 10);

  // Sync physics bodies to Three.js meshes
  S.objects.forEach(obj => {
    obj.mesh.position.copy(obj.body.position);
    obj.mesh.quaternion.copy(obj.body.quaternion);
    if (obj.shadowDisc) {
      obj.shadowDisc.position.x = obj.mesh.position.x;
      obj.shadowDisc.position.y = obj.mesh.position.y;
    }
  });

  // ── Hand assignment ──
  // Single hand: always primary (interaction). Two hands: Left=camera, Right=grab.
  const hasTwoHands = S.hands.length >= 2;
  const primaryHand = hasTwoHands
    ? S.hands.find(h => h.handedness === 'Right')
    : S.hands[0];
  const secondaryHand = hasTwoHands
    ? S.hands.find(h => h.handedness === 'Left')
    : null;

  // ── Interaction: Grab / Release ──
  if (primaryHand) {
    const isPinching = primaryHand.gesture === 'pinch';

    if (isPinching && !S.prevPinch) {
      tryGrab(primaryHand);
    } else if (!isPinching && S.prevPinch && S.grabbedObj !== null) {
      releaseObject();
    } else if (isPinching && S.grabbedObj !== null) {
      updateGrabAnchor(primaryHand);
    }

    S.prevPinch = isPinching;
  }

  // ── Scene Control: camera always follows hand ──
  const camHand = secondaryHand || primaryHand;
  if (camHand) {
    handleSceneControl(camHand);
  }


  updateProximityGlow();
  updateParticles(dt);
  updateInfoCard();
  updateCameraEasing(dt);
  renderer.render(scene, camera);
}
