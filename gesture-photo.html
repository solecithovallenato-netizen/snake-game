<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>手势物理照片</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a0f;
  overflow:hidden;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  color:#e8d5c4;
  user-select:none
}
#canvas-3d{
  display:block;
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh
}

/* ── Loading Screen ── */
#loading{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:#0a0a0f;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:100;
  transition:opacity .8s
}
#loading.hidden{opacity:0;pointer-events:none}
.spinner{
  width:30px;height:30px;
  border:2px solid rgba(212,165,116,.15);
  border-top-color:#d4a574;
  border-radius:50%;
  animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{
  font-size:14px;letter-spacing:4px;
  color:rgba(232,213,196,.5);margin-top:20px
}
#camera-feed{display:none}
</style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="spinner"></div>
  <p id="loading-text">正在启动</p>
</div>

<video id="camera-feed" playsinline style="display:none"></video>

<!-- 3D canvas -->
<canvas id="canvas-3d"></canvas>

<!-- MediaPipe Hands CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>

<!-- Three.js import map -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

// ═══════════════════════════════════════════
// 1. CONFIG
// ═══════════════════════════════════════════
const CFG = {
  gravity: -9.82,
  pinchThreshold: 0.02,
  openThreshold: 0.7,
  fistThreshold: 0.2,
  depthScale: 0.5,
  cameraFOV: 50,
  cameraNear: 0.1,
  cameraFar: 50,
  groundZ: -2,
  backgroundZ: 5
};

const MATERIAL_PARAMS = {
  wood:   { density: 600,  restitution: 0.3,  friction: 0.6 },
  metal:  { density: 7800, restitution: 0.05, friction: 0.25 },
  fabric: { density: 200,  restitution: 0.02, friction: 0.9 },
  glass:  { density: 2500, restitution: 0.01, friction: 0.3 },
  plastic:{ density: 1000, restitution: 0.4,  friction: 0.5 },
  paper:  { density: 700,  restitution: 0.1,  friction: 0.7 }
};

// ═══════════════════════════════════════════
// 2. STATE
// ═══════════════════════════════════════════
const S = {
  objects: [],
  hands: [],
  grabbedObj: null,
  constraint: null,
  prevPinch: false,
  cameraBaseZ: 3.5,
  cameraTarget: new THREE.Vector3(0, 0, 0),
  prevDualDist: null,
};

// ═══════════════════════════════════════════
// 3. THREE.JS SETUP
// ═══════════════════════════════════════════

// Renderer
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  canvas: document.getElementById('canvas-3d')
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.008);

// Camera
const camera = new THREE.PerspectiveCamera(
  CFG.cameraFOV,
  window.innerWidth / window.innerHeight,
  CFG.cameraNear,
  CFG.cameraFar
);
camera.position.set(0, 0.5, CFG.cameraBaseZ);
camera.lookAt(S.cameraTarget);

// ── Lights ──

// Ambient
const ambientLight = new THREE.AmbientLight(0x2a2040, 1.5);
scene.add(ambientLight);

// Key light (with shadows)
const keyLight = new THREE.DirectionalLight(0xffeedd, 6);
keyLight.position.set(5, 8, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 1024;
keyLight.shadow.mapSize.height = 1024;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -10;
keyLight.shadow.bias = -0.0001;
scene.add(keyLight);

// Rim light
const rimLight = new THREE.DirectionalLight(0x4466aa, 2);
rimLight.position.set(-3, 2, -2);
scene.add(rimLight);

// Fill light
const fillLight = new THREE.DirectionalLight(0xd4a574, 1.5);
fillLight.position.set(0, -0.5, 5);
scene.add(fillLight);

// ── Ground Plane ──
const groundGeo = new THREE.PlaneGeometry(20, 20);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x1a1820,
  roughness: 0.9,
  metalness: 0.1
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.position.z = CFG.groundZ;
ground.receiveShadow = true;
scene.add(ground);

// ── Grid Helper ──
const grid = new THREE.PolarGridHelper(8, 32, 64, 0x222233);
scene.add(grid);

// ═══ 3b. PHYSICS (Cannon-es) ═══

const world = new CANNON.World({
  gravity: new CANNON.Vec3(0, 0, CFG.gravity),
});
world.defaultContactMaterial.restitution = 0.1;
world.defaultContactMaterial.friction = 0.4;
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 10;

// Physics ground (static plane)
const groundBody = new CANNON.Body({
  type: CANNON.Body.STATIC,
  shape: new CANNON.Plane(),
});
groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0, 'XYZ');
groundBody.position.set(0, 0, CFG.groundZ);
world.addBody(groundBody);

// Contact material factory
function createPhysMaterial(type) {
  const params = MATERIAL_PARAMS[type];
  if (!params) {
    console.warn('Unknown material type:', type);
    return { material: world.defaultContactMaterial, params: null };
  }
  const material = new CANNON.Material(type);
  const contactMaterial = new CANNON.ContactMaterial(material, material, {
    friction: params.friction,
    restitution: params.restitution
  });
  world.addContactMaterial(contactMaterial);
  return { material, params };
}

// ═══ 3c. MOCK DATA ═══

const MOCK_ANALYSIS = {
  objects: [
    {
      id: 1, name: '书本', material: 'paper', mesh_type: 'box',
      pos: [-1.2, 0.3, -0.5], size: [1.4, 0.2, 1.0], color: '#c4956b',
    },
    {
      id: 2, name: '咖啡杯', material: 'glass', mesh_type: 'cylinder',
      pos: [0.4, -0.1, -0.3], size: [0.35, 0.35, 0.8], color: '#e8ddd0',
    },
    {
      id: 3, name: '苹果', material: 'plastic', mesh_type: 'sphere',
      pos: [1.3, 0.1, -0.4], size: [0.35], color: '#cc3333',
    },
    {
      id: 4, name: '笔筒', material: 'metal', mesh_type: 'cylinder',
      pos: [-0.8, -0.2, -0.6], size: [0.25, 0.3, 1.1], color: '#8899aa',
    },
    {
      id: 5, name: '橡皮', material: 'plastic', mesh_type: 'box',
      pos: [1.8, 0.2, -0.35], size: [0.3, 0.15, 0.2], color: '#ee8844',
    },
  ],
  background_color: '#2a2520',
};

// ═══ 3d. SCENE BUILDER ═══

function computeVolume(obj) {
  if (obj.mesh_type === 'box') {
    const [w, h, d] = obj.size;
    return w * h * d;
  } else if (obj.mesh_type === 'sphere') {
    const [r] = obj.size;
    return (4 / 3) * Math.PI * r * r * r;
  } else if (obj.mesh_type === 'cylinder') {
    const [rTop, rBot, h] = obj.size;
    const rAvg = (rTop + rBot) / 2;
    return Math.PI * rAvg * rAvg * h;
  }
  return 0.001;
}

function buildScene(analysisData) {
  const objectGroup = new THREE.Group();

  for (const obj of analysisData.objects) {
    const physMat = createPhysMaterial(obj.material);
    let mesh, shape;

    if (obj.mesh_type === 'box') {
      const [w, h, d] = obj.size;
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(obj.color),
        roughness: obj.material === 'metal' ? 0.3 : 0.7,
        metalness: obj.material === 'metal' ? 0.8 : 0.05,
      });
      mesh = new THREE.Mesh(geo, mat);
      shape = new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2));
    } else if (obj.mesh_type === 'sphere') {
      const [r] = obj.size;
      const geo = new THREE.SphereGeometry(r, 32, 32);
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(obj.color),
        roughness: obj.material === 'metal' ? 0.3 : 0.7,
        metalness: obj.material === 'metal' ? 0.8 : 0.05,
      });
      mesh = new THREE.Mesh(geo, mat);
      shape = new CANNON.Sphere(r);
    } else if (obj.mesh_type === 'cylinder') {
      const [rTop, rBot, h] = obj.size;
      const geo = new THREE.CylinderGeometry(rTop, rBot, h, 32);
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(obj.color),
        roughness: obj.material === 'metal' ? 0.3 : 0.7,
        metalness: obj.material === 'metal' ? 0.8 : 0.05,
      });
      mesh = new THREE.Mesh(geo, mat);
      shape = new CANNON.Cylinder(rTop, rBot, h, 16);
    } else {
      // fallback: box
      const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(obj.color || '#888888'),
        roughness: obj.material === 'metal' ? 0.3 : 0.7,
        metalness: obj.material === 'metal' ? 0.8 : 0.05,
      });
      mesh = new THREE.Mesh(geo, mat);
      shape = new CANNON.Box(new CANNON.Vec3(0.25, 0.25, 0.25));
    }

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const volume = computeVolume(obj);
    const density = physMat.params ? physMat.params.density : 1000;
    const mass = density * volume;

    const body = new CANNON.Body({
      mass,
      shape,
      material: physMat.material,
      linearDamping: 0.1,
      angularDamping: 0.3,
    });
    body.position.set(obj.pos[0], obj.pos[1], obj.pos[2]);

    mesh.position.copy(body.position);

    objectGroup.add(mesh);
    world.addBody(body);

    S.objects.push({ id: obj.id, name: obj.name, mesh, body, material: obj.material, physParams: physMat.params });
  }

  scene.add(objectGroup);

  // Background plane
  const bgGeo = new THREE.PlaneGeometry(16, 10);
  const bgMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(analysisData.background_color),
    roughness: 0.9,
    metalness: 0.05,
  });
  const bgPlane = new THREE.Mesh(bgGeo, bgMat);
  bgPlane.position.z = CFG.backgroundZ;
  bgPlane.receiveShadow = true;
  scene.add(bgPlane);
}

buildScene(MOCK_ANALYSIS);

// ═══ 3e. GESTURE TRACKING (MediaPipe Hands) ═══

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],
  [0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17],
];

const handSkeletons = new THREE.Group();
handSkeletons.visible = false;
scene.add(handSkeletons);

const videoEl = document.getElementById('camera-feed');
let handsInstance = null;

async function initHands() {
  const Hands = window.Hands;
  handsInstance = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
  });

  handsInstance.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.5,
  });

  handsInstance.onResults(onHandResults);

  // Get camera
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480, facingMode: 'user' }
  });
  videoEl.srcObject = stream;
  await videoEl.play();

  // Process frames
  async function processFrame() {
    if (videoEl.readyState >= 2) {
      await handsInstance.send({ image: videoEl });
    }
    requestAnimationFrame(processFrame);
  }
  processFrame();

  document.getElementById('loading-text').textContent = '摄像头已就绪';
  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
  }, 500);
}

function onHandResults(results) {
  S.hands = [];

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    handSkeletons.visible = true;

    results.multiHandLandmarks.forEach((landmarks, idx) => {
      const handedness = results.multiHandedness[idx].label;
      const gesture = recognizeGesture(landmarks);

      S.hands.push({
        landmarks,
        handedness,
        gesture,
        worldCoords: landmarks.map(lm => ({
          x: (lm.x - 0.5) * 2,
          y: -(lm.y - 0.5) * 2,
          z: lm.z * -CFG.depthScale,
        })),
      });
    });

    updateHandSkeletons();
  } else {
    handSkeletons.visible = false;
    S.hands = [];
  }
}

function recognizeGesture(landmarks) {
  const fingerTips = [4, 8, 12, 16, 20];
  const fingerPips = [2, 6, 10, 14, 18];

  const extensions = [];
  for (let i = 0; i < 5; i++) {
    const tip = landmarks[fingerTips[i]];
    const pip = landmarks[fingerPips[i]];
    const wrist = landmarks[0];
    const tipDist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y, tip.z - wrist.z);
    const pipDist = Math.hypot(pip.x - wrist.x, pip.y - wrist.y, pip.z - wrist.z);
    extensions.push(tipDist / Math.max(pipDist, 0.001));
  }

  const thumbTip = landmarks[4];
  const indexTip = landmarks[8];
  const thumbIndexDist = Math.hypot(
    thumbTip.x - indexTip.x,
    thumbTip.y - indexTip.y,
    thumbTip.z - indexTip.z
  );

  const allFingersExt = (extensions[1] + extensions[2] + extensions[3] + extensions[4]) / 4;

  if (thumbIndexDist < 0.05) return 'pinch';
  if (allFingersExt < CFG.fistThreshold) return 'fist';
  if (allFingersExt > CFG.openThreshold) return 'open';
  return 'relaxed';
}

function updateHandSkeletons() {
  while (handSkeletons.children.length > 0) {
    handSkeletons.remove(handSkeletons.children[0]);
  }

  S.hands.forEach((hand) => {
    const isPrimary = hand.handedness === 'Right';
    const color = isPrimary ? 0xd4a574 : 0x7eb8da;  // gold for primary, blue for secondary

    const points = hand.landmarks.map(lm => {
      const x = (lm.x - 0.5) * 1.5;
      const y = -(lm.y - 0.5) * 1.0;
      const z = -lm.z * 0.8;
      return new THREE.Vector3(x, y, z);
    });

    HAND_CONNECTIONS.forEach(([a, b]) => {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([points[a], points[b]]);
      const lineMat = new THREE.LineBasicMaterial({
        color, transparent: true, opacity: 0.4, linewidth: 1,
      });
      handSkeletons.add(new THREE.Line(lineGeo, lineMat));
    });

    points.forEach((p, i) => {
      const isTip = [4, 8, 12, 16, 20].includes(i);
      const r = isTip ? 0.012 : 0.008;
      const sphereGeo = new THREE.SphereGeometry(r, 8, 8);
      const sphereMat = new THREE.MeshBasicMaterial({
        color, transparent: true, opacity: isTip ? 0.7 : 0.35,
      });
      const sphere = new THREE.Mesh(sphereGeo, sphereMat);
      sphere.position.copy(p);
      handSkeletons.add(sphere);
    });
  });
}

// ═══ 3f. INTERACTION ═══

function getPinchCenter(hand) {
  const thumb = hand.worldCoords[4];
  const index = hand.worldCoords[8];
  return {
    x: (thumb.x + index.x) / 2,
    y: (thumb.y + index.y) / 2,
    z: (thumb.z + index.z) / 2,
  };
}

function tryGrab(hand) {
  const pinch = getPinchCenter(hand);
  const pinchPos = new CANNON.Vec3(pinch.x, pinch.y, pinch.z);

  let closest = null;
  let closestDist = Infinity;

  S.objects.forEach(obj => {
    const dist = obj.body.position.distanceTo(pinchPos);
    if (dist < 0.3 && dist < closestDist) {
      closest = obj;
      closestDist = dist;
    }
  });

  if (closest) {
    S.grabbedObj = closest.id;
    closest.body.wakeUp();

    const localPinch = new CANNON.Vec3(
      pinch.x - closest.body.position.x,
      pinch.y - closest.body.position.y,
      pinch.z - closest.body.position.z
    );

    S.constraint = new CANNON.PointToPointConstraint(
      closest.body,
      localPinch,
      new CANNON.Vec3(pinch.x, pinch.y, pinch.z)
    );
    world.addConstraint(S.constraint);

    // Visual feedback: highlight object
    closest.mesh.material.emissive = new THREE.Color(0x332211);
    closest.mesh.material.emissiveIntensity = 0.5;

    console.log('Grabbed:', closest.name);
  }
}

function updateGrabAnchor(hand) {
  const pinch = getPinchCenter(hand);
  if (S.constraint) {
    S.constraint.pivotB.set(pinch.x, pinch.y, pinch.z);
  }
}

function releaseObject() {
  if (S.constraint) {
    world.removeConstraint(S.constraint);
    S.constraint = null;
  }

  if (S.grabbedObj !== null) {
    const obj = S.objects.find(o => o.id === S.grabbedObj);
    if (obj) {
      obj.mesh.material.emissive = new THREE.Color(0x000000);
      obj.mesh.material.emissiveIntensity = 0;
      console.log('Released:', obj.name);
    }
    S.grabbedObj = null;
  }
}

let prevSecHandPos = null;

function handleSceneControl(hand) {
  if (hand.gesture === 'fist') {
    const wrist = hand.worldCoords[0];
    if (prevSecHandPos) {
      const dx = wrist.x - prevSecHandPos.x;
      const dy = wrist.y - prevSecHandPos.y;
      S.cameraTarget.x -= dx * 3;
      S.cameraTarget.y -= dy * 3;
      camera.position.x -= dx * 3;
      camera.position.y -= dy * 3;
      camera.lookAt(S.cameraTarget);
    }
    prevSecHandPos = { x: wrist.x, y: wrist.y };
  } else {
    prevSecHandPos = null;
  }
}

// ═══════════════════════════════════════════
// 4. ANIMATION LOOP
// ═══════════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  let dt = clock.getDelta();
  if (dt > 0.1) dt = 0.1;

  // Physics step (fixed timestep for stability)
  world.step(1 / 60, dt, 3);

  // Sync physics bodies to Three.js meshes
  S.objects.forEach(obj => {
    obj.mesh.position.copy(obj.body.position);
    obj.mesh.quaternion.copy(obj.body.quaternion);
  });

  // ── Interaction: Grab / Release ──
  const primaryHand = S.hands.find(h => h.handedness === 'Right') || S.hands[0];

  if (primaryHand) {
    const isPinching = primaryHand.gesture === 'pinch';

    if (isPinching && !S.prevPinch) {
      tryGrab(primaryHand);
    } else if (!isPinching && S.prevPinch && S.grabbedObj !== null) {
      releaseObject();
    } else if (isPinching && S.grabbedObj !== null) {
      updateGrabAnchor(primaryHand);
    }

    S.prevPinch = isPinching;
  }

  // ── Scene Control (secondary hand) ──
  const secondaryHand = S.hands.find(h => h.handedness === 'Left');
  if (secondaryHand) {
    handleSceneControl(secondaryHand);
  }

  renderer.render(scene, camera);
}

// ═══════════════════════════════════════════
// 5. EVENT LISTENERS
// ═══════════════════════════════════════════

// Window resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Keyboard: Esc toggles a dummy for now
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    // Placeholder for future pause/reset
    console.log('Esc pressed');
  }
});

// ── Start ──

// Start hand tracking (replaces simple setTimeout)
initHands().catch(err => {
  console.warn('Camera not available, using demo mode:', err.message);
  document.getElementById('loading').classList.add('hidden');
});

animate();

console.log('%cgesture-photo %cready — Three.js skeleton active',
  'color:#d4a574', 'color:#e8d5c4');
console.log('%cScene objects:%c %d  %cLights:%c %d',
  'color:rgba(232,213,196,.5)', 'color:#e8d5c4', scene.children.length,
  'color:rgba(232,213,196,.5)', 'color:#e8d5c4',
  [ambientLight, keyLight, rimLight, fillLight].length);
</script>

</body>
</html>
