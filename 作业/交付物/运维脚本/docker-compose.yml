version: '3.8'

# ============================================================
# 政务数字门户平台 POC — Docker Compose 编排
# 项目: 博客站点 (Halo + MySQL + Nginx + 监控)
# 架构: ARM64 (aarch64)
# ============================================================

services:
  # ==================== 博客应用 ====================
  halo:
    image: halohub/halo:2.18
    container_name: halo
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - /data/halo:/root/.halo2
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/halo?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
      - SPRING_DATASOURCE_USERNAME=halo_user
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-HaloP@ss2026}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - HALO_WORK_DIR=/root/.halo2
    networks:
      - blog-net
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "192.168.20.10:3306:3306"  # 仅绑定业务网 IP
    volumes:
      - /data/mysql:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-RootP@ss2026}
      - MYSQL_DATABASE=halo
      - MYSQL_USER=halo_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-HaloP@ss2026}
      - TZ=Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=128M
      - --bind-address=0.0.0.0
    networks:
      - blog-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootP@ss2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== 反向代理 ====================
  nginx:
    image: nginx:1.24
    container_name: nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - blog-net
    depends_on:
      - halo
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== 监控: Prometheus ====================
  prometheus:
    image: prom/prometheus:v2.47
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - blog-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== 监控: Grafana ====================
  grafana:
    image: grafana/grafana:10.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /data/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-Admin@2026}
      - GF_INSTALL_PLUGINS=""
    networks:
      - blog-net
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== 监控: 主机指标采集 ====================
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers)($$|/)'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== 监控: 容器指标采集 ====================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==================== 网络 ====================
networks:
  blog-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# ==================== 卷 (数据持久化) ====================
# 以下目录需在宿主机预先创建:
#   /data/mysql      — MySQL 数据
#   /data/halo       — Halo 博客数据
#   /data/backup     — 数据库备份
#   /data/prometheus — Prometheus 时序数据
#   /data/grafana    — Grafana 配置和面板
