# ============================================================
# Nginx 配置 — 政务数字门户平台 POC
# 环境: 容器化部署 (docker-compose)，内部 DNS 解析服务名
# 功能: HTTPS 反向代理 → Halo (8090) + Grafana 子路径
#       HTTP → HTTPS 跳转 + 静态资源缓存 + Gzip
# 证书: /etc/nginx/ssl/blog.{crt,key} 自签名或正规证书
# 生成自签名证书: openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout /etc/nginx/ssl/blog.key -out /etc/nginx/ssl/blog.crt \
#   -subj "/C=CN/ST=Guangdong/L=Guangzhou/O=DMP-POC/CN=<服务器IP>"
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- 日志格式 ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---- 基础优化 ----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_disable "msie6";

    # ---- 客户端上传大小限制 ----
    client_max_body_size 100m;

    # ---- Nginx 状态端点（供 Prometheus 采集）----
    # server {
    #     listen 127.0.0.1:8080;
    #     location /nginx_status {
    #         stub_status on;
    #         allow 127.0.0.1;
    #         deny all;
    #     }
    # }

    # ========================================================
    # HTTP → HTTPS 重定向
    # ========================================================
    server {
        listen 80;
        server_name _;

        # 强制跳转 HTTPS
        return 301 https://$host$request_uri;
    }

    # ========================================================
    # HTTPS 主站
    # ========================================================
    server {
        listen 443 ssl http2;
        server_name _;

        # ---- SSL 证书 ----
        ssl_certificate     /etc/nginx/ssl/blog.crt;
        ssl_certificate_key /etc/nginx/ssl/blog.key;

        # ---- SSL 安全配置 ----
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---- 安全响应头 ----
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---- 博客前端 (Halo) ----
        location / {
            proxy_pass http://halo:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket 支持（Halo 实时编辑）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时
            proxy_connect_timeout 30s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;

            # 缓冲
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
        }

        # ---- Grafana 子路径代理 ----
        # 需在 Grafana 中配置:
        #   GF_SERVER_ROOT_URL=http://<host>/grafana/
        #   GF_SERVER_SERVE_FROM_SUB_PATH=true
        location /grafana/ {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- 静态资源缓存 ----
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://halo:8090;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
