# ============================================================
# 政务数字门户平台 POC — Docker Compose 编排
# 项目: 博客站点 (Halo) + MySQL + Nginx + 监控栈
# 架构: ARM64 (aarch64 / 鲲鹏920)
# 环境: openEuler 22.03, Docker / podman-docker
# 容器数: 7 (halo, mysql, nginx, prometheus, grafana,
#             node_exporter, cadvisor)
# 用法:
#   cp .env.example .env && vi .env    # 配置密码和路径
#   docker compose up -d               # 启动所有服务
#   docker compose logs -f             # 查看日志
#   docker compose down                # 停止所有服务
# ============================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ============================================================
  # 博客应用 — Halo 2.18
  # 端口: 8090
  # ============================================================
  halo:
    image: halohub/halo:2.18
    container_name: blog-halo
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ${DEPLOY_DIR:-/opt/blog}/data/halo:/root/.halo2:Z
    environment:
      # 使用 JDBC 连接 MySQL（兼容性和稳定性更好）
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/halo?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=halo_user
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-HaloP@ss2026}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - HALO_WORK_DIR=/root/.halo2
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - blog-net
    logging: *default-logging

  # ============================================================
  # 数据库 — MySQL 8.0
  # 端口: 3306（仅绑定业务网 IP）
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - ${DEPLOY_DIR:-/opt/blog}/data/mysql:/var/lib/mysql:Z
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-RootP@ss2026}
      - MYSQL_DATABASE=halo
      - MYSQL_USER=halo_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-HaloP@ss2026}
      - TZ=Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=128M
      - --bind-address=0.0.0.0
      - --skip-name-resolve
    networks:
      - blog-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootP@ss2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    # ARM64 兼容说明: MySQL 8.0 官方镜像支持 linux/arm64

  # ============================================================
  # 反向代理 — Nginx
  # 端口: 80 (HTTP) / 443 (HTTPS)
  # ============================================================
  nginx:
    image: nginx:1.25
    container_name: blog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DEPLOY_DIR:-/opt/blog}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ${DEPLOY_DIR:-/opt/blog}/nginx/ssl:/etc/nginx/ssl:ro,Z
      - /etc/localtime:/etc/localtime:ro
    networks:
      - blog-net
    depends_on:
      - halo
    logging: *default-logging

  # ============================================================
  # 监控: Prometheus 时序数据库
  # 端口: 9090
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.47
    container_name: blog-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ${DEPLOY_DIR:-/opt/blog}/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ${DEPLOY_DIR:-/opt/blog}/data/prometheus:/prometheus:Z
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - blog-net
    logging: *default-logging

  # ============================================================
  # 监控: Grafana 可视化面板
  # 端口: 3000
  # 默认用户: admin / Admin@2026
  # ============================================================
  grafana:
    image: grafana/grafana:10.0
    container_name: blog-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ${DEPLOY_DIR:-/opt/blog}/data/grafana:/var/lib/grafana:Z
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-Admin@2026}
      # 如需通过 Nginx 子路径 /grafana/ 访问，取消注释下方两行:
      # - GF_SERVER_ROOT_URL=http://localhost/grafana/
      # - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_INSTALL_PLUGINS=""
    networks:
      - blog-net
    depends_on:
      - prometheus
    logging: *default-logging

  # ============================================================
  # 监控: 主机指标采集 (node_exporter)
  # 端口: 9100 (host 网络模式)
  # 使用 host 网络模式以采集宿主机真实指标
  # ============================================================
  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: blog-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers)($$|/)'
    logging: *default-logging

  # ============================================================
  # 监控: 容器指标采集 (cAdvisor)
  # 端口: 8080
  # ARM64 专用: 使用 gcr.io/cadvisor/cadvisor 支持 arm64
  # 若 gcr.io 不可达，可尝试阿里云镜像:
  #   registry.cn-hangzhou.aliyuncs.com/google_containers/cadvisor:v0.49.1
  # ============================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: blog-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - blog-net
    logging: *default-logging

# ============================================================
# 内部网络
# ============================================================
networks:
  blog-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# ============================================================
# 数据目录（需提前创建，deploy.sh 自动处理）
#
# ${DEPLOY_DIR:-/opt/blog}/
#   ├── docker-compose.yml       # 本编排文件
#   ├── .env                     # 环境变量（密码、路径）
#   ├── nginx/
#   │   ├── nginx.conf           # Nginx 配置
#   │   └── ssl/                 # SSL 证书目录
#   │       ├── blog.crt
#   │       └── blog.key
#   ├── data/
#   │   ├── mysql/               # MySQL 数据
#   │   ├── halo/                # Halo 博客数据
#   │   ├── prometheus/          # Prometheus 时序数据
#   │   └── grafana/             # Grafana 配置和面板
#   ├── backups/                 # 数据库备份
#   └── logs/                    # 运行日志
# ============================================================
