<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  :root {
    --bg: #1a1a1e;
    --surface: rgba(28, 28, 34, 0.85);
    --accent: #c9a96e;
    --accent-dim: rgba(201, 169, 110, 0.2);
    --gold: #d4af6c;
    --text: #e8e4df;
    --text-dim: #72706b;
    --danger: #c9514a;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.008) 40px, rgba(255,255,255,0.008) 41px),
      repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.008) 40px, rgba(255,255,255,0.008) 41px);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow-x: hidden; overflow-y: auto;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: default;
  }

  .game-wrapper { cursor: none; }
  .game-wrapper .overlay.active { cursor: default; }
  .game-wrapper .overlay.active .btn { cursor: pointer; }
  .game-wrapper .overlay.active .name-input { cursor: text; }
  .btn, .lb-btn, .dpad-btn, .name-input, .lb-close { cursor: pointer; }

  .container {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    gap: 24px;
  }

  .title {
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 300;
    letter-spacing: 10px;
    color: var(--text);
  }

  .score-panel {
    display: flex; gap: 40px;
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 14px 36px;
    box-shadow: 0 2px 24px rgba(0,0,0,0.3);
  }
  .score-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 2px;
  }
  .score-label {
    font-size: 10px; font-weight: 500;
    letter-spacing: 4px;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .score-value {
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 34px; font-weight: 500;
    color: var(--text);
    min-width: 60px; text-align: center;
    transition: all 0.15s ease;
  }
  .score-value.pop { animation: scorePop 0.3s ease-out; }
  @keyframes scorePop {
    0% { transform: scale(1); }
    40% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .score-value.high { color: var(--gold); }

  .game-wrapper {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 12px 48px rgba(0,0,0,0.5);
    transition: box-shadow 0.5s ease;
    max-width: 100%;
  }
  .game-wrapper.game-over-glow {
    box-shadow: 0 0 0 1px rgba(201,81,74,0.3), 0 12px 48px rgba(0,0,0,0.5);
  }

  canvas#gameCanvas {
    display: block;
    background: #16161c;
    border-radius: var(--radius);
    width: 100%;
    height: auto;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    background: rgba(22, 22, 28, 0.92);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: var(--radius);
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .overlay.active { opacity: 1; pointer-events: auto; }

  .countdown-number {
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 96px; font-weight: 300;
    color: var(--accent);
    animation: countPulse 0.6s ease-out;
  }
  @keyframes countPulse {
    0% { transform: scale(1.4); opacity: 0; }
    60% { transform: scale(0.95); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .countdown-go {
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 64px; font-weight: 300;
    color: var(--text);
    animation: countPulse 0.5s ease-out;
  }
  .pause-icon {
    font-size: 56px; color: var(--text-dim);
    margin-bottom: 8px;
  }

  .overlay-title {
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 300;
    letter-spacing: 4px;
    color: var(--text);
    animation: overlayTitleIn 0.4s ease-out;
  }
  @keyframes overlayTitleIn {
    0% { transform: translateY(-16px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .overlay-score {
    font-size: 16px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }
  .overlay-score span {
    color: var(--gold);
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 48px; font-weight: 500;
  }

  .btn {
    font-size: 13px; font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 13px 38px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0) scale(0.98); }

  .hint {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    animation: fadeHint 3s ease-in-out infinite;
  }
  @keyframes fadeHint {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.8; }
  }

  .mobile-controls {
    display: none;
    width: 100%; max-width: 400px;
  }
  .dpad {
    display: grid;
    grid-template-areas: ". up ." "left . right" ". down .";
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    width: min(180px, 45vw);
    margin: 0 auto;
  }
  .dpad-btn {
    aspect-ratio: 1;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    background: var(--surface);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex; justify-content: center; align-items: center;
    font-size: 20px; color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad-btn:active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
    transform: scale(0.92);
  }
  .dpad-up { grid-area: up; }
  .dpad-left { grid-area: left; }
  .dpad-right { grid-area: right; }
  .dpad-down { grid-area: down; }

  .lb-btn {
    font-size: 11px; font-weight: 500;
    letter-spacing: 3px;
    padding: 9px 22px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .lb-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }
  .lb-btn:active { transform: translateY(0) scale(0.98); }

  .lb-modal-bg {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(3px);
    display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .lb-modal-bg.active { opacity: 1; pointer-events: auto; }

  .lb-modal {
    background: var(--surface);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 32px;
    width: min(420px, 90vw);
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    transform: translateY(16px);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .lb-modal-bg.active .lb-modal { transform: translateY(0); }

  .lb-modal-title {
    font-size: 22px; font-weight: 300;
    letter-spacing: 6px;
    text-align: center;
    color: var(--text);
    margin-bottom: 24px;
  }

  .lb-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    border-radius: 10px;
    margin-bottom: 4px;
    transition: background 0.2s ease;
  }
  .lb-row:hover { background: rgba(255, 255, 255, 0.03); }
  .lb-row.top1 { background: rgba(212, 175, 108, 0.08); }
  .lb-row.top2 { background: rgba(180, 180, 180, 0.05); }
  .lb-row.top3 { background: rgba(180, 140, 100, 0.05); }

  .lb-rank {
    font-size: 16px; font-weight: 600;
    width: 36px; text-align: center;
    color: var(--text-dim);
  }
  .lb-row.top1 .lb-rank { color: var(--gold); }
  .lb-row.top2 .lb-rank { color: #b0b0b0; }
  .lb-row.top3 .lb-rank { color: #b48c64; }

  .lb-name {
    flex: 1;
    font-size: 14px; font-weight: 400;
    color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lb-score {
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 15px; font-weight: 500;
    color: var(--accent);
  }

  .lb-empty {
    text-align: center; padding: 32px 0;
    color: var(--text-dim); font-size: 14px;
  }

  .lb-loading {
    text-align: center; padding: 32px 0;
    color: var(--text-dim); font-size: 14px;
    animation: fadeHint 1.5s ease-in-out infinite;
  }

  .lb-close {
    display: block; margin: 20px auto 0;
  }

  .name-input {
    font-size: 15px; font-weight: 400;
    letter-spacing: 1px;
    text-align: center;
    padding: 10px 20px;
    width: 200px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50px;
    background: rgba(0, 0, 0, 0.3);
    color: var(--text);
    outline: none;
    transition: all 0.25s ease;
  }
  .name-input:focus {
    border-color: var(--accent);
  }
  .name-input::placeholder { color: var(--text-dim); }

  .submit-status {
    font-size: 12px;
    min-height: 18px;
    color: var(--text-dim);
    transition: all 0.3s ease;
  }
  .submit-status.error { color: var(--danger); }
  .submit-status.success { color: var(--accent); }

  @media (max-width: 640px), (hover: none) and (pointer: coarse) {
    .mobile-controls { display: block; }
    .container { gap: 12px; padding: 8px; }
    .score-panel { padding: 8px 20px; gap: 20px; }
    .score-value { font-size: 24px; }
    .title { font-size: 20px; letter-spacing: 5px; margin-top: 4px; }
    .hint { display: none; }
    body { cursor: auto; }
    .lb-modal { padding: 20px; }
    .lb-modal-title { font-size: 18px; }
    .game-wrapper { max-width: calc(100vw - 16px); }
    .countdown-number { font-size: 64px; }
    .countdown-go { font-size: 48px; }
    .btn { padding: 11px 28px; font-size: 12px; letter-spacing: 3px; }
    .lb-btn { font-size: 10px; padding: 7px 16px; }
  }
</style>
</head>
<body>

<!-- Leaderboard modal -->
<div class="lb-modal-bg" id="lbModalBg">
  <div class="lb-modal">
    <div class="lb-modal-title">🏆 排 行 榜</div>
    <div id="lbContent"><div class="lb-loading">加载中...</div></div>
    <button class="btn lb-close" id="btnLbClose">关 闭</button>
  </div>
</div>

<div class="container">
  <h1 class="title">贪 吃 蛇</h1>

  <div class="score-panel">
    <div class="score-item">
      <span class="score-label">得 分</span>
      <span class="score-value" id="score">0</span>
    </div>
    <div class="score-item">
      <span class="score-label">最 高</span>
      <span class="score-value high" id="highScore">0</span>
    </div>
  </div>

  <button class="lb-btn" id="btnLeaderboard">🏆 排行榜</button>

  <div class="game-wrapper" id="gameWrapper">
    <canvas id="gameCanvas"></canvas>
    <div class="overlay active" id="overlay">
      <div class="overlay-title">贪 吃 蛇</div>
      <button class="btn" id="btnStart">开始游戏</button>
      <p class="hint">方向键 / WASD 操控</p>
    </div>
  </div>

  <div class="mobile-controls">
    <div class="dpad">
      <button class="dpad-btn dpad-up">▲</button>
      <button class="dpad-btn dpad-left">◀</button>
      <button class="dpad-btn dpad-right">▶</button>
      <button class="dpad-btn dpad-down">▼</button>
    </div>
  </div>
</div>

<script>
// ── Leaderboard (Firebase + localStorage) ──────────────
const FB_DB = 'https://snake-leaderboard-c6832-default-rtdb.firebaseio.com';
const LB_KEY = 'snakeLeaderboard';
const LB_MAX = 50;

function localScores() {
  try { return JSON.parse(localStorage.getItem(LB_KEY) || '[]'); }
  catch (e) { return []; }
}

function saveLocal(scores) {
  try { localStorage.setItem(LB_KEY, JSON.stringify(scores)); }
  catch (e) { /* quota exceeded */ }
}

function addToLocal(name, score) {
  const list = localScores();
  list.push({ name: String(name).trim().slice(0, 20) || 'Player', score: Math.floor(score), time: Date.now() });
  list.sort((a, b) => b.score - a.score);
  if (list.length > LB_MAX) list.length = LB_MAX;
  saveLocal(list);
  return list.findIndex(e => e.score === Math.floor(score)) + 1;
}

async function fetchFirebase() {
  try {
    const res = await fetch(`${FB_DB}/scores.json`, { signal: AbortSignal.timeout(5000) });
    if (!res.ok) throw new Error('fail');
    const obj = await res.json();
    if (!obj) return [];
    return Object.values(obj).sort((a, b) => b.score - a.score);
  } catch (e) { return null; }
}

async function submitToFirebase(name, score) {
  try {
    const res = await fetch(`${FB_DB}/scores.json`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: String(name).trim().slice(0, 20) || 'Player', score: Math.floor(score), time: Date.now() }),
      signal: AbortSignal.timeout(5000),
    });
    return res.ok;
  } catch (e) { return false; }
}

function mergeScoresFB(local, remote) {
  const map = new Map();
  for (const e of local) map.set(`${e.name}__${e.score}`, e);
  for (const e of remote) {
    const k = `${e.name}__${e.score}`;
    if (!map.has(k) || e.time > map.get(k).time) map.set(k, e);
  }
  return [...map.values()].sort((a, b) => b.score - a.score).slice(0, 10);
}

// ── Snake Game ────────────────────────────────────────
(function game() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const wrapper = document.getElementById('gameWrapper');
  const overlay = document.getElementById('overlay');
  const btnStart = document.getElementById('btnStart');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const btnLeaderboard = document.getElementById('btnLeaderboard');
  const lbModalBg = document.getElementById('lbModalBg');
  const lbContent = document.getElementById('lbContent');
  const btnLbClose = document.getElementById('btnLbClose');

  const GRID = 20;
  const COLS = 25;
  const ROWS = 25;
  const SIZE = GRID * COLS; // 500px

  canvas.width = SIZE;
  canvas.height = SIZE;

  let snake, food, direction, nextDirection, score, highScore;
  let gameLoop, gameRunning, gameSpeed;
  let obstacles = [];

  // Audio
  let audioCtx;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playBeep(freq, duration, type, vol, glideTo) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (glideTo) osc.frequency.linearRampToValueAtTime(glideTo, t + duration);
    gain.gain.setValueAtTime(vol || 0.08, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration);
  }
  function sfxEat() { playBeep(600, 0.12, 'sine', 0.07, 900); }
  function sfxBonus() { playBeep(900, 0.2, 'triangle', 0.1, 1400); }
  function sfxDeath() {
    playBeep(120, 0.4, 'sawtooth', 0.1, 50);
    setTimeout(() => playBeep(80, 0.5, 'sawtooth', 0.08, 30), 200);
  }

  // Pause state
  let isPaused = false;

  // Bonus events
  let bonusItem = null;
  let bonusTimer = 0;
  let bonusLifetime = 0;
  const BONUS_INTERVAL = 15;  // seconds between bonus spawns
  const BONUS_DURATION = 7;   // seconds bonus stays on map

  // Touch handling
  let touchStartX, touchStartY;

  // Load high score
  highScore = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);
  highScoreEl.textContent = highScore;

  function generateObstacles() {
    obstacles = [];
    const occupied = new Set();
    // Reserve area around snake start (center, 3-cell radius)
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    for (let dx = -3; dx <= 3; dx++) {
      for (let dy = -3; dy <= 3; dy++) {
        occupied.add(`${cx + dx},${cy + dy}`);
      }
    }

    const groups = 8;
    for (let g = 0; g < groups; g++) {
      const len = 2 + Math.floor(Math.random() * 3); // 2-4 cells
      const horizontal = Math.random() < 0.5;
      let placed = false;
      for (let attempt = 0; attempt < 50 && !placed; attempt++) {
        const sx = Math.floor(Math.random() * COLS);
        const sy = Math.floor(Math.random() * ROWS);
        const cells = [];
        let valid = true;
        for (let i = 0; i < len && valid; i++) {
          const x = horizontal ? sx + i : sx;
          const y = horizontal ? sy : sy + i;
          if (x < 0 || x >= COLS || y < 0 || y >= ROWS) { valid = false; break; }
          if (occupied.has(`${x},${y}`)) { valid = false; break; }
          cells.push({ x, y });
        }
        if (valid && cells.length === len) {
          for (const c of cells) occupied.add(`${c.x},${c.y}`);
          obstacles.push(...cells);
          placed = true;
        }
      }
    }
  }

  function init() {
    const cx = Math.floor(COLS / 2);
    snake = [
      { x: cx, y: Math.floor(ROWS / 2) },
      { x: cx - 1, y: Math.floor(ROWS / 2) },
      { x: cx - 2, y: Math.floor(ROWS / 2) },
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    gameSpeed = 130;
    isPaused = false;
    bonusItem = null;
    bonusTimer = 0;
    bonusLifetime = 0;
    scoreEl.textContent = '0';
    scoreEl.classList.remove('pop');
    generateObstacles();
    spawnFood();
  }

  function spawnFood() {
    const occupied = new Set([
      ...snake.map(s => `${s.x},${s.y}`),
      ...obstacles.map(o => `${o.x},${o.y}`),
    ]);
    if (bonusItem) occupied.add(`${bonusItem.x},${bonusItem.y}`);
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (occupied.has(`${pos.x},${pos.y}`));
    food = pos;
  }

  function spawnBonus() {
    const occupied = new Set([
      ...snake.map(s => `${s.x},${s.y}`),
      ...obstacles.map(o => `${o.x},${o.y}`),
      `${food.x},${food.y}`,
    ]);
    let pos;
    for (let attempt = 0; attempt < 50; attempt++) {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (!occupied.has(`${pos.x},${pos.y}`)) {
        bonusItem = pos;
        bonusLifetime = BONUS_DURATION;
        return;
      }
    }
  }

  function draw() {
    const now = Date.now();

    // Background
    ctx.fillStyle = '#16161c';
    ctx.fillRect(0, 0, SIZE, SIZE);

    // Subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= COLS; x++) {
      const px = x * GRID;
      ctx.beginPath();
      ctx.moveTo(px, 0);
      ctx.lineTo(px, SIZE);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      const py = y * GRID;
      ctx.beginPath();
      ctx.moveTo(0, py);
      ctx.lineTo(SIZE, py);
      ctx.stroke();
    }

    // Obstacles — more visible with border
    for (const ob of obstacles) {
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(ob.x * GRID + 2, ob.y * GRID + 2, GRID - 4, GRID - 4, 4);
      ctx.fill();
      ctx.stroke();
    }

    // Bonus item — glowing white-gold circle with pulse
    if (bonusItem) {
      const bx = bonusItem.x * GRID + GRID / 2;
      const by = bonusItem.y * GRID + GRID / 2;
      const bpulse = 1 + Math.sin(now * 0.008) * 0.2;
      const alpha = bonusLifetime < 2 ? 0.3 + 0.7 * (bonusLifetime / 2) * (0.5 + 0.5 * Math.sin(now * 0.03)) : 1;

      ctx.save();
      ctx.globalAlpha = alpha;
      // Outer glow
      const glowGrad = ctx.createRadialGradient(bx, by, 3, bx, by, 14 * bpulse);
      glowGrad.addColorStop(0, 'rgba(232, 228, 223, 0.25)');
      glowGrad.addColorStop(1, 'rgba(232, 228, 223, 0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(bx, by, 14 * bpulse, 0, Math.PI * 2);
      ctx.fill();
      // Body — star shape
      ctx.fillStyle = '#e8e4df';
      ctx.beginPath();
      const spikes = 5, outerR = 7, innerR = 3.5;
      for (let i = 0; i < spikes * 2; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const angle = (Math.PI * 2 / (spikes * 2)) * i - Math.PI / 2;
        const sx = bx + Math.cos(angle) * r;
        const sy = by + Math.sin(angle) * r;
        i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Food — golden diamond with breathing
    const fx = food.x * GRID + GRID / 2;
    const fy = food.y * GRID + GRID / 2;
    const breathe = 1 + Math.sin(now * 0.005) * 0.12;
    const fs = 6 * breathe;
    ctx.fillStyle = '#c9a96e';
    ctx.beginPath();
    ctx.moveTo(fx, fy - fs);
    ctx.lineTo(fx + fs, fy);
    ctx.lineTo(fx, fy + fs);
    ctx.lineTo(fx - fs, fy);
    ctx.closePath();
    ctx.fill();

    // Snake
    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const sx = seg.x * GRID, sy = seg.y * GRID;
      const t = i / Math.max(snake.length - 1, 1);

      const pad = i === 0 ? 1.5 : 2 + t * 1.5;
      const radius = i === 0 ? 7 : 5 - t * 2;

      const lightness = 68 - t * 28;
      ctx.fillStyle = `hsl(40, 40%, ${lightness}%)`;

      ctx.beginPath();
      ctx.roundRect(sx + pad, sy + pad, GRID - pad * 2, GRID - pad * 2, radius);
      ctx.fill();
    }

    // Eyes on head
    const head = snake[0];
    const hx = head.x * GRID, hy = head.y * GRID;
    let eye1, eye2;
    if (direction.x === 1) {
      eye1 = { x: hx + 13, y: hy + 5 };
      eye2 = { x: hx + 13, y: hy + 15 };
    } else if (direction.x === -1) {
      eye1 = { x: hx + 7, y: hy + 5 };
      eye2 = { x: hx + 7, y: hy + 15 };
    } else if (direction.y === -1) {
      eye1 = { x: hx + 5, y: hy + 7 };
      eye2 = { x: hx + 15, y: hy + 7 };
    } else {
      eye1 = { x: hx + 5, y: hy + 13 };
      eye2 = { x: hx + 15, y: hy + 13 };
    }
    ctx.fillStyle = '#1a1a1e';
    [eye1, eye2].forEach(e => {
      ctx.beginPath();
      ctx.arc(e.x, e.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e8e4df';
      ctx.beginPath();
      ctx.arc(e.x + direction.x * 0.5, e.y + direction.y * 0.5, 1.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1a1a1e';
    });
  }

  function step() {
    if (isPaused) return;

    direction = { ...nextDirection };

    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }

    // Obstacle collision
    for (const ob of obstacles) {
      if (ob.x === head.x && ob.y === head.y) return gameOver();
    }

    // Self collision
    for (const seg of snake) {
      if (seg.x === head.x && seg.y === head.y) return gameOver();
    }

    // Bonus timer
    if (!bonusItem) {
      bonusTimer += gameSpeed / 1000;
      if (bonusTimer >= BONUS_INTERVAL) {
        bonusTimer = 0;
        spawnBonus();
      }
    } else {
      bonusLifetime -= gameSpeed / 1000;
      if (bonusLifetime <= 0) {
        bonusItem = null;
        bonusTimer = 0;
      }
    }

    snake.unshift(head);

    // Bonus item collision
    if (bonusItem && head.x === bonusItem.x && head.y === bonusItem.y) {
      score += 30;
      sfxBonus();
      bonusItem = null;
      bonusTimer = 0;
      scoreEl.textContent = score;
      scoreEl.classList.remove('pop');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('pop');
    } else if (head.x === food.x && head.y === food.y) {
      score += 10;
      sfxEat();
      scoreEl.textContent = score;
      scoreEl.classList.remove('pop');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('pop');
      spawnFood();
      // Speed up
      gameSpeed = Math.max(50, 130 - Math.floor(score / 50) * 6);
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, gameSpeed);
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    gameRunning = false;
    clearInterval(gameLoop);
    sfxDeath();
    wrapper.classList.add('game-over-glow');

    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHighScore', highScore);
      highScoreEl.textContent = highScore;
    }

    const savedName = localStorage.getItem('snakePlayerName') || '';

    // Update overlay content with name input
    overlay.innerHTML = `
      <div class="overlay-title">游戏结束</div>
      <div class="overlay-score">得分 <span>${score}</span></div>
      <input class="name-input" id="nameInput" type="text" maxlength="20" placeholder="输入昵称" value="${savedName}" autocomplete="off">
      <div class="submit-status" id="submitStatus"></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
        <button class="btn" id="btnSubmit">提交分数</button>
        <button class="btn" id="btnRestart">再来一局</button>
      </div>
    `;
    overlay.classList.add('active');

    const nameInput = document.getElementById('nameInput');
    const submitStatus = document.getElementById('submitStatus');

    document.getElementById('btnRestart').addEventListener('click', startGame);

    document.getElementById('btnSubmit').addEventListener('click', async () => {
      const name = nameInput.value.trim() || 'Player';
      localStorage.setItem('snakePlayerName', name);
      submitStatus.textContent = '提交中...';
      submitStatus.className = 'submit-status';

      const localRank = addToLocal(name, score);
      const ok = await submitToFirebase(name, score);

      if (ok) {
        submitStatus.textContent = `提交成功！全局排名已同步`;
      } else {
        submitStatus.textContent = `已保存！本地排名第 ${localRank} 名（联网后同步）`;
      }
      submitStatus.className = 'submit-status success';
      document.getElementById('btnSubmit').disabled = true;
    });

    // Auto-focus name input on desktop
    if (window.innerWidth > 640) {
      setTimeout(() => nameInput.focus(), 100);
    }

    // Flash the game wrapper
    let flashes = 0;
    const flashInterval = setInterval(() => {
      wrapper.style.boxShadow = flashes % 2 === 0
        ? '0 0 0 1px rgba(201,81,74,0.4), 0 12px 48px rgba(0,0,0,0.5)'
        : '0 0 0 1px rgba(255,255,255,0.06), 0 12px 48px rgba(0,0,0,0.5)';
      flashes++;
      if (flashes >= 6) {
        clearInterval(flashInterval);
        wrapper.style.boxShadow = '0 0 0 1px rgba(255,255,255,0.06), 0 12px 48px rgba(0,0,0,0.5)';
      }
    }, 120);
  }

  function tick() {
    step();
    draw();
  }

  function showCountdown(onDone) {
    initAudio();
    const steps = ['3', '2', '1', 'GO'];
    let idx = 0;
    overlay.classList.add('active');
    overlay.innerHTML = `<div class="countdown-number">${steps[0]}</div>`;

    function next() {
      idx++;
      if (idx >= steps.length) {
        overlay.classList.remove('active');
        onDone();
        return;
      }
      const isGo = idx === steps.length - 1;
      overlay.innerHTML = isGo
        ? `<div class="countdown-go">${steps[idx]}</div>`
        : `<div class="countdown-number">${steps[idx]}</div>`;
      playBeep(isGo ? 1000 : 500, 0.1, 'sine', 0.05, isGo ? 1400 : 700);
      setTimeout(next, isGo ? 400 : 600);
    }
    setTimeout(next, 600);
  }

  function startGame() {
    init();
    gameRunning = true;
    isPaused = false;
    wrapper.classList.remove('game-over-glow');
    clearInterval(gameLoop);
    draw();
    showCountdown(() => {
      gameLoop = setInterval(tick, gameSpeed);
    });
  }

  function togglePause() {
    if (!gameRunning) return;
    // Don't allow pause during countdown or other overlays (except pause itself)
    if (overlay.classList.contains('active') && !isPaused) return;
    isPaused = !isPaused;
    if (isPaused) {
      clearInterval(gameLoop);
      overlay.innerHTML = '<div class="pause-icon">⏸</div><div class="overlay-title">已 暂 停</div><p class="hint">按 P / Esc 继续</p>';
      overlay.classList.add('active');
    } else {
      overlay.classList.remove('active');
      gameLoop = setInterval(tick, gameSpeed);
    }
  }

  // ── Controls ────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    // Leaderboard modal open — Esc closes it
    if (lbModalBg.classList.contains('active')) {
      if (e.key === 'Escape') { lbModalBg.classList.remove('active'); }
      return;
    }

    // Pause toggle
    if (gameRunning && (e.key === 'p' || e.key === 'P' || e.key === 'Escape')) {
      e.preventDefault();
      togglePause();
      return;
    }

    if (!gameRunning || isPaused) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (!gameRunning) startGame();
        else togglePause();
      }
      return;
    }

    const keyMap = {
      ArrowUp:    { x: 0, y: -1 },
      ArrowDown:  { x: 0, y: 1 },
      ArrowLeft:  { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 },
      w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
      s: { x: 0, y: 1 },  S: { x: 0, y: 1 },
      a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
      d: { x: 1, y: 0 },  D: { x: 1, y: 0 },
    };

    const dir = keyMap[e.key];
    if (!dir) return;
    e.preventDefault();

    // Prevent 180-degree reversal
    if (dir.x === -direction.x && dir.y === -direction.y) return;

    nextDirection = dir;
  });

  // Touch on canvas
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (!gameRunning || isPaused) return;
    e.preventDefault();
    const dx = (e.changedTouches[0]?.clientX || touchStartX) - touchStartX;
    const dy = (e.changedTouches[0]?.clientY || touchStartY) - touchStartY;

    if (Math.abs(dx) < 15 && Math.abs(dy) < 15) return;

    let newDir;
    if (Math.abs(dx) > Math.abs(dy)) {
      newDir = { x: dx > 0 ? 1 : -1, y: 0 };
    } else {
      newDir = { x: 0, y: dy > 0 ? 1 : -1 };
    }

    if (newDir.x === -direction.x && newDir.y === -direction.y) return;
    nextDirection = newDir;
  });

  // Mobile dpad buttons
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!gameRunning || isPaused) return;
      const map = {
        'dpad-up': { x: 0, y: -1 },
        'dpad-down': { x: 0, y: 1 },
        'dpad-left': { x: -1, y: 0 },
        'dpad-right': { x: 1, y: 0 },
      };
      for (const [cls, dir] of Object.entries(map)) {
        if (btn.classList.contains(cls)) {
          if (dir.x === -direction.x && dir.y === -direction.y) return;
          nextDirection = dir;
        }
      }
    });
    btn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      if (!gameRunning || isPaused) return;
      const map = {
        'dpad-up': { x: 0, y: -1 },
        'dpad-down': { x: 0, y: 1 },
        'dpad-left': { x: -1, y: 0 },
        'dpad-right': { x: 1, y: 0 },
      };
      for (const [cls, dir] of Object.entries(map)) {
        if (btn.classList.contains(cls)) {
          if (dir.x === -direction.x && dir.y === -direction.y) return;
          nextDirection = dir;
        }
      }
    });
  });

  // ── Initialize ───────────────────────────────────────
  init();

  // Start button
  btnStart.addEventListener('click', startGame);

  // Draw initial state
  draw();

  // Prevent scrolling on game area
  wrapper.addEventListener('wheel', e => e.preventDefault(), { passive: false });

  // ── Leaderboard Modal ───────────────────────────────
  async function renderLeaderboard() {
    lbContent.innerHTML = '<div class="lb-loading">加载中...</div>';

    const local = localScores();
    const remote = await fetchFirebase();
    const data = mergeScoresFB(local, remote || []);

    if (data.length === 0) {
      lbContent.innerHTML = '<div class="lb-empty">还没有记录<br>快来拿下第一名吧！</div>';
      return;
    }

    let hint = '';
    if (!remote) {
      hint = '<div style="text-align:center;font-size:11px;color:var(--text-dim);margin-bottom:12px;">（显示本地记录，联网后可同步全局排行）</div>';
    }

    lbContent.innerHTML = hint + data.map((entry, i) => {
      let topClass = '';
      let rankIcon = String(i + 1);
      if (i === 0) { topClass = 'top1'; rankIcon = '👑'; }
      else if (i === 1) { topClass = 'top2'; rankIcon = '🥈'; }
      else if (i === 2) { topClass = 'top3'; rankIcon = '🥉'; }
      return `
        <div class="lb-row ${topClass}">
          <span class="lb-rank">${rankIcon}</span>
          <span class="lb-name">${escapeHtml(entry.name)}</span>
          <span class="lb-score">${entry.score}</span>
        </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  btnLeaderboard.addEventListener('click', () => {
    lbModalBg.classList.add('active');
    renderLeaderboard();
    if (gameRunning) {
      // Don't pause, but prevent keyboard from moving snake while modal is open
    }
  });

  btnLbClose.addEventListener('click', () => {
    lbModalBg.classList.remove('active');
  });

  lbModalBg.addEventListener('click', (e) => {
    if (e.target === lbModalBg) lbModalBg.classList.remove('active');
  });

  // Close modal with Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lbModalBg.classList.contains('active')) {
      lbModalBg.classList.remove('active');
    }
  });
})();
</script>
</body>
