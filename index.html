<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇 · Neon Arcade</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap');

  :root {
    --bg-deep: #0a0a14;
    --neon-green: #39ff14;
    --neon-green-dim: #1a8c0a;
    --neon-pink: #ff2d95;
    --neon-cyan: #00e5ff;
    --neon-yellow: #ffe600;
    --panel-bg: rgba(10, 10, 30, 0.75);
    --panel-border: rgba(57, 255, 20, 0.2);
    --text-primary: #e0e0f0;
    --text-dim: #6060a0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-deep);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Noto Sans SC', 'Orbitron', sans-serif;
    overflow-x: hidden; overflow-y: auto;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: default;
  }

  /* Hide cursor over game area */
  .game-wrapper { cursor: none; }
  .game-wrapper .overlay.active { cursor: default; }
  .game-wrapper .overlay.active .btn { cursor: pointer; }
  .game-wrapper .overlay.active .name-input { cursor: text; }

  /* Restore cursor on interactive elements */
  .btn, .lb-btn, .dpad-btn, .name-input, .lb-close { cursor: pointer; }

  /* Animated starfield background */
  .starfield {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
    cursor: default;
  }
  .starfield canvas { display: block; pointer-events: none; }

  /* Main container */
  .container {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    gap: 24px;
  }

  /* Title */
  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    letter-spacing: 6px;
    text-transform: uppercase;
    background: linear-gradient(180deg, var(--neon-green) 0%, var(--neon-cyan) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(57, 255, 20, 0.5));
    animation: titlePulse 3s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(57, 255, 20, 0.5)); }
    50% { filter: drop-shadow(0 0 40px rgba(57, 255, 20, 0.8)) drop-shadow(0 0 80px rgba(0, 229, 255, 0.4)); }
  }

  /* Glass panel for scores */
  .score-panel {
    display: flex; gap: 32px;
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 16px 36px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(57, 255, 20, 0.1);
  }
  .score-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
  }
  .score-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; font-weight: 500;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .score-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px; font-weight: 700;
    color: var(--neon-green);
    text-shadow: 0 0 12px rgba(57, 255, 20, 0.6);
    transition: all 0.15s ease;
    min-width: 60px; text-align: center;
  }
  .score-value.pop {
    animation: scorePop 0.3s ease-out;
  }
  @keyframes scorePop {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .score-value.high {
    color: var(--neon-yellow);
    text-shadow: 0 0 12px rgba(255, 230, 0, 0.6);
  }

  /* Game canvas wrapper */
  .game-wrapper {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow:
      0 0 0 2px rgba(57, 255, 20, 0.15),
      0 0 60px rgba(57, 255, 20, 0.08),
      0 20px 60px rgba(0, 0, 0, 0.6);
    transition: box-shadow 0.5s ease;
  }
  .game-wrapper.game-over-glow {
    box-shadow:
      0 0 0 2px rgba(255, 45, 149, 0.4),
      0 0 60px rgba(255, 45, 149, 0.2),
      0 20px 60px rgba(0, 0, 0, 0.6);
    transition: box-shadow 0.8s ease;
  }

  canvas#gameCanvas {
    display: block;
    background: #0d0d24;
    border-radius: 16px;
  }

  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    background: rgba(10, 10, 30, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 16px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .overlay.active {
    opacity: 1; pointer-events: auto;
  }

  .overlay-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(24px, 4vw, 40px);
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--neon-pink);
    text-shadow: 0 0 40px rgba(255, 45, 149, 0.6);
    animation: overlayTitleIn 0.5s ease-out;
  }
  @keyframes overlayTitleIn {
    0% { transform: translateY(-20px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .overlay-score {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    color: var(--text-primary);
    letter-spacing: 3px;
  }
  .overlay-score span {
    color: var(--neon-yellow);
    font-size: 48px; font-weight: 900;
    text-shadow: 0 0 24px rgba(255, 230, 0, 0.5);
  }

  .btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px; font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 14px 40px;
    border: 1px solid var(--neon-green);
    border-radius: 50px;
    background: rgba(57, 255, 20, 0.08);
    color: var(--neon-green);
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 0%, rgba(57, 255, 20, 0.15) 50%, transparent 100%);
    transform: translateX(-100%);
    transition: transform 0.5s ease;
  }
  .btn:hover::before { transform: translateX(100%); }
  .btn:hover {
    background: rgba(57, 255, 20, 0.15);
    box-shadow: 0 0 30px rgba(57, 255, 20, 0.3), inset 0 0 20px rgba(57, 255, 20, 0.1);
    transform: translateY(-2px);
  }
  .btn:active { transform: translateY(0) scale(0.97); }

  .hint {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
    animation: fadeInOut 3s ease-in-out infinite;
  }
  @keyframes fadeInOut {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* Mobile controls */
  .mobile-controls {
    display: none;
    width: 100%; max-width: 400px;
  }
  .dpad {
    display: grid;
    grid-template-areas: ". up ." "left . right" ". down .";
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    width: min(180px, 45vw);
    margin: 0 auto;
  }
  .dpad-btn {
    aspect-ratio: 1;
    border: 1px solid rgba(57, 255, 20, 0.25);
    border-radius: 16px;
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex; justify-content: center; align-items: center;
    font-size: 24px; color: var(--neon-green);
    cursor: pointer;
    transition: all 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad-btn:active {
    background: rgba(57, 255, 20, 0.2);
    box-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
    transform: scale(0.92);
  }
  .dpad-up { grid-area: up; }
  .dpad-left { grid-area: left; }
  .dpad-right { grid-area: right; }
  .dpad-down { grid-area: down; }

  /* Leaderboard button */
  .lb-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px; font-weight: 700;
    letter-spacing: 2px;
    padding: 10px 24px;
    border: 1px solid var(--neon-cyan);
    border-radius: 50px;
    background: rgba(0, 229, 255, 0.08);
    color: var(--neon-cyan);
    cursor: pointer;
    transition: all 0.3s ease;
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
  }
  .lb-btn:hover {
    background: rgba(0, 229, 255, 0.15);
    box-shadow: 0 0 24px rgba(0, 229, 255, 0.25);
    transform: translateY(-2px);
  }
  .lb-btn:active { transform: translateY(0) scale(0.97); }

  /* Leaderboard modal */
  .lb-modal-bg {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .lb-modal-bg.active { opacity: 1; pointer-events: auto; }

  .lb-modal {
    background: var(--panel-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(0, 229, 255, 0.2);
    border-radius: 24px;
    padding: 32px;
    width: min(420px, 90vw);
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 229, 255, 0.08);
    transform: translateY(20px);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .lb-modal-bg.active .lb-modal { transform: translateY(0); }

  .lb-modal-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 24px; font-weight: 900;
    letter-spacing: 4px;
    text-align: center;
    color: var(--neon-cyan);
    text-shadow: 0 0 16px rgba(0, 229, 255, 0.4);
    margin-bottom: 24px;
  }

  .lb-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    border-radius: 12px;
    margin-bottom: 6px;
    transition: all 0.2s ease;
  }
  .lb-row:hover { background: rgba(255, 255, 255, 0.04); }
  .lb-row.top1 { background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.2); }
  .lb-row.top2 { background: rgba(192, 192, 192, 0.08); border: 1px solid rgba(192, 192, 192, 0.15); }
  .lb-row.top3 { background: rgba(205, 127, 50, 0.08); border: 1px solid rgba(205, 127, 50, 0.15); }

  .lb-rank {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px; font-weight: 900;
    width: 36px; text-align: center;
    color: var(--text-dim);
  }
  .lb-row.top1 .lb-rank { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
  .lb-row.top2 .lb-rank { color: #c0c0c0; text-shadow: 0 0 8px rgba(192, 192, 192, 0.4); }
  .lb-row.top3 .lb-rank { color: #cd7f32; text-shadow: 0 0 8px rgba(205, 127, 50, 0.4); }

  .lb-name {
    flex: 1;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px; font-weight: 500;
    color: var(--text-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lb-score {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px; font-weight: 700;
    color: var(--neon-green);
    text-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
  }

  .lb-empty {
    text-align: center; padding: 32px 0;
    color: var(--text-dim); font-size: 14px;
  }

  .lb-loading {
    text-align: center; padding: 32px 0;
    color: var(--neon-cyan); font-size: 14px;
    animation: fadeInOut 1.5s ease-in-out infinite;
  }

  .lb-close {
    display: block; margin: 20px auto 0;
  }

  /* Name input on game over */
  .name-input {
    font-family: 'Orbitron', 'Noto Sans SC', sans-serif;
    font-size: 16px; font-weight: 500;
    letter-spacing: 2px;
    text-align: center;
    padding: 10px 20px;
    width: 200px;
    border: 1px solid var(--neon-cyan);
    border-radius: 50px;
    background: rgba(0, 0, 0, 0.4);
    color: var(--neon-cyan);
    outline: none;
    transition: all 0.3s ease;
  }
  .name-input:focus {
    border-color: var(--neon-green);
    box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
  }
  .name-input::placeholder { color: rgba(96, 96, 160, 0.6); }

  .submit-status {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 13px;
    min-height: 20px;
    color: var(--neon-cyan);
    transition: all 0.3s ease;
  }
  .submit-status.error { color: var(--neon-pink); }
  .submit-status.success { color: var(--neon-green); }

  @media (max-width: 640px), (hover: none) and (pointer: coarse) {
    .mobile-controls { display: block; }
    .container { gap: 16px; padding: 12px; }
    .score-panel { padding: 12px 24px; gap: 20px; }
    .score-value { font-size: 26px; }
    .title { font-size: 24px; letter-spacing: 4px; }
    .hint { display: none; }
    body { cursor: auto; }
    .lb-modal { padding: 20px; }
    .lb-modal-title { font-size: 20px; }
  }
</style>
</head>
<body>

<!-- Leaderboard modal -->
<div class="lb-modal-bg" id="lbModalBg">
  <div class="lb-modal">
    <div class="lb-modal-title">🏆 排 行 榜</div>
    <div id="lbContent"><div class="lb-loading">加载中...</div></div>
    <button class="btn lb-close" id="btnLbClose">关 闭</button>
  </div>
</div>

<!-- Starfield background -->
<div class="starfield"><canvas id="stars"></canvas></div>

<div class="container">
  <h1 class="title">贪 吃 蛇</h1>

  <div class="score-panel">
    <div class="score-item">
      <span class="score-label">得 分</span>
      <span class="score-value" id="score">0</span>
    </div>
    <div class="score-item">
      <span class="score-label">最 高</span>
      <span class="score-value high" id="highScore">0</span>
    </div>
  </div>

  <button class="lb-btn" id="btnLeaderboard">🏆 排行榜</button>

  <div class="game-wrapper" id="gameWrapper">
    <canvas id="gameCanvas"></canvas>
    <div class="overlay active" id="overlay">
      <div class="overlay-title">贪 吃 蛇</div>
      <button class="btn" id="btnStart">开始游戏</button>
      <p class="hint">方向键 / WASD 操控</p>
    </div>
  </div>

  <div class="mobile-controls">
    <div class="dpad">
      <button class="dpad-btn dpad-up">▲</button>
      <button class="dpad-btn dpad-left">◀</button>
      <button class="dpad-btn dpad-right">▶</button>
      <button class="dpad-btn dpad-down">▼</button>
    </div>
  </div>
</div>

<script>
// ── Starfield Background ──────────────────────────────
(function starfield() {
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 150; i++) {
    stars.push({
      x: Math.random() * 2000, y: Math.random() * 2000,
      r: Math.random() * 1.5 + 0.3,
      speed: Math.random() * 0.3 + 0.05,
      opacity: Math.random() * 0.6 + 0.2,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      s.twinkle += s.twinkleSpeed;
      const alpha = s.opacity + Math.sin(s.twinkle) * 0.2;
      ctx.fillStyle = `rgba(180,200,255,${Math.max(0.05, alpha)})`;
      ctx.beginPath();
      ctx.arc(s.x % w, s.y % h, s.r, 0, Math.PI * 2);
      ctx.fill();
      s.y += s.speed;
      if (s.y > h + 5) { s.y = -5; s.x = Math.random() * w; }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── Leaderboard (Firebase + localStorage) ──────────────
const FB_DB = 'https://snake-leaderboard-c6832-default-rtdb.firebaseio.com';
const LB_KEY = 'snakeLeaderboard';
const LB_MAX = 50;

function localScores() {
  try { return JSON.parse(localStorage.getItem(LB_KEY) || '[]'); }
  catch (e) { return []; }
}

function saveLocal(scores) {
  try { localStorage.setItem(LB_KEY, JSON.stringify(scores)); }
  catch (e) { /* quota exceeded */ }
}

function addToLocal(name, score) {
  const list = localScores();
  list.push({ name: String(name).trim().slice(0, 20) || 'Player', score: Math.floor(score), time: Date.now() });
  list.sort((a, b) => b.score - a.score);
  if (list.length > LB_MAX) list.length = LB_MAX;
  saveLocal(list);
  return list.findIndex(e => e.score === Math.floor(score)) + 1;
}

async function fetchFirebase() {
  try {
    const res = await fetch(`${FB_DB}/scores.json`, { signal: AbortSignal.timeout(5000) });
    if (!res.ok) throw new Error('fail');
    const obj = await res.json();
    if (!obj) return [];
    return Object.values(obj).sort((a, b) => b.score - a.score);
  } catch (e) { return null; }
}

async function submitToFirebase(name, score) {
  try {
    const res = await fetch(`${FB_DB}/scores.json`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: String(name).trim().slice(0, 20) || 'Player', score: Math.floor(score), time: Date.now() }),
      signal: AbortSignal.timeout(5000),
    });
    return res.ok;
  } catch (e) { return false; }
}

function mergeScoresFB(local, remote) {
  const map = new Map();
  for (const e of local) map.set(`${e.name}__${e.score}`, e);
  for (const e of remote) {
    const k = `${e.name}__${e.score}`;
    if (!map.has(k) || e.time > map.get(k).time) map.set(k, e);
  }
  return [...map.values()].sort((a, b) => b.score - a.score).slice(0, 10);
}

// ── Snake Game ────────────────────────────────────────
(function game() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const wrapper = document.getElementById('gameWrapper');
  const overlay = document.getElementById('overlay');
  const btnStart = document.getElementById('btnStart');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const btnLeaderboard = document.getElementById('btnLeaderboard');
  const lbModalBg = document.getElementById('lbModalBg');
  const lbContent = document.getElementById('lbContent');
  const btnLbClose = document.getElementById('btnLbClose');

  const GRID = 20;
  const COLS = 20;
  const ROWS = 20;
  const SIZE = GRID * COLS; // 400px

  canvas.width = SIZE;
  canvas.height = SIZE;

  let snake, food, direction, nextDirection, score, highScore;
  let gameLoop, gameRunning, gameSpeed;
  let particles = [];
  let gridOffset = 0;

  // Touch handling
  let touchStartX, touchStartY;

  // Load high score
  highScore = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);
  highScoreEl.textContent = highScore;

  function init() {
    const cx = Math.floor(COLS / 2);
    snake = [
      { x: cx, y: Math.floor(ROWS / 2) },
      { x: cx - 1, y: Math.floor(ROWS / 2) },
      { x: cx - 2, y: Math.floor(ROWS / 2) },
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    gameSpeed = 130;
    particles = [];
    scoreEl.textContent = '0';
    scoreEl.classList.remove('pop');
    spawnFood();
  }

  function spawnFood() {
    const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (occupied.has(`${pos.x},${pos.y}`));
    food = pos;
  }

  function spawnParticles(x, y) {
    const colors = ['#39ff14', '#00e5ff', '#ffe600', '#ff2d95', '#ffffff'];
    for (let i = 0; i < 12; i++) {
      const angle = (Math.PI * 2 / 12) * i + Math.random() * 0.3;
      const speed = 1.5 + Math.random() * 4;
      particles.push({
        x: x * GRID + GRID / 2, y: y * GRID + GRID / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.015 + Math.random() * 0.03,
        color: colors[Math.floor(Math.random() * colors.length)],
        r: 1.5 + Math.random() * 2.5,
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles(ctx) {
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6 * p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function draw() {
    // Grid background with subtle animation
    ctx.fillStyle = '#0d0d24';
    ctx.fillRect(0, 0, SIZE, SIZE);

    // Grid lines
    gridOffset = (gridOffset + 0.15) % GRID;
    ctx.strokeStyle = 'rgba(57, 255, 20, 0.04)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      const px = x * GRID;
      ctx.beginPath();
      ctx.moveTo(px, 0);
      ctx.lineTo(px, SIZE);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      const py = y * GRID;
      ctx.beginPath();
      ctx.moveTo(0, py);
      ctx.lineTo(SIZE, py);
      ctx.stroke();
    }

    // Food with glow pulse
    const pulse = 1 + Math.sin(Date.now() * 0.006) * 0.3;
    const fx = food.x * GRID + GRID / 2;
    const fy = food.y * GRID + GRID / 2;

    // Outer glow
    const glowGrad = ctx.createRadialGradient(fx, fy, 2, fx, fy, 18 * pulse);
    glowGrad.addColorStop(0, 'rgba(255, 45, 149, 0.6)');
    glowGrad.addColorStop(1, 'rgba(255, 45, 149, 0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(fx, fy, 18 * pulse, 0, Math.PI * 2);
    ctx.fill();

    // Food body
    const foodGrad = ctx.createRadialGradient(fx - 2, fy - 2, 1, fx, fy, 8);
    foodGrad.addColorStop(0, '#ff6bb5');
    foodGrad.addColorStop(0.7, '#ff2d95');
    foodGrad.addColorStop(1, '#b8005c');
    ctx.fillStyle = foodGrad;
    ctx.shadowColor = 'rgba(255, 45, 149, 0.8)';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(fx, fy, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Snake
    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const sx = seg.x * GRID, sy = seg.y * GRID;
      const t = i / Math.max(snake.length - 1, 1);

      // Segment size - head bigger, tail smaller
      const pad = i === 0 ? 1 : 2 + t * 2;
      const radius = i === 0 ? 8 : 6 - t * 2;

      // Color gradient from head (bright neon) to tail (dimmer)
      const r = Math.round(57 - t * 40);
      const g = Math.round(255 - t * 100);
      const b = Math.round(20 + t * 40);
      const alpha = 1 - t * 0.35;

      // Glow on head
      if (i === 0) {
        ctx.fillStyle = 'rgba(57, 255, 20, 0.3)';
        ctx.beginPath();
        ctx.arc(sx + GRID / 2, sy + GRID / 2, 14, 0, Math.PI * 2);
        ctx.fill();
      }

      // Body gradient
      const segGrad = ctx.createLinearGradient(sx, sy, sx + GRID, sy + GRID);
      segGrad.addColorStop(0, `rgba(${r + 30},${g + 20},${b},${alpha})`);
      segGrad.addColorStop(1, `rgba(${r},${g},${b},${alpha})`);
      ctx.fillStyle = segGrad;

      ctx.shadowColor = i === 0
        ? 'rgba(57, 255, 20, 0.9)'
        : 'rgba(57, 255, 20, 0.2)';
      ctx.shadowBlur = i === 0 ? 12 : 3;

      ctx.beginPath();
      ctx.roundRect(sx + pad, sy + pad, GRID - pad * 2, GRID - pad * 2, radius);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Eyes on head
    const head = snake[0];
    const hx = head.x * GRID, hy = head.y * GRID;
    let eye1, eye2;
    if (direction.x === 1) {
      eye1 = { x: hx + 14, y: hy + 6 };
      eye2 = { x: hx + 14, y: hy + 14 };
    } else if (direction.x === -1) {
      eye1 = { x: hx + 6, y: hy + 6 };
      eye2 = { x: hx + 6, y: hy + 14 };
    } else if (direction.y === -1) {
      eye1 = { x: hx + 6, y: hy + 6 };
      eye2 = { x: hx + 14, y: hy + 6 };
    } else {
      eye1 = { x: hx + 6, y: hy + 14 };
      eye2 = { x: hx + 14, y: hy + 14 };
    }
    ctx.fillStyle = '#ffffff';
    [eye1, eye2].forEach(e => {
      ctx.beginPath();
      ctx.arc(e.x, e.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0a0a20';
      ctx.beginPath();
      ctx.arc(e.x + direction.x, e.y + direction.y, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
    });

    // Particles
    drawParticles(ctx);
    updateParticles();
  }

  function step() {
    direction = { ...nextDirection };

    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }

    // Self collision
    for (const seg of snake) {
      if (seg.x === head.x && seg.y === head.y) return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      scoreEl.classList.remove('pop');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('pop');
      spawnParticles(food.x, food.y);
      spawnFood();
      // Speed up
      gameSpeed = Math.max(50, 130 - Math.floor(score / 50) * 6);
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, gameSpeed);
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    gameRunning = false;
    clearInterval(gameLoop);
    wrapper.classList.add('game-over-glow');

    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHighScore', highScore);
      highScoreEl.textContent = highScore;
    }

    const savedName = localStorage.getItem('snakePlayerName') || '';

    // Update overlay content with name input
    overlay.innerHTML = `
      <div class="overlay-title">游戏结束</div>
      <div class="overlay-score">得分 <span>${score}</span></div>
      <input class="name-input" id="nameInput" type="text" maxlength="20" placeholder="输入昵称" value="${savedName}" autocomplete="off">
      <div class="submit-status" id="submitStatus"></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
        <button class="btn" id="btnSubmit">提交分数</button>
        <button class="btn" id="btnRestart">再来一局</button>
      </div>
    `;
    overlay.classList.add('active');

    const nameInput = document.getElementById('nameInput');
    const submitStatus = document.getElementById('submitStatus');

    document.getElementById('btnRestart').addEventListener('click', startGame);

    document.getElementById('btnSubmit').addEventListener('click', async () => {
      const name = nameInput.value.trim() || 'Player';
      localStorage.setItem('snakePlayerName', name);
      submitStatus.textContent = '提交中...';
      submitStatus.className = 'submit-status';

      const localRank = addToLocal(name, score);
      const ok = await submitToFirebase(name, score);

      if (ok) {
        submitStatus.textContent = `提交成功！全局排名已同步`;
      } else {
        submitStatus.textContent = `已保存！本地排名第 ${localRank} 名（联网后同步）`;
      }
      submitStatus.className = 'submit-status success';
      document.getElementById('btnSubmit').disabled = true;
    });

    // Auto-focus name input on desktop
    if (window.innerWidth > 640) {
      setTimeout(() => nameInput.focus(), 100);
    }

    // Flash the snake red
    let flashes = 0;
    const flashInterval = setInterval(() => {
      canvas.style.filter = flashes % 2 === 0 ? 'brightness(1.3) hue-rotate(290deg)' : 'none';
      flashes++;
      if (flashes >= 6) {
        clearInterval(flashInterval);
        canvas.style.filter = 'none';
      }
    }, 120);
  }

  function tick() {
    step();
    draw();
  }

  function startGame() {
    init();
    gameRunning = true;
    wrapper.classList.remove('game-over-glow');
    overlay.classList.remove('active');
    canvas.style.filter = 'none';
    clearInterval(gameLoop);
    gameLoop = setInterval(tick, gameSpeed);
    draw();
  }

  // ── Controls ────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (!gameRunning) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startGame(); }
      return;
    }

    const keyMap = {
      ArrowUp:    { x: 0, y: -1 },
      ArrowDown:  { x: 0, y: 1 },
      ArrowLeft:  { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 },
      w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
      s: { x: 0, y: 1 },  S: { x: 0, y: 1 },
      a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
      d: { x: 1, y: 0 },  D: { x: 1, y: 0 },
    };

    const dir = keyMap[e.key];
    if (!dir) return;
    e.preventDefault();

    // Prevent 180-degree reversal
    if (dir.x === -direction.x && dir.y === -direction.y) return;

    nextDirection = dir;
  });

  // Touch on canvas
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (!gameRunning) return;
    e.preventDefault();
    const dx = (e.changedTouches[0]?.clientX || touchStartX) - touchStartX;
    const dy = (e.changedTouches[0]?.clientY || touchStartY) - touchStartY;

    if (Math.abs(dx) < 15 && Math.abs(dy) < 15) return;

    let newDir;
    if (Math.abs(dx) > Math.abs(dy)) {
      newDir = { x: dx > 0 ? 1 : -1, y: 0 };
    } else {
      newDir = { x: 0, y: dy > 0 ? 1 : -1 };
    }

    if (newDir.x === -direction.x && newDir.y === -direction.y) return;
    nextDirection = newDir;
  });

  // Mobile dpad buttons
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!gameRunning) return;
      const map = {
        'dpad-up': { x: 0, y: -1 },
        'dpad-down': { x: 0, y: 1 },
        'dpad-left': { x: -1, y: 0 },
        'dpad-right': { x: 1, y: 0 },
      };
      for (const [cls, dir] of Object.entries(map)) {
        if (btn.classList.contains(cls)) {
          if (dir.x === -direction.x && dir.y === -direction.y) return;
          nextDirection = dir;
        }
      }
    });
    btn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      if (!gameRunning) return;
      const map = {
        'dpad-up': { x: 0, y: -1 },
        'dpad-down': { x: 0, y: 1 },
        'dpad-left': { x: -1, y: 0 },
        'dpad-right': { x: 1, y: 0 },
      };
      for (const [cls, dir] of Object.entries(map)) {
        if (btn.classList.contains(cls)) {
          if (dir.x === -direction.x && dir.y === -direction.y) return;
          nextDirection = dir;
        }
      }
    });
  });

  // ── Initialize ───────────────────────────────────────
  init();

  // Start button
  btnStart.addEventListener('click', startGame);

  // Draw initial state
  draw();

  // Prevent scrolling on game area
  wrapper.addEventListener('wheel', e => e.preventDefault(), { passive: false });

  // ── Leaderboard Modal ───────────────────────────────
  async function renderLeaderboard() {
    lbContent.innerHTML = '<div class="lb-loading">加载中...</div>';

    const local = localScores();
    const remote = await fetchFirebase();
    const data = mergeScoresFB(local, remote || []);

    if (data.length === 0) {
      lbContent.innerHTML = '<div class="lb-empty">还没有记录<br>快来拿下第一名吧！</div>';
      return;
    }

    let hint = '';
    if (!remote) {
      hint = '<div style="text-align:center;font-size:11px;color:var(--text-dim);margin-bottom:12px;">（显示本地记录，联网后可同步全局排行）</div>';
    }

    lbContent.innerHTML = hint + data.map((entry, i) => {
      let topClass = '';
      let rankIcon = String(i + 1);
      if (i === 0) { topClass = 'top1'; rankIcon = '👑'; }
      else if (i === 1) { topClass = 'top2'; rankIcon = '🥈'; }
      else if (i === 2) { topClass = 'top3'; rankIcon = '🥉'; }
      return `
        <div class="lb-row ${topClass}">
          <span class="lb-rank">${rankIcon}</span>
          <span class="lb-name">${escapeHtml(entry.name)}</span>
          <span class="lb-score">${entry.score}</span>
        </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  btnLeaderboard.addEventListener('click', () => {
    lbModalBg.classList.add('active');
    renderLeaderboard();
    if (gameRunning) {
      // Don't pause, but prevent keyboard from moving snake while modal is open
    }
  });

  btnLbClose.addEventListener('click', () => {
    lbModalBg.classList.remove('active');
  });

  lbModalBg.addEventListener('click', (e) => {
    if (e.target === lbModalBg) lbModalBg.classList.remove('active');
  });

  // Close modal with Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lbModalBg.classList.contains('active')) {
      lbModalBg.classList.remove('active');
    }
  });
})();
</script>
</body>
</html>
