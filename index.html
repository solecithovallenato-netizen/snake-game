<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  :root {
    --bg: #1a1a1e;
    --surface: rgba(28, 28, 34, 0.85);
    --accent: #c9a96e;
    --accent-dim: rgba(201, 169, 110, 0.2);
    --gold: #d4af6c;
    --text: #e8e4df;
    --text-dim: #72706b;
    --danger: #c9514a;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.008) 40px, rgba(255,255,255,0.008) 41px),
      repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.008) 40px, rgba(255,255,255,0.008) 41px);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow-x: hidden; overflow-y: auto;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: default;
    padding: 32px 24px;
  }

  /* ── Lobby Layout ── */
  .lobby {
    width: 100%; max-width: 650px;
  }
  .lobby-left {
    display: flex; flex-direction: column;
    gap: 16px;
  }

  /* ── Top Row (leaderboard button + player card) ── */
  .top-row {
    display: flex; align-items: center; gap: 8px;
  }
  .player-card { flex-shrink: 0; }
  .score-inline {
    display: flex; gap: 16px;
    flex-shrink: 0;
  }
  .lb-btn-icon {
    flex-shrink: 0;
    width: 48px; height: 48px;
    font-size: 22px;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .lb-btn-icon:hover {
    border-color: var(--gold);
    box-shadow: 0 0 12px rgba(201,169,110,0.15);
    background: rgba(201,169,110,0.06);
  }

  .music-player {
    flex: 1; display: flex; align-items: center; gap: 6px;
    padding: 0 10px; height: 48px; min-width: 0;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    font-size: 13px;
  }
  .mp-main { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; }
  .mp-icon { font-size: 14px; flex-shrink: 0; }
  .mp-name { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mp-artist { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 1; min-width: 0; }
  .mp-row { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .mp-btn {
    background: none; border: none; cursor: pointer; font-size: 18px;
    padding: 0 2px; transition: transform 0.15s; line-height: 1;
  }
  .mp-btn:hover { transform: scale(1.2); }
  .mp-play { font-size: 22px; }
  .mp-progress { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .mp-bar-bg { width: 60px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; }
  .mp-bar-fill { height: 100%; background: var(--gold); border-radius: 2px; width: 0%; }
  .mp-time, .mp-duration { color: var(--text-dim); font-size: 10px; font-family: monospace; min-width: 28px; }

  .ach-toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: linear-gradient(135deg, rgba(201,169,110,0.12), rgba(201,169,110,0.04));
    border: 1px solid var(--gold); border-radius: var(--radius);
    padding: 10px 20px; font-size: 14px; white-space: nowrap;
    color: var(--gold); z-index: 9999;
    opacity: 0; transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
  }
  .ach-toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }

  .profile-tabs { display: flex; gap: 0; margin-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .profile-tab { flex: 1; padding: 8px; background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 13px; transition: all 0.2s; border-bottom: 2px solid transparent; }
  .profile-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .ach-grid { max-height: 260px; overflow-y: auto; }
  .ach-card { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--radius); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); margin-bottom: 6px; font-size: 12px; }
  .ach-card.locked { opacity: 0.3; }
  .ach-card .ach-name { font-weight: 500; color: var(--gold); flex-shrink: 0; }
  .ach-card.locked .ach-name { color: var(--text-dim); }
  .ach-card .ach-desc { color: var(--text-dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ach-stats { text-align: center; font-size: 13px; color: var(--text-dim); margin-bottom: 10px; }

  .lobby-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 4px;
  }
  .lobby-title {
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 300;
    letter-spacing: 8px;
    color: var(--text);
  }

  /* ── Player Card ── */
  .player-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: var(--radius);
    padding: 10px 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }
  .player-card:hover {
    border-color: rgba(255,255,255,0.1);
    box-shadow: 0 2px 16px rgba(0,0,0,0.2);
  }
  .player-info {
    display: flex; flex-direction: column;
  }
  .player-name {
    font-size: 14px; font-weight: 500;
    color: var(--text);
    letter-spacing: 1px;
  }
  .player-id {
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 12px; color: var(--gold);
    letter-spacing: 1px;
  }
  .player-platform {
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* ── Game Wrapper ── */
  .game-wrapper { cursor: none; }
  .game-wrapper .overlay.active { cursor: default; }
  .game-wrapper .overlay.active .btn { cursor: pointer; }
  .game-wrapper .overlay.active .name-input { cursor: text; }
  .btn, .dpad-btn, .name-input { cursor: pointer; }

  .game-wrapper {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 12px 48px rgba(0,0,0,0.5);
    transition: box-shadow 0.5s ease;
    max-width: 100%;
  }
  .game-wrapper::before {
    content: '';
    position: absolute; inset: -1px; z-index: -1;
    border-radius: calc(var(--radius) + 1px);
    background: linear-gradient(135deg, rgba(201,169,110,0.06), transparent 40%, transparent 60%, rgba(201,169,110,0.06));
    opacity: 0; transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .game-wrapper.playing::before { opacity: 1; }
  .game-wrapper.game-over-glow {
    box-shadow: 0 0 0 1px rgba(201,81,74,0.3), 0 12px 48px rgba(0,0,0,0.5);
  }
  .game-wrapper.game-over-glow::before { opacity: 0; }

  /* ── Score Items ── */
  .score-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 2px;
  }
  .score-label {
    font-size: 10px; font-weight: 500;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .score-value {
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 28px; font-weight: 500;
    color: var(--text);
    min-width: 60px; text-align: center;
    transition: all 0.15s ease;
  }
  .score-value.pop { animation: scorePop 0.3s ease-out; }
  @keyframes scorePop {
    0% { transform: scale(1); }
    40% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .score-value.high { color: var(--gold); }



  canvas#gameCanvas {
    display: block;
    background: #16161c;
    border-radius: var(--radius);
    width: 100%;
    height: auto;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    background: rgba(22, 22, 28, 0.92);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: var(--radius);
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .overlay.active { opacity: 1; pointer-events: auto; }

  .countdown-number {
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 96px; font-weight: 300;
    color: var(--accent);
    animation: countPulse 0.6s ease-out;
  }
  @keyframes countPulse {
    0% { transform: scale(1.4); opacity: 0; }
    60% { transform: scale(0.95); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .countdown-go {
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 64px; font-weight: 300;
    color: var(--text);
    animation: countPulse 0.5s ease-out;
  }
  .pause-icon {
    font-size: 56px; color: var(--text-dim);
    margin-bottom: 8px;
  }

  .overlay-title {
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 300;
    letter-spacing: 4px;
    color: var(--text);
    animation: overlayTitleIn 0.4s ease-out;
  }
  @keyframes overlayTitleIn {
    0% { transform: translateY(-16px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .overlay-score {
    font-size: 16px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }
  .overlay-score span {
    color: var(--gold);
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 48px; font-weight: 500;
  }

  /* ── Difficulty Selector ── */
  .diff-selector {
    display: flex; gap: 10px; justify-content: center;
    margin: 8px 0;
  }
  .diff-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 12px 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
    min-width: 80px;
  }
  .diff-card:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.12);
  }
  .diff-card.selected {
    background: rgba(201,169,110,0.08);
    border-color: var(--gold);
    box-shadow: 0 0 12px rgba(201,169,110,0.15);
  }
  .diff-card-icon { font-size: 22px; display: block; margin-bottom: 4px; }
  .diff-card-label { font-size: 12px; color: var(--text-dim); letter-spacing: 2px; }
  .diff-card.selected .diff-card-label { color: var(--gold); }

  .btn {
    font-size: 13px; font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 13px 38px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(201, 169, 110, 0.1);
  }
  .btn:active { transform: translateY(0) scale(0.98); }

  .btn-primary {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 500;
    animation: btnPulse 2.5s ease-in-out infinite;
  }
  .btn-primary:hover {
    color: #fff;
    background: rgba(201, 169, 110, 0.1);
    border-color: var(--gold);
    box-shadow: 0 0 32px rgba(212, 175, 108, 0.15);
  }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201, 169, 110, 0); }
    50% { box-shadow: 0 0 16px 0 rgba(201, 169, 110, 0.08); }
  }

  .hint {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    animation: fadeHint 3s ease-in-out infinite;
  }
  @keyframes fadeHint {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.8; }
  }

  .mobile-controls {
    display: none;
    width: 100%; max-width: 400px;
  }
  .dpad {
    display: grid;
    grid-template-areas: ". up ." "left . right" ". down .";
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    width: min(180px, 45vw);
    margin: 0 auto;
  }
  .dpad-btn {
    aspect-ratio: 1;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    background: var(--surface);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex; justify-content: center; align-items: center;
    font-size: 20px; color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad-btn:active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
    transform: scale(0.92);
  }
  .dpad-up { grid-area: up; }
  .dpad-left { grid-area: left; }
  .dpad-right { grid-area: right; }
  .dpad-down { grid-area: down; }

  /* lb-row, lb-rank, lb-name, lb-score — kept for sidebar leaderboard content */

  .lb-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    border-radius: 10px;
    margin-bottom: 4px;
    transition: background 0.2s ease;
  }
  .lb-row:hover { background: rgba(255, 255, 255, 0.03); }
  .lb-row.top1 { background: rgba(212, 175, 108, 0.08); }
  .lb-row.top2 { background: rgba(180, 180, 180, 0.05); }
  .lb-row.top3 { background: rgba(180, 140, 100, 0.05); }

  .lb-rank {
    font-size: 16px; font-weight: 600;
    width: 36px; text-align: center;
    color: var(--text-dim);
  }
  .lb-row.top1 .lb-rank { color: var(--gold); }
  .lb-row.top2 .lb-rank { color: #b0b0b0; }
  .lb-row.top3 .lb-rank { color: #b48c64; }

  .lb-name {
    flex: 1;
    font-size: 14px; font-weight: 400;
    color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lb-score {
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 15px; font-weight: 500;
    color: var(--accent);
  }

  .lb-empty {
    text-align: center; padding: 32px 0;
    color: var(--text-dim); font-size: 14px;
  }

  .lb-loading {
    text-align: center; padding: 32px 0;
    color: var(--text-dim); font-size: 14px;
    animation: fadeHint 1.5s ease-in-out infinite;
  }

  .lb-close { display: block; margin: 20px auto 0; }

  .name-input {
    font-size: 15px; font-weight: 400;
    letter-spacing: 1px;
    text-align: center;
    padding: 10px 20px;
    width: 200px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50px;
    background: rgba(0, 0, 0, 0.3);
    color: var(--text);
    outline: none;
    transition: all 0.25s ease;
  }
  .name-input:focus {
    border-color: var(--accent);
  }
  .name-input::placeholder { color: var(--text-dim); }

  .welcome-text {
    font-size: 15px; font-weight: 300;
    letter-spacing: 2px;
    color: var(--text-dim);
  }
  .welcome-text span {
    color: var(--accent);
    font-weight: 400;
  }
  .name-change-link {
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 2px;
    background: none; border: none;
    cursor: pointer;
    margin-top: -10px; margin-bottom: 4px;
    transition: color 0.2s;
  }
  .name-change-link:hover { color: var(--accent); }

  .submit-status {
    font-size: 12px;
    min-height: 18px;
    color: var(--text-dim);
    transition: all 0.3s ease;
  }
  .submit-status.error { color: var(--danger); }
  .submit-status.success { color: var(--accent); }

  @media (max-width: 768px) {
    .lobby { flex-direction: column; padding: 0; }
    .lobby-left { flex: 1; }
    .lobby-left { gap: 10px; }
    .score-value { font-size: 22px; }
    .lobby-title { font-size: 20px; letter-spacing: 5px; text-align: center; }
    .score-inline { gap: 10px; }
    .player-card { justify-content: center; }
    .game-wrapper { max-width: calc(100vw - 16px); }
    .diff-card { padding: 10px 14px; min-width: 60px; }
    .music-player { gap: 4px; padding: 0 6px; font-size: 12px; height: 40px; }
    .mp-artist { display: none; }
    .mp-progress { display: none !important; }
    .mp-btn { font-size: 14px; }
    .mp-play { font-size: 18px; }
    .top-row { gap: 4px; }
  }
  @media (max-width: 640px), (hover: none) and (pointer: coarse) {
    .mobile-controls { display: block; }
    .hint { display: none; }
    body { cursor: auto; padding: 8px; }
    .countdown-number { font-size: 64px; }
    .countdown-go { font-size: 48px; }
    .btn { padding: 11px 28px; font-size: 12px; letter-spacing: 3px; }
    .qq-login-btn { padding: 12px 36px; font-size: 14px; }
    .history-modal { padding: 20px; max-height: 70vh; }
    .history-modal-title { font-size: 18px; }
    .lb-btn-icon { width: 36px; height: 36px; font-size: 16px; }
    .diff-card { padding: 8px 12px; min-width: 55px; }
    .music-player { height: 36px; padding: 0 4px; font-size: 11px; }
    .mp-icon { font-size: 12px; }
    .mp-name { max-width: 60px; }
    .mp-btn { font-size: 13px; }
    .mp-play { font-size: 16px; }
    .diff-card-icon { font-size: 18px; }
    .diff-card-label { font-size: 10px; }
  }

  .qq-login-btn {
    background: linear-gradient(135deg, #12b7f5, #0d8bcc);
    border-color: rgba(18, 183, 245, 0.3);
    color: #fff;
  }
  .qq-login-btn:hover {
    border-color: #12b7f5;
    box-shadow: 0 0 24px rgba(18, 183, 245, 0.2);
    color: #fff;
  }
  .guest-btn {
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-dim);
  }
  .guest-btn:hover {
    border-color: rgba(255,255,255,0.2);
    color: var(--text);
  }

  /* Player avatar (used in player-card and modals) */
  .player-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent-dim);
    display: flex; justify-content: center; align-items: center;
    font-size: 13px; font-weight: 500;
    color: var(--accent);
    letter-spacing: 1px;
  }

  /* History modal */
  .history-modal-bg {
    position: fixed; inset: 0; z-index: 110;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(3px);
    display: flex; justify-content: center; align-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .history-modal-bg.active { opacity: 1; pointer-events: auto; }

  .history-modal {
    background: var(--surface);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 28px;
    width: min(380px, 90vw);
    max-height: 75vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    transform: translateY(16px);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .history-modal-bg.active .history-modal { transform: translateY(0); }

  .history-modal-title {
    font-size: 20px; font-weight: 300;
    letter-spacing: 4px;
    text-align: center;
    color: var(--text);
    margin-bottom: 20px;
  }

  .history-stats {
    display: flex; gap: 16px;
    margin-bottom: 20px;
  }
  .history-stat {
    flex: 1;
    text-align: center;
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    padding: 12px 8px;
  }
  .history-stat-val {
    font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
    font-size: 24px; font-weight: 500;
    color: var(--accent);
  }
  .history-stat-label {
    font-size: 10px; font-weight: 500;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .history-list-title {
    font-size: 11px; font-weight: 500;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
    text-align: center;
  }

  .history-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 2px;
    transition: background 0.2s ease;
  }
  .history-row:hover { background: rgba(255, 255, 255, 0.03); }
  .history-row-idx {
    font-size: 11px; color: var(--text-dim);
    width: 22px; text-align: center;

<script>
// ── Firebase Config ─────────────────────────────────────
// 从 Firebase Console > Project Settings > General 获取 Web API Key
// https://console.firebase.google.com/project/snake-leaderboard-c6832/settings/general
const FB_API_KEY = 'AIzaSyBPRCOHmeR8kigmg5Wob6ZqmgD2R13BwSw';
const FB_DB = 'https://snake-leaderboard-c6832-default-rtdb.firebaseio.com';
const AUTH_KEY = 'snakeAuth';
const USER_ID_KEY = 'snakeUserId';

// ── Admin Config ─────────────────────────────────────────
// 管理员 ID（000001），好友榜 = 全局榜
const ADMIN_USER_IDS = ['000001'];

// ── QQ Login Config ─────────────────────────────────────
const QQ_APP_ID = 'YOUR_QQ_APP_ID'; // 替换为从 QQ 互联获取的 APP ID
const QQ_REDIRECT = encodeURIComponent('https://solecithovallenato-netizen.github.io/snake-game/');

// Dynamic QQ SDK loader
function loadQQSDK() {
  return new Promise((resolve, reject) => {
    if (window.QC) return resolve();
    const script = document.createElement('script');
    script.src = 'https://connect.qq.com/qc_jssdk.js';
    script.onload = () => {
      QC.init({ appId: QQ_APP_ID, redirectURI: QQ_REDIRECT });
      resolve();
    };
    script.onerror = () => reject(new Error('QQ SDK load failed'));
    document.head.appendChild(script);
  });
}

// ── Auth (Firebase Anonymous via REST) ──────────────────
let currentUid = null;
let currentIdToken = null;

async function getAuthToken() {
  let auth = null;
  try { auth = JSON.parse(localStorage.getItem(AUTH_KEY)); } catch (e) {}

  const now = Date.now();

  // QQ platform: always set uid to QQ openid
  if (auth && auth.qqInfo && auth.qqInfo.openid) {
    currentUid = auth.qqInfo.openid;
  }

  // Token still valid (> 60s remaining)
  if (auth && auth.idToken && auth.expiresAt > now + 60000) {
    if (auth.qqInfo && auth.qqInfo.openid) currentUid = auth.qqInfo.openid;
    else currentUid = auth.localId;
    currentIdToken = auth.idToken;
    return auth.idToken;
  }

  // Refresh expired token
  if (auth && auth.refreshToken) {
    try {
      const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ grant_type: 'refresh_token', refresh_token: auth.refreshToken }),
        signal: AbortSignal.timeout(5000),
      });
      if (res.ok) {
        const data = await res.json();
        auth.idToken = data.id_token;
        auth.refreshToken = data.refresh_token;
        auth.expiresAt = now + parseInt(data.expires_in) * 1000;
        auth.platform = auth.platform || 'guest';
        localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
        currentUid = auth.localId;
        currentIdToken = data.id_token;
        return data.id_token;
      }
    } catch (e) {}
  }

  // Sign up anonymously
  try {
    const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB_API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ returnSecureToken: true }),
      signal: AbortSignal.timeout(5000),
    });
    if (res.ok) {
      const data = await res.json();
      auth = {
        localId: data.localId,
        idToken: data.idToken,
        refreshToken: data.refreshToken,
        expiresAt: now + parseInt(data.expiresIn) * 1000,
        platform: 'guest',
      };
      localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
      if (auth.qqInfo && auth.qqInfo.openid) {
        currentUid = auth.qqInfo.openid;
      } else {
        currentUid = data.localId;
      }
      currentIdToken = data.idToken;
      return data.idToken;
    }
  } catch (e) {}

  return null; // offline — use localStorage fallback
}

function getAuthPlatform() {
  try {
    const auth = JSON.parse(localStorage.getItem(AUTH_KEY));
    return (auth && auth.platform) ? auth.platform : 'guest';
  } catch (e) { return 'guest'; }
}

function getQQInfo() {
  try {
    const auth = JSON.parse(localStorage.getItem(AUTH_KEY));
    return (auth && auth.qqInfo) || null;
  } catch (e) { return null; }
}

function saveQQInfo(info) {
  try {
    const auth = JSON.parse(localStorage.getItem(AUTH_KEY));
    if (auth) {
      auth.qqInfo = info;
      auth.platform = 'qq';
      localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
    }
  } catch (e) {}
}

async function qqLogin() {
  try {
    await loadQQSDK();
  } catch (e) {
    alert('QQ SDK 加载失败，请检查网络后重试');
    return false;
  }

  return new Promise((resolve) => {
    QC.Login(
      {
        btnId: 'qqLoginBtn',
        scope: 'get_user_info',
      },
      async (ret) => {
        if (!ret || ret.error) {
          console.warn('QQ login failed:', ret);
          resolve(false);
          return;
        }
        const qqInfo = await fetchQQUserInfo(ret.accessToken, ret.openid);
        if (qqInfo) {
          saveQQInfo({
            openid: ret.openid,
            accessToken: ret.accessToken,
            nickname: qqInfo.nickname,
            avatar: qqInfo.figureurl_qq_2 || qqInfo.figureurl_qq_1 || qqInfo.figureurl,
          });
          currentUid = ret.openid;
          localStorage.setItem('snakePlayerName', qqInfo.nickname);
          updatePlayerBar();
          ensureUserId();
          resolve(true);
        } else {
          resolve(false);
        }
      }
    );
  });
}

async function fetchQQUserInfo(accessToken, openid) {
  try {
    const res = await fetch(
      `https://graph.qq.com/user/get_user_info?access_token=${accessToken}&oauth_consumer_key=${QQ_APP_ID}&openid=${openid}`,
      { signal: AbortSignal.timeout(5000) }
    );
    if (!res.ok) return null;
    const data = await res.json();
    if (data.ret !== 0) return null;
    return data;
  } catch (e) {
    console.warn('QQ user info fetch failed:', e);
    return null;
  }
}

// Save display name per-user to RTDB
async function saveDisplayName(name) {
  if (!currentIdToken) return;
  try {
    await fetch(`${FB_DB}/users/${currentUid}.json?auth=${currentIdToken}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ displayName: name, updatedAt: Date.now() }),
      signal: AbortSignal.timeout(5000),
    });
  } catch (e) {}
}

// ── User ID System ──────────────────────────────────────
function getMyUserId() {
  return localStorage.getItem(USER_ID_KEY) || null;
}

async function ensureUserId() {
  if (getMyUserId()) return getMyUserId();

  try {
    // Try to get auth token for the uid field, but don't require it
    let token = null;
    try { token = await getAuthToken(); } catch (e) {}
    const authParam = token ? `?auth=${token}` : '';

    const uid = currentUid || 'anon';
    const name = localStorage.getItem('snakePlayerName') || 'Player';
    const qqInfo = getQQInfo();
    const avatar = qqInfo ? qqInfo.avatar : '';

    // Read counter (no auth needed — rules allow public read)
    let res = await fetch(`${FB_DB}/meta/nextId.json`, {
      signal: AbortSignal.timeout(5000),
    });
    if (!res.ok) throw new Error('读取ID计数器失败 HTTP ' + res.status);
    let nextId = 1;
    const val = await res.json();
    if (typeof val === 'number') nextId = val;

    // Write reverse index (no auth needed — rules allow public write to userIdIndex)
    res = await fetch(`${FB_DB}/userIdIndex/${nextId}.json${authParam}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid, name, avatar }),
      signal: AbortSignal.timeout(5000),
    });
    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      throw new Error('写入用户索引失败 HTTP ' + res.status + ' ' + errText.slice(0, 80));
    }

    // Increment counter (no auth needed — rules allow public write to meta)
    res = await fetch(`${FB_DB}/meta/nextId.json${authParam}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(nextId + 1),
      signal: AbortSignal.timeout(5000),
    });
    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      throw new Error('更新计数器失败 HTTP ' + res.status + ' ' + errText.slice(0, 80));
    }

    const userId = String(nextId).padStart(6, '0');
    localStorage.setItem(USER_ID_KEY, userId);
    return userId;
  } catch (e) {
    const msg = e.message || String(e);
    console.warn('ensureUserId failed:', msg);
    window.__lastIdError = msg;
    return null;
  }
}

async function lookupByUserId(userId) {
  try {
    const token = await getAuthToken();
    const res = await fetch(`${FB_DB}/userIdIndex/${parseInt(userId, 10)}.json?auth=${token}`, {
      signal: AbortSignal.timeout(5000),
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data ? { userId, ...data } : null;
  } catch (e) { return null; }
}

async function searchUsers(query) {
  const results = [];
  try {
    const token = await getAuthToken();
    // Fetch all userIdIndex entries
    const res = await fetch(`${FB_DB}/userIdIndex.json?auth=${token}`, {
      signal: AbortSignal.timeout(5000),
    });
    if (!res.ok) return results;
    const obj = await res.json();
    if (!obj) return results;

    const q = query.toLowerCase();
    for (const [id, data] of Object.entries(obj)) {
      if (!data || !data.name) continue;
      if (String(id).padStart(6, '0').includes(query) || data.name.toLowerCase().includes(q)) {
        results.push({ userId: String(id).padStart(6, '0'), ...data });
      }
    }
    return results.slice(0, 10);
  } catch (e) { return results; }
}

// ── Friend System ────────────────────────────────────────
async function sendFriendRequest(targetUid, targetName) {
  if (!currentUid || !currentIdToken) return false;
  const myName = localStorage.getItem('snakePlayerName') || 'Player';
  const qqInfo = getQQInfo();
  const myAvatar = qqInfo ? qqInfo.avatar : '';
  try {
    const res = await fetch(`${FB_DB}/friendRequests/${targetUid}/${currentUid}.json?auth=${currentIdToken}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fromName: myName, fromAvatar: myAvatar, time: Date.now() }),
      signal: AbortSignal.timeout(5000),
    });
    return res.ok;
  } catch (e) { return false; }
}

async function acceptFriendRequest(fromUid, fromName, fromAvatar) {
  if (!currentUid || !currentIdToken) return false;
  try {
    // Add to my friends
    await fetch(`${FB_DB}/friends/${currentUid}/${fromUid}.json?auth=${currentIdToken}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: fromName, avatar: fromAvatar, addedAt: Date.now() }),
      signal: AbortSignal.timeout(5000),
    });
    // Add me to their friends
    const myName = localStorage.getItem('snakePlayerName') || 'Player';
    const qqInfo = getQQInfo();
    const myAvatar = qqInfo ? qqInfo.avatar : '';
    await fetch(`${FB_DB}/friends/${fromUid}/${currentUid}.json?auth=${currentIdToken}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: myName, avatar: myAvatar, addedAt: Date.now() }),
      signal: AbortSignal.timeout(5000),
    });
    // Delete request
    await fetch(`${FB_DB}/friendRequests/${currentUid}/${fromUid}.json?auth=${currentIdToken}`, {
      method: 'DELETE',
      signal: AbortSignal.timeout(5000),
    });
    return true;
  } catch (e) { return false; }
}

async function rejectFriendRequest(fromUid) {
  if (!currentUid || !currentIdToken) return false;
  try {
    await fetch(`${FB_DB}/friendRequests/${currentUid}/${fromUid}.json?auth=${currentIdToken}`, {
      method: 'DELETE',
      signal: AbortSignal.timeout(5000),
    });
    return true;
  } catch (e) { return false; }
}

async function getMyFriends() {
  if (!currentUid) return [];
  try {
    const token = await getAuthToken();
    if (!token) return [];
    const res = await fetch(`${FB_DB}/friends/${currentUid}.json?auth=${token}`, {
      signal: AbortSignal.timeout(5000),
    });
    if (!res.ok) return [];
    const obj = await res.json();
    return obj ? Object.values(obj) : [];
  } catch (e) { return []; }
}

async function getMyRequests() {
  if (!currentUid) return [];
  try {
    const token = await getAuthToken();
    if (!token) return [];
    const res = await fetch(`${FB_DB}/friendRequests/${currentUid}.json?auth=${token}`, {
      signal: AbortSignal.timeout(5000),
    });
    if (!res.ok) return [];
    const obj = await res.json();
    if (!obj) return [];

// ── Leaderboard (Firebase + localStorage) ──────────────
const LB_KEY = 'snakeLeaderboard';
const PENDING_KEY = 'snakePendingScores';
const HISTORY_KEY = 'snakeGameHistory';
const HISTORY_MAX = 20;
const LB_MAX = 50;

function localScores() {
  try { return JSON.parse(localStorage.getItem(LB_KEY) || '[]'); }
  catch (e) { return []; }
}

function saveLocal(scores) {
  try { localStorage.setItem(LB_KEY, JSON.stringify(scores)); }
  catch (e) { /* quota exceeded */ }
}

function pendingScores() {
  try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); }
  catch (e) { return []; }
}

function addPending(name, score) {
  const list = pendingScores();
  list.push({ name: String(name).trim().slice(0, 20) || 'Player', score: Math.floor(score), time: Date.now() });
  try { localStorage.setItem(PENDING_KEY, JSON.stringify(list)); } catch (e) {}
}

function clearPending() {
  try { localStorage.removeItem(PENDING_KEY); } catch (e) {}
}

async function clearAllScores() {
  const token = await getAuthToken();
  if (!token || !currentUid) return false;
  try {
    // Clear Firebase: DELETE all scores
    await fetch(`${FB_DB}/scores.json?auth=${token}`, {
      method: 'DELETE',
      signal: AbortSignal.timeout(5000),
    });
    // Clear localStorage
    localStorage.removeItem(LB_KEY);
    localStorage.removeItem(PENDING_KEY);
    localStorage.removeItem(HISTORY_KEY);
    localStorage.removeItem('snakeHighScore');
    return true;
  } catch (e) { return false; }
}

function addToLocal(name, score) {
  const list = localScores();
  const cleanName = String(name).trim().slice(0, 20) || 'Player';
  const newScore = Math.floor(score);
  // One record per person: keep only highest score
  const existing = list.findIndex(e => e.name === cleanName);
  if (existing >= 0) {
    if (list[existing].score >= newScore) return existing + 1;
    list.splice(existing, 1);
  }
  list.push({ name: cleanName, score: newScore, time: Date.now() });
  list.sort((a, b) => b.score - a.score);
  if (list.length > LB_MAX) list.length = LB_MAX;
  saveLocal(list);
  return list.findIndex(e => e.name === cleanName) + 1;
}

async function fetchFirebase() {
  try {
    const token = await getAuthToken();
    const authParam = token ? `?auth=${token}` : '';
    const res = await fetch(`${FB_DB}/scores.json${authParam}`, { signal: AbortSignal.timeout(5000) });
    if (!res.ok) throw new Error('fail');
    const obj = await res.json();
    if (!obj) return [];
    return Object.values(obj).sort((a, b) => b.score - a.score);
  } catch (e) { return null; }
}

async function submitToFirebase(name, score) {
  try {
    const token = await getAuthToken();
    if (!token) return false;
    const uid = currentUid || 'anon';
    const cleanName = String(name).trim().slice(0, 20) || 'Player';
    const newScore = Math.floor(score);

    // One record per person: check existing score first, only update if higher
    try {
      const checkRes = await fetch(`${FB_DB}/scores/${uid}.json?auth=${token}`, {
        signal: AbortSignal.timeout(5000),
      });
      if (checkRes.ok) {
        const existing = await checkRes.json();
        if (existing && existing.score >= newScore) return true; // keep higher existing
      }
    } catch (e) { /* proceed to submit */ }

    const res = await fetch(`${FB_DB}/scores/${uid}.json?auth=${token}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: cleanName,
        score: newScore,
        time: Date.now(),
        uid: uid,
      }),
      signal: AbortSignal.timeout(5000),
    });
    return res.ok;
  } catch (e) { return false; }
}

function mergeScoresFB(local, remote) {
  const map = new Map();
  // One record per person: keep highest score per name
  for (const e of [...local, ...remote]) {
    const name = e.name || 'Player';
    if (!map.has(name) || e.score > map.get(name).score) {
      map.set(name, e);
    }
  }
  return [...map.values()].sort((a, b) => b.score - a.score).slice(0, 10);
}

    { id: 'hidden_retry',name: '🔄 卷土重来', desc: '死亡后 3 秒内立即开始新一局', cat: 'hidden', check: s => s._retryFlag },
    { id: 'hidden_nightowl',name: '🌙 夜猫子', desc: '凌晨 0-5 点玩游戏', cat: 'hidden', check: s => s._nightOwlFlag },
  ];
  let snakeStats = JSON.parse(localStorage.getItem('snakeStats') || JSON.stringify({
    totalScore: 0, totalFood: 0, totalGames: 0, totalDeaths: 0,
    totalPowerUps: 0, maxCombo: 0, bestScore: 0, totalShieldBlocks: 0,
    totalBoltTime: 0, totalMagnetFood: 0, difficultyBeat: 0,
    puTypeCount: { star: 0, bolt: 0, shield: 0, magnet: 0 },
  }));
  let snakeAchievements = JSON.parse(localStorage.getItem('snakeAchievements') || '{}');
  let achQueue = [];
  function saveStats() { localStorage.setItem('snakeStats', JSON.stringify(snakeStats)); }
  function saveAchievements() { localStorage.setItem('snakeAchievements', JSON.stringify(snakeAchievements)); }
  function checkAchievements() {
    ACHIEVEMENTS.forEach(a => {
      if (snakeAchievements[a.id]) return;
      if (a.check(snakeStats)) { snakeAchievements[a.id] = true; saveAchievements(); achQueue.push(a); }
    });
  }
  function renderAchGrid() {
    const grid = document.getElementById('achGrid');
    if (!grid) return;
    const unlocked = ACHIEVEMENTS.filter(a => snakeAchievements[a.id]).length;
    grid.innerHTML = `<div class="ach-stats">已解锁: ${unlocked}/${ACHIEVEMENTS.length}</div>`
      + ACHIEVEMENTS.map(a => `
        <div class="ach-card${snakeAchievements[a.id] ? '' : ' locked'}">
          <div class="ach-name">${snakeAchievements[a.id] ? a.name : '❓'}</div>
          <div class="ach-desc">${a.desc}</div>
        </div>
      `).join('');
  }
  function showAchToast() {
    if (achQueue.length === 0) return;
    const a = achQueue.shift();
    const el = document.getElementById('achToast');
    if (!el) return;
    el.innerHTML = '🏆 解锁成就：' + a.name;
    el.classList.add('active');
    setTimeout(() => { el.classList.remove('active'); showAchToast(); }, 3000);
  }

  // Difficulty presets
  const DIFFICULTY = {
    casual: {
      label: '休闲', icon: '🐣',
      startSpeed: 180, minSpeed: 100, speedStep: 4, speedEvery: 50,
      obstacleGroups: 3, wallWrap: true, bonusInterval: 10,
    },
    classic: {
      label: '经典', icon: '🐍',
      startSpeed: 130, minSpeed: 50, speedStep: 6, speedEvery: 50,
      obstacleGroups: 8, wallWrap: false, bonusInterval: 15,
    },
    hell: {
      label: '地狱', icon: '💀',
      startSpeed: 100, minSpeed: 35, speedStep: 8, speedEvery: 40,
      obstacleGroups: 12, wallWrap: false, bonusInterval: 20,
    },
  };
  let currentDifficulty = 'classic'; // default, set from localStorage

  // Touch handling
  let touchStartX, touchStartY;

  // Load high score
  highScore = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);
  highScoreEl.textContent = highScore;

  function generateObstacles(groups = 8) {
    obstacles = [];
    const occupied = new Set();
    // Reserve area around snake start (center, 3-cell radius)
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    for (let dx = -3; dx <= 3; dx++) {
      for (let dy = -3; dy <= 3; dy++) {
        occupied.add(`${cx + dx},${cy + dy}`);
      }
    }

    for (let g = 0; g < groups; g++) {
      const len = 2 + Math.floor(Math.random() * 3); // 2-4 cells
      const horizontal = Math.random() < 0.5;
      let placed = false;
      for (let attempt = 0; attempt < 50 && !placed; attempt++) {
        const sx = Math.floor(Math.random() * COLS);
        const sy = Math.floor(Math.random() * ROWS);
        const cells = [];
        let valid = true;
        for (let i = 0; i < len && valid; i++) {
          const x = horizontal ? sx + i : sx;
          const y = horizontal ? sy : sy + i;
          if (x < 0 || x >= COLS || y < 0 || y >= ROWS) { valid = false; break; }
          if (occupied.has(`${x},${y}`)) { valid = false; break; }
          cells.push({ x, y });
        }
        if (valid && cells.length === len) {
          for (const c of cells) occupied.add(`${c.x},${c.y}`);
          obstacles.push(...cells);
          placed = true;
        }
      }
    }
  }

  function init() {
    const cx = Math.floor(COLS / 2);
    snake = [
      { x: cx, y: Math.floor(ROWS / 2) },
      { x: cx - 1, y: Math.floor(ROWS / 2) },
      { x: cx - 2, y: Math.floor(ROWS / 2) },
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    const cfg = DIFFICULTY[currentDifficulty];
    gameSpeed = cfg.startSpeed;
    BONUS_INTERVAL = cfg.bonusInterval;
    isPaused = false;
    bonusItem = null;
    bonusTimer = 0;
    bonusLifetime = 0;
    comboCount = 0;
    lastEatTime = 0;
    comboDisplay = null;
    activeEffects = { shield: false, speedBoost: 0, magnet: 0 };
    scoreEl.textContent = '0';
    scoreEl.classList.remove('pop');
    generateObstacles(cfg.obstacleGroups);
    spawnFood();
  }

  function spawnFood() {
    const occupied = new Set([
      ...snake.map(s => `${s.x},${s.y}`),
      ...obstacles.map(o => `${o.x},${o.y}`),
    ]);
    if (bonusItem) occupied.add(`${bonusItem.x},${bonusItem.y}`);
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (occupied.has(`${pos.x},${pos.y}`));
    food = pos;
  }

  function pickPowerType() {
    const total = POWER_TYPES.reduce((s, p) => s + p.weight, 0);
    let r = Math.random() * total;
    for (let i = 0; i < POWER_TYPES.length; i++) {
      r -= POWER_TYPES[i].weight;
      if (r <= 0) return i;
    }
    return 0;
  }

  function spawnBonus() {
    const occupied = new Set([
      ...snake.map(s => `${s.x},${s.y}`),
      ...obstacles.map(o => `${o.x},${o.y}`),
      `${food.x},${food.y}`,
    ]);
    let pos;
    for (let attempt = 0; attempt < 50; attempt++) {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (!occupied.has(`${pos.x},${pos.y}`)) {
        bonusItem = {
          x: pos.x,
          y: pos.y,
          typeIndex: pickPowerType(),
          lifetime: BONUS_DURATION,
        };
        bonusLifetime = BONUS_DURATION;
        return;
      }
    }
  }

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function draw() {
    const now = Date.now();

    // Background
    ctx.fillStyle = '#16161c';
    ctx.fillRect(0, 0, SIZE, SIZE);

    // Subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= COLS; x++) {
      const px = x * GRID;
      ctx.beginPath();
      ctx.moveTo(px, 0);
      ctx.lineTo(px, SIZE);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      const py = y * GRID;
      ctx.beginPath();
      ctx.moveTo(0, py);
      ctx.lineTo(SIZE, py);
      ctx.stroke();
    }

    // Obstacles — more visible with border
    for (const ob of obstacles) {
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(ob.x * GRID + 2, ob.y * GRID + 2, GRID - 4, GRID - 4, 4);
      ctx.fill();
      ctx.stroke();
    }

    // Power-up item — type-based rendering
    if (bonusItem) {
      const bx = bonusItem.x * GRID + GRID / 2;
      const by = bonusItem.y * GRID + GRID / 2;
      const bpulse = 1 + Math.sin(now * 0.008) * 0.2;
      const alpha = bonusLifetime < 2 ? 0.3 + 0.7 * (bonusLifetime / 2) * (0.5 + 0.5 * Math.sin(now * 0.03)) : 1;
      const pt = POWER_TYPES[bonusItem.typeIndex];
      const pc = pt.color, ic = pt.innerColor;

      ctx.save();
      ctx.globalAlpha = alpha;

      // Outer glow
      const glowGrad = ctx.createRadialGradient(bx, by, 3, bx, by, 14 * bpulse);
      glowGrad.addColorStop(0, hexToRgba(pc, 0.25));
      glowGrad.addColorStop(1, hexToRgba(pc, 0));
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(bx, by, 14 * bpulse, 0, Math.PI * 2);
      ctx.fill();

      if (pt.shape === 'star') {
        // Star shape
        ctx.fillStyle = pc;
        ctx.beginPath();
        const spikes = 5, outerR = 7, innerR = 3.5;
        for (let i = 0; i < spikes * 2; i++) {
          const r = i % 2 === 0 ? outerR : innerR;
          const angle = (Math.PI * 2 / (spikes * 2)) * i - Math.PI / 2;
          const sx = bx + Math.cos(angle) * r;
          const sy = by + Math.sin(angle) * r;
          i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = ic;
        ctx.beginPath();
        ctx.arc(bx, by, 2.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (pt.shape === 'bolt') {
        // Lightning bolt
        ctx.fillStyle = pc;
        ctx.beginPath();
        ctx.moveTo(bx + 1, by - 8);
        ctx.lineTo(bx - 4, by);
        ctx.lineTo(bx, by);
        ctx.lineTo(bx - 3, by + 8);
        ctx.lineTo(bx + 4, by - 1);
        ctx.lineTo(bx + 1, by - 1);
        ctx.lineTo(bx + 5, by - 8);
        ctx.closePath();
        ctx.fill();
      } else if (pt.shape === 'shield') {
        // Shield shape
        ctx.fillStyle = pc;
        ctx.beginPath();
        ctx.moveTo(bx, by - 8);
        ctx.lineTo(bx + 7, by - 3);
        ctx.lineTo(bx + 7, by + 3);
        ctx.lineTo(bx, by + 7);
        ctx.lineTo(bx - 7, by + 3);
        ctx.lineTo(bx - 7, by - 3);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = ic;
        ctx.beginPath();
        ctx.arc(bx, by, 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (pt.shape === 'magnet') {
        // Magnet U-shape
        ctx.strokeStyle = pc;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(bx - 6, by - 7);
        ctx.lineTo(bx - 6, by);
        ctx.arc(bx, by, 6, Math.PI, Math.PI * 2, false);
        ctx.lineTo(bx + 6, by - 7);
        ctx.stroke();
        // N/S labels
        ctx.fillStyle = ic;
        ctx.font = 'bold 5px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('S', bx - 6, by - 10);
        ctx.fillText('N', bx + 6, by - 10);
      }

      ctx.restore();
    }

    // Combo display
    if (comboDisplay) {
      const cdAge = now - comboDisplay.startTime;
      if (cdAge < 1200) {
        const cdAlpha = cdAge < 200 ? cdAge / 200 : 1 - (cdAge - 200) / 1000;
        const cdScale = 1 + (1 - cdAlpha) * 0.8;
        ctx.save();
        ctx.globalAlpha = cdAlpha;
        ctx.font = `bold ${Math.round(22 * cdScale)}px "Noto Sans SC", "Microsoft YaHei", sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f5d442';
        ctx.shadowColor = '#f5d442';
        ctx.shadowBlur = 12 * cdAlpha;
        ctx.fillText(comboDisplay.text, SIZE / 2, comboDisplay.y || SIZE / 2 - 20);
        ctx.restore();
      } else {
        comboDisplay = null;
      }
    }

    // Active effect indicators
    let indicatorX = 8;
    const indicatorY = SIZE - 12;
    if (activeEffects.shield) {
      ctx.save();
      ctx.font = '10px "Noto Sans SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#4ea8f6';
      ctx.fillText('\u{1F6E1} 护盾', indicatorX, indicatorY);
      indicatorX += 50;
      ctx.restore();
    }
    if (activeEffects.speedBoost > now) {
      ctx.save();
      ctx.font = '10px "Noto Sans SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#f5d442';
      ctx.fillText('⚡ 极速 ' + ((activeEffects.speedBoost - now) / 1000).toFixed(1) + 's', indicatorX, indicatorY);
      indicatorX += 80;
      ctx.restore();
    }
    if (activeEffects.magnet > now) {
      ctx.save();
      ctx.font = '10px "Noto Sans SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#f472b6';
      ctx.fillText('\u{1F9F2} 磁铁 ' + ((activeEffects.magnet - now) / 1000).toFixed(1) + 's', indicatorX, indicatorY);
      ctx.restore();
    }

    // Food — golden diamond with breathing
    const fx = food.x * GRID + GRID / 2;
    const fy = food.y * GRID + GRID / 2;
    const breathe = 1 + Math.sin(now * 0.005) * 0.12;
    const fs = 6 * breathe;
    ctx.fillStyle = '#c9a96e';
    ctx.beginPath();
    ctx.moveTo(fx, fy - fs);
    ctx.lineTo(fx + fs, fy);
    ctx.lineTo(fx, fy + fs);
    ctx.lineTo(fx - fs, fy);
    ctx.closePath();
    ctx.fill();

    // Snake
    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const sx = seg.x * GRID, sy = seg.y * GRID;
      const t = i / Math.max(snake.length - 1, 1);

      const pad = i === 0 ? 1.5 : 2 + t * 1.5;
      const radius = i === 0 ? 7 : 5 - t * 2;

      const lightness = 68 - t * 28;
      ctx.fillStyle = `hsl(40, 40%, ${lightness}%)`;

      ctx.beginPath();
      ctx.roundRect(sx + pad, sy + pad, GRID - pad * 2, GRID - pad * 2, radius);
      ctx.fill();
    }

    // Eyes on head
    const head = snake[0];
    const hx = head.x * GRID, hy = head.y * GRID;
    let eye1, eye2;
    if (direction.x === 1) {
      eye1 = { x: hx + 13, y: hy + 5 };
      eye2 = { x: hx + 13, y: hy + 15 };
    } else if (direction.x === -1) {
      eye1 = { x: hx + 7, y: hy + 5 };
      eye2 = { x: hx + 7, y: hy + 15 };
    } else if (direction.y === -1) {
      eye1 = { x: hx + 5, y: hy + 7 };
      eye2 = { x: hx + 15, y: hy + 7 };
    } else {
      eye1 = { x: hx + 5, y: hy + 13 };
      eye2 = { x: hx + 15, y: hy + 13 };
    }
    ctx.fillStyle = '#1a1a1e';
    [eye1, eye2].forEach(e => {
      ctx.beginPath();
      ctx.arc(e.x, e.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e8e4df';
      ctx.beginPath();
      ctx.arc(e.x + direction.x * 0.5, e.y + direction.y * 0.5, 1.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1a1a1e';
    });
  }

  function step() {
    if (isPaused) return;

    direction = { ...nextDirection };

    let head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    // Wall collision or wrap
    const cfg = DIFFICULTY[currentDifficulty];
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      if (cfg.wallWrap) {
        head.x = ((head.x % COLS) + COLS) % COLS;
        head.y = ((head.y % ROWS) + ROWS) % ROWS;
      } else {
        return gameOver();
      }
    }

    // Obstacle collision
    for (const ob of obstacles) {
      if (ob.x === head.x && ob.y === head.y) return gameOver();
    }

    // Self collision (shield absorbs one hit)
    for (const seg of snake) {
      if (seg.x === head.x && seg.y === head.y) {
        if (activeEffects.shield) {
          activeEffects.shield = false;
          sfxShield();
          snakeStats.totalShieldBlocks++;
          break;
        }
        return gameOver();
      }
    }

    // Bonus timer
    if (!bonusItem) {
      bonusTimer += gameSpeed / 1000;
      if (bonusTimer >= BONUS_INTERVAL) {
        bonusTimer = 0;
        spawnBonus();
      }
    } else {
      bonusLifetime -= gameSpeed / 1000;
      if (bonusLifetime <= 0) {
        bonusItem = null;
        bonusTimer = 0;
      }
    }

    // Magnet effect: pull food toward head
    if (activeEffects.magnet > Date.now()) {
      let fx = food.x, fy = food.y;
      if (fx < head.x) fx++;
      else if (fx > head.x) fx--;
      if (fy < head.y) fy++;
      else if (fy > head.y) fy--;
      // Check new position is valid
      const magKey = fx + ',' + fy;
      const blocked = new Set([
        ...snake.map(s => s.x + ',' + s.y),
        ...obstacles.map(o => o.x + ',' + o.y),
      ]);
      if (bonusItem) blocked.add(bonusItem.x + ',' + bonusItem.y);
      if (!blocked.has(magKey)) {
        food = { x: fx, y: fy };
      }
    }

    snake.unshift(head);

    // Bonus item collision
    if (bonusItem && head.x === bonusItem.x && head.y === bonusItem.y) {
      const pt = POWER_TYPES[bonusItem.typeIndex];
      const pts = pt.score;
      score += pts;
      sfxBonus();
      sfxPowerUp();
      snakeStats.totalPowerUps++;
      const pType = pt.type;
      snakeStats.puTypeCount[pType] = (snakeStats.puTypeCount[pType] || 0) + 1;

      // Apply power-up effect
      const now2 = Date.now();
      if (pt.type === 'star') {
        // Bonus score already added
      } else if (pt.type === 'bolt') {
        activeEffects.speedBoost = now2 + pt.duration * 1000;
        const cfg2 = DIFFICULTY[currentDifficulty];
        const boostedSpeed = Math.max(25, gameSpeed / 2);
        gameSpeed = boostedSpeed;
        clearInterval(gameLoop);
        gameLoop = setInterval(tick, gameSpeed);
      } else if (pt.type === 'shield') {
        activeEffects.shield = true;
      } else if (pt.type === 'magnet') {
        activeEffects.magnet = now2 + pt.duration * 1000;
      }

      bonusItem = null;
      bonusTimer = 0;
      scoreEl.textContent = score;
      scoreEl.classList.remove('pop');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('pop');
    } else if (head.x === food.x && head.y === food.y) {
      if (activeEffects.magnet > Date.now()) snakeStats.totalMagnetFood++;
      // Combo tracking
      const now2 = Date.now();
      if (now2 - lastEatTime < COMBO_WINDOW && lastEatTime > 0) {
        comboCount++;
      } else {
        comboCount = 1;
      }
      lastEatTime = now2;

      // Score with combo multiplier
      const multiplier = Math.min(comboCount, 5);
      const basePoints = 10;
      const points = basePoints * multiplier;
      score += points;

      // Stats tracking
      snakeStats.totalFood++;
      if (multiplier > snakeStats.maxCombo) snakeStats.maxCombo = multiplier;

      // Combo display
      if (comboCount >= 2) {
        comboDisplay = {
          text: comboCount + 'x COMBO!',
          startTime: now2,
          y: SIZE / 2 - 30,
        };
        sfxCombo();
      }
      sfxEat();

      scoreEl.textContent = score;
      scoreEl.classList.remove('pop');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('pop');
      spawnFood();
      // Speed up — difficulty-based curve (respect speed boost)
      const cfg2 = DIFFICULTY[currentDifficulty];
      const baseSpeed = Math.max(cfg2.minSpeed, cfg2.startSpeed - Math.floor(score / cfg2.speedEvery) * cfg2.speedStep);
      if (activeEffects.speedBoost > Date.now()) {
        gameSpeed = Math.max(25, baseSpeed / 2);
      } else {
        gameSpeed = baseSpeed;
      }
      snakeStats.totalBoltTime += gameSpeed / 1000;
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, gameSpeed);
    } else {
      snake.pop();
    }

    // Expire active effects
    const now3 = Date.now();
    if (activeEffects.speedBoost > 0 && activeEffects.speedBoost <= now3) {
      activeEffects.speedBoost = 0;
      // Restore normal speed
      const cfg3 = DIFFICULTY[currentDifficulty];
      gameSpeed = Math.max(cfg3.minSpeed, cfg3.startSpeed - Math.floor(score / cfg3.speedEvery) * cfg3.speedStep);
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, gameSpeed);
    }
    if (activeEffects.magnet > 0 && activeEffects.magnet <= now3) {
      activeEffects.magnet = 0;
    }
  }

  function gameOver() {
    gameRunning = false;
    clearInterval(gameLoop);
    comboCount = 0;
    lastEatTime = 0;
    comboDisplay = null;
    activeEffects = { shield: false, speedBoost: 0, magnet: 0 };
    sfxDeath();
    startLobbyMusic();
    wrapper.classList.remove('playing');
    wrapper.classList.add('game-over-glow');

    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHighScore', highScore);
      highScoreEl.textContent = highScore;
    }

    // Save stats & check achievements
    snakeStats.totalScore += score;
    snakeStats.totalDeaths++;
    if (score > snakeStats.bestScore) snakeStats.bestScore = score;
    snakeStats.difficultyBeat |= currentDifficulty === 'casual' ? 1 : currentDifficulty === 'normal' ? 2 : 4;
    if (Date.now() - lastEatTime < 3000) snakeStats._retryFlag = true; else snakeStats._retryFlag = false;
    saveStats();
    checkAchievements();
    if (achQueue.length > 0) setTimeout(showAchToast, 500);

    // Record in history
    recordGameResult(score);

    // Auto-submit with saved name
    const savedName = localStorage.getItem('snakePlayerName') || 'Player';
    (async () => {
      const localRank = addToLocal(savedName, score);
      const ok = await submitToFirebase(savedName, score);
      if (ok) saveDisplayName(savedName);
      else addPending(savedName, score);
    })();

    overlay.innerHTML = `
      <div class="overlay-title">游戏结束</div>
      <div class="overlay-score">得分 <span>${score}</span></div>
      <div class="welcome-text"><span>${escapeHtml(savedName)}</span></div>
      <button class="name-change-link" id="btnChangeName">改名</button>

  async function migrateDataToQQ() {
    const hist = gameHistory();
    const qqInfo = getQQInfo();
    if (!qqInfo) return;

    const uid = qqInfo.openid;
    const name = qqInfo.nickname;

    for (const entry of hist) {
      await fetch(`${FB_DB}/scores.json`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name,
          score: entry.score,
          time: entry.time,
          uid: uid,
        }),
        signal: AbortSignal.timeout(5000),
      });
    }

    const oldHigh = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);
    const remoteScores = await fetchFirebase();
    const qqScores = (remoteScores || []).filter(s => s.uid === uid);
    const qqMax = qqScores.length > 0 ? Math.max(...qqScores.map(s => s.score)) : 0;
    const newHigh = Math.max(oldHigh, qqMax);
    localStorage.setItem('snakeHighScore', String(newHigh));
    highScore = newHigh;
    highScoreEl.textContent = newHigh;

    saveDisplayName(name);
  }

  function tick() {

  function showCountdown(onDone) {
    initAudio();
    const steps = ['3', '2', '1', 'GO'];
    let idx = 0;
    overlay.classList.add('active');
    overlay.innerHTML = `<div class="countdown-number">${steps[0]}</div>`;

    function next() {
      idx++;
      if (idx >= steps.length) {
        overlay.classList.remove('active');
        onDone();
        return;
      }
      const isGo = idx === steps.length - 1;
      overlay.innerHTML = isGo
        ? `<div class="countdown-go">${steps[idx]}</div>`
        : `<div class="countdown-number">${steps[idx]}</div>`;
      playBeep(isGo ? 1000 : 500, 0.1, 'sine', 0.05, isGo ? 1400 : 700);
      setTimeout(next, isGo ? 400 : 600);
    }
    setTimeout(next, 600);
  }

  function startGame() {
    init();
    gameRunning = true;
    isPaused = false;
    wrapper.classList.add('playing');
    wrapper.classList.remove('game-over-glow');
    clearInterval(gameLoop);
    snakeStats.totalGames++;
    const h = new Date().getHours();
    if (h >= 0 && h < 5) snakeStats._nightOwlFlag = true;
    draw();
    startGameMusic();
    showCountdown(() => {
      gameLoop = setInterval(tick, gameSpeed);
    });
  }

  function togglePause() {
    if (!gameRunning) return;
    // Don't allow pause during countdown or other overlays (except pause itself)
    if (overlay.classList.contains('active') && !isPaused) return;
    isPaused = !isPaused;
    if (isPaused) {
      clearInterval(gameLoop);
      overlay.innerHTML = '<div class="pause-icon">⏸</div><div class="overlay-title">已 暂 停</div><p class="hint">按 P / Esc 继续</p>';
      overlay.classList.add('active');
    } else {
      overlay.classList.remove('active');
      gameLoop = setInterval(tick, gameSpeed);
    }
  }

  // ── Controls ────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    // Profile modal open — Esc closes it
    if (document.getElementById('profileBg').classList.contains('active')) {
      if (e.key === 'Escape') { document.getElementById('profileBg').classList.remove('active'); }
      return;
    }
    // Add friend modal open — Esc closes it
    if (document.getElementById('addFriendBg').classList.contains('active')) {
      if (e.key === 'Escape') { document.getElementById('addFriendBg').classList.remove('active'); }
      return;
    }
    // History modal open — Esc closes it
    if (document.getElementById('historyModalBg').classList.contains('active')) {
      if (e.key === 'Escape') { document.getElementById('historyModalBg').classList.remove('active'); }
      return;
    }
    // Leaderboard modal open — Esc closes it
    if (document.getElementById('lbModalBg').classList.contains('active')) {
      if (e.key === 'Escape') { document.getElementById('lbModalBg').classList.remove('active'); }
      return;
    }
    if (document.getElementById('friendsModalBg').classList.contains('active')) {
      if (e.key === 'Escape') { document.getElementById('friendsModalBg').classList.remove('active'); }
      return;
    }
    // Pause toggle
    if (gameRunning && (e.key === 'p' || e.key === 'P' || e.key === 'Escape')) {
      e.preventDefault();
      togglePause();
      return;
    }

    if (!gameRunning || isPaused) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (!gameRunning) startGame();
        else togglePause();
      }
      return;
    }

    const keyMap = {
      ArrowUp:    { x: 0, y: -1 },
      ArrowDown:  { x: 0, y: 1 },
      ArrowLeft:  { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 },
      w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
      s: { x: 0, y: 1 },  S: { x: 0, y: 1 },
      a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
      d: { x: 1, y: 0 },  D: { x: 1, y: 0 },
    };

    const dir = keyMap[e.key];
    if (!dir) return;
    e.preventDefault();

    // Prevent 180-degree reversal
    if (dir.x === -direction.x && dir.y === -direction.y) return;

    nextDirection = dir;
  });

  // Touch on canvas
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (!gameRunning || isPaused) return;
    e.preventDefault();
    const dx = (e.changedTouches[0]?.clientX || touchStartX) - touchStartX;
    const dy = (e.changedTouches[0]?.clientY || touchStartY) - touchStartY;

    if (Math.abs(dx) < 15 && Math.abs(dy) < 15) return;

    let newDir;
    if (Math.abs(dx) > Math.abs(dy)) {
      newDir = { x: dx > 0 ? 1 : -1, y: 0 };
    } else {
      newDir = { x: 0, y: dy > 0 ? 1 : -1 };
    }

    if (newDir.x === -direction.x && newDir.y === -direction.y) return;
    nextDirection = newDir;
  });

  // Mobile dpad buttons
  document.querySelectorAll('.dpad-btn').forEach(btn => {
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!gameRunning || isPaused) return;
      const map = {
        'dpad-up': { x: 0, y: -1 },
        'dpad-down': { x: 0, y: 1 },
        'dpad-left': { x: -1, y: 0 },
        'dpad-right': { x: 1, y: 0 },
      };
      for (const [cls, dir] of Object.entries(map)) {
        if (btn.classList.contains(cls)) {
          if (dir.x === -direction.x && dir.y === -direction.y) return;
          nextDirection = dir;
        }
      }
    });
    btn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      if (!gameRunning || isPaused) return;
      const map = {
        'dpad-up': { x: 0, y: -1 },
        'dpad-down': { x: 0, y: 1 },
        'dpad-left': { x: -1, y: 0 },
        'dpad-right': { x: 1, y: 0 },
      };
      for (const [cls, dir] of Object.entries(map)) {
        if (btn.classList.contains(cls)) {
          if (dir.x === -direction.x && dir.y === -direction.y) return;
          nextDirection = dir;
        }
      }
    });
  });

  // ── Initialize ───────────────────────────────────────
  init();

  // Pre-init auth (non-blocking)
  getAuthToken().then(() => {
    ensureUserId();
    updatePlayerBar();
  });

  // Show start screen (handles name flow)
  showStartScreen();

  // Draw initial state
  draw();

  // Prevent scrolling on game area
  wrapper.addEventListener('wheel', e => e.preventDefault(), { passive: false });

  // ── Leaderboard Modal ───────────────────────────────
  async function syncPending() {
    const pending = pendingScores();
    if (pending.length === 0) return true;

    let synced = 0;
    for (const entry of pending) {
      const ok = await submitToFirebase(entry.name, entry.score);
      if (ok) synced++;
    }

    if (synced === pending.length) {
      clearPending();
      return true;
    }
    // Keep unsynced ones (partial failure unlikely, but handle it)
    if (synced > 0) {
      const remaining = pending.slice(synced);
      try { localStorage.setItem(PENDING_KEY, JSON.stringify(remaining)); } catch (e) {}
    }
    return synced === pending.length;
  }


  async function renderLeaderboard() {
    const lbContent = document.getElementById('lbContent');
    lbContent.innerHTML = '<div class="lb-loading">加载中...</div>';

    const pending = pendingScores();
    if (pending.length > 0) await syncPending();

    const local = localScores();
    const remote = await fetchFirebase();
    const data = mergeScoresFB(local, remote || []);

    if (data.length === 0) {
      lbContent.innerHTML = '<div class="lb-empty">还没有记录<br>快来拿下第一名吧！</div>';
      return;
    }

    let status = '';
    const stillPending = pendingScores().length;
    if (!remote && stillPending === 0) {
      status = '<div style="text-align:center;font-size:11px;color:var(--text-dim);margin-bottom:12px;">无法连接服务器，显示本地记录</div>';
    } else if (!remote && stillPending > 0) {
      status = '<div style="text-align:center;font-size:11px;color:var(--danger);margin-bottom:12px;">无法连接服务器，' + stillPending + ' 条记录待同步</div>';
    }

    lbContent.innerHTML = status + data.map((entry, i) => {
      let topClass = '';
      let rankIcon = String(i + 1);
      if (i === 0) { topClass = 'top1'; rankIcon = '👑'; }
      else if (i === 1) { topClass = 'top2'; rankIcon = '🥈'; }
      else if (i === 2) { topClass = 'top3'; rankIcon = '🥉'; }
      return `
        <div class="lb-row ${topClass}" data-uid="${(entry.uid||'')}" data-name="${escapeHtml(entry.name)}" data-score="${entry.score}" style="cursor:pointer;">
          <span class="lb-rank">${rankIcon}</span>
          <span class="lb-name">${escapeHtml(entry.name)}</span>
          <span class="lb-score">${entry.score}</span>
        </div>`;
    }).join('');
  }

  // Friends board
  async function renderFriendsBoard() {
    const fc = document.getElementById('friendsContent');
    fc.innerHTML = '<div class="lb-loading">加载中...</div>';

    if (isAdmin()) {
      // Admin: friends = all players, re-render same as leaderboard
      await renderLeaderboard();
      const lbHtml = document.getElementById('lbContent').innerHTML;
      fc.innerHTML = lbHtml;
      return;
    }

    const pending = pendingScores();
    if (pending.length > 0) await syncPending();

    const local = localScores();
    const remote = await fetchFirebase();
    let data = mergeScoresFB(local, remote || []);
    const friends = await getMyFriends();
    const friendNames = new Set(friends.map(f => f.name));
    data = data.filter(e => friendNames.has(e.name));

    if (data.length === 0) {
      fc.innerHTML = '<div class="lb-empty">还没有添加好友<br>去排行榜添加吧</div>';
      return;
    }

    fc.innerHTML = data.map((entry, i) => {
      let topClass = '';
      let rankIcon = String(i + 1);
      if (i === 0) { topClass = 'top1'; rankIcon = '👑'; }
      else if (i === 1) { topClass = 'top2'; rankIcon = '🥈'; }
      else if (i === 2) { topClass = 'top3'; rankIcon = '🥉'; }
      return `
        <div class="lb-row ${topClass}" data-uid="${(entry.uid||'')}" data-name="${escapeHtml(entry.name)}" data-score="${entry.score}" style="cursor:pointer;">
          <span class="lb-rank">${rankIcon}</span>
          <span class="lb-name">${escapeHtml(entry.name)}</span>
          <span class="lb-score">${entry.score}</span>
        </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Click delegation: leaderboard row → player profile
  lbContent.addEventListener('click', async (e) => {
    const row = e.target.closest('.lb-row');
    if (!row) return;
    const uid = row.dataset.uid;
    const name = row.dataset.name;
    const score = parseInt(row.dataset.score, 10);
    showPlayerProfile(uid, name, score);
  });

  // Friends content click delegation
  document.getElementById('friendsContent').addEventListener('click', async (e) => {
    const row = e.target.closest('.lb-row');
    if (!row) return;
    const uid = row.dataset.uid;
    const name = row.dataset.name;
    const score = parseInt(row.dataset.score, 10);
    showPlayerProfile(uid, name, score);
  });

  async function showPlayerProfile(uid, name, score) {
    const modal = document.getElementById('profileBg');
    const content = document.getElementById('profileContent');
    modal.classList.add('active');
    content.innerHTML = '<div class="lb-loading">加载中...</div>';

    // Fetch player details
    let userInfo = null;
    let userId = null;
    if (uid) {
      try {
        const token = await getAuthToken();
        // Search userIdIndex for this uid
        const res = await fetch(`${FB_DB}/userIdIndex.json?auth=${token}`, { signal: AbortSignal.timeout(5000) });
        if (res.ok) {
          const obj = await res.json();
          if (obj) {
            for (const [id, data] of Object.entries(obj)) {
              if (data && data.uid === uid) {
                userId = String(id).padStart(6, '0');
                userInfo = data;
                break;
              }
            }
          }
        }
      } catch (e) {}
    }

    const qqInfo = getQQInfo();
    const myAvatar = qqInfo ? qqInfo.avatar : '';
    const myUid = currentUid;

    // Check friend status
    let isFriend = false;
    if (myUid && uid) {
      try {
        const token = await getAuthToken();
        const res = await fetch(`${FB_DB}/friends/${myUid}/${uid}.json?auth=${token}`, { signal: AbortSignal.timeout(5000) });
        if (res.ok) {
          const data = await res.json();
          if (data) isFriend = true;
        }
      } catch (e) {}
    }

    const avatarHtml = userInfo && userInfo.avatar
      ? `<img src="${userInfo.avatar}" style="width:52px;height:52px;border-radius:50%;object-fit:cover;" alt="">`
      : `<span style="font-size:22px;">${name.charAt(0).toUpperCase()}</span>`;

    const idDisplay = userId ? `<div class="user-id-display">ID <span>${userId}</span></div>` : '';

    const actionBtn = (uid && myUid && uid !== myUid && !isFriend)
      ? `<button class="btn" id="btnProfileAddFriend" style="margin-top:8px;">添加好友</button>`
      : (isFriend ? '<p style="text-align:center;font-size:11px;color:var(--accent);margin-top:8px;">✓ 已是好友</p>' : '');

    const achCount = ACHIEVEMENTS.filter(a => snakeAchievements[a.id]).length;
    const isSelf = uid && myUid && uid === myUid;
    content.innerHTML = `
      <div style="text-align:center;margin-bottom:12px;">
        <div class="player-avatar" style="width:52px;height:52px;margin:0 auto 8px;display:flex;justify-content:center;align-items:center;">${avatarHtml}</div>
        <div style="font-size:16px;color:var(--text);font-weight:400;">${escapeHtml(name)}</div>
      </div>
      ${idDisplay}
      <div class="profile-tabs">
        <button class="profile-tab active" data-tab="history">历史战绩</button>
        <button class="profile-tab" data-tab="ach">成就 ${achCount}/${ACHIEVEMENTS.length}</button>
      </div>
      <div id="profileHistory">
        <div class="history-stats">
          <div class="history-stat">
            <div class="history-stat-val">${score}</div>
            <div class="history-stat-label">最高分</div>
          </div>
          <div class="history-stat">
            <div class="history-stat-val">${userInfo && userInfo.platform ? (userInfo.platform === 'qq' ? 'QQ' : '游客') : '-'}</div>
            <div class="history-stat-label">登录方式</div>
          </div>
        </div>
        ${actionBtn}
      </div>
      <div id="profileAch" style="display:none;"><div class="ach-grid" id="achGrid"></div></div>
    `;
    // Tab switching
    content.querySelectorAll('.profile-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        content.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('profileHistory').style.display = tab.dataset.tab === 'history' ? '' : 'none';
        document.getElementById('profileAch').style.display = tab.dataset.tab === 'ach' ? '' : 'none';
        if (tab.dataset.tab === 'ach') renderAchGrid();
      });
    });
    if (document.getElementById('profileAch').style.display !== 'none') renderAchGrid();

    // Add friend button handler
    const btnAdd = document.getElementById('btnProfileAddFriend');
    if (btnAdd) {
      btnAdd.addEventListener('click', async () => {
        const ok = await sendFriendRequest(uid, name);
        if (ok) {
          alert('已发送好友请求给 ' + name);
          modal.classList.remove('active');
        } else {
          alert('发送失败，请检查网络');
        }
      });
    }
  }

  // Profile modal close
  document.getElementById('btnProfileClose').addEventListener('click', () => {
    document.getElementById('profileBg').classList.remove('active');
  });
  document.getElementById('profileBg').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('active');
  });

  // Leaderboard button opens modal
  document.getElementById('btnLeaderboard').addEventListener('click', () => {
    document.getElementById('lbModalBg').classList.add('active');
    renderLeaderboard();
  });

  // Friends button opens friends modal
  document.getElementById('btnFriends').addEventListener('click', () => {
    document.getElementById('friendsModalBg').classList.add('active');
    renderFriendsBoard();
  });

  // Leaderboard modal close
  document.getElementById('btnLbClose').addEventListener('click', () => {
    document.getElementById('lbModalBg').classList.remove('active');
  });
  document.getElementById('lbModalBg').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('active');
  });

  // Friends modal close
  document.getElementById('btnFriendsClose').addEventListener('click', () => {
    document.getElementById('friendsModalBg').classList.remove('active');
  });
  document.getElementById('friendsModalBg').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('active');
  });


  // Add friend button
  document.getElementById('btnAddFriend').addEventListener('click', () => {
    document.getElementById('addFriendBg').classList.add('active');
    document.getElementById('friendSearch').value = '';
    document.getElementById('searchHints').innerHTML = '';
    setTimeout(() => document.getElementById('friendSearch').focus(), 100);
  });

  // Add friend search
  let searchTimeout;
  document.getElementById('friendSearch').addEventListener('input', () => {
    clearTimeout(searchTimeout);
    const q = document.getElementById('friendSearch').value.trim();
    if (q.length < 1) {
      document.getElementById('searchHints').innerHTML = '';
      return;
    }
    searchTimeout = setTimeout(async () => {
      const results = await searchUsers(q);
      const hints = document.getElementById('searchHints');
      if (results.length === 0) {
        hints.innerHTML = '<div class="search-none">未找到用户</div>';
      } else {
        hints.innerHTML = results.map(r => `
          <div class="search-hint-row" data-uid="${r.uid}" data-name="${escapeHtml(r.name || r.fromName || '')}" data-avatar="${r.avatar||''}">
            <div class="friend-row-avatar">${r.avatar ? `<img src="${r.avatar}" alt="">` : (r.name||'?').charAt(0).toUpperCase()}</div>
            <span style="flex:1;">${escapeHtml(r.name || r.fromName || '')}</span>
            <span style="font-family:monospace;font-size:11px;color:var(--text-dim);">${r.userId}</span>
          </div>`).join('');
        // Click handlers
        hints.querySelectorAll('.search-hint-row').forEach(row => {
          row.addEventListener('click', async () => {
            const targetUid = row.dataset.uid;
            const targetName = row.dataset.name;
            const myName = localStorage.getItem('snakePlayerName') || 'Player';
            const ok = await sendFriendRequest(targetUid, targetName);
            if (ok) {
              alert('已发送好友请求给 ' + targetName);
              document.getElementById('addFriendBg').classList.remove('active');
            } else {
              alert('发送失败，请检查网络');
            }
          });
        });
      }
    }, 300);
  });

  // Add friend modal close
  document.getElementById('btnAddFriendClose').addEventListener('click', () => {
    document.getElementById('addFriendBg').classList.remove('active');
  });
  document.getElementById('addFriendBg').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('active');
  });

  document.getElementById('btnClearScores').addEventListener('click', async () => {
    if (!confirm('确定要清除所有排行榜记录吗？此操作不可撤销。')) return;
    const ok = await clearAllScores();
    if (ok) {
      highScore = 0;
      highScoreEl.textContent = '0';
      localStorage.setItem('snakeHighScore', '0');
      scoreEl.textContent = '0';
      alert('已清除全部记录');
      renderLeaderboard('all');
    } else {
      alert('清除失败，请检查网络连接');
    }
  });

  // Keyboard: close modals, handle add friend
  document.addEventListener('keydown', (e) => {
    const addFriendBg = document.getElementById('addFriendBg');
    if (addFriendBg.classList.contains('active')) {
      if (e.key === 'Escape') { addFriendBg.classList.remove('active'); }
      return;
    }
  });

  // Player controls
  document.getElementById('mpPrev').addEventListener('click', () => {
    if (prevSong && musicPlaylist) {
      const idx = musicPlaylist.findIndex(s => s.id === prevSong.id);
      if (idx >= 0) {
        [musicPlaylist[0], musicPlaylist[idx]] = [musicPlaylist[idx], musicPlaylist[0]]; // swap
        if (!musicPlaying) { musicMuted = false; musicPlaying = true; }
        playRandomSong();
      }
    } else if (musicPlayer) {
      musicPlayer.currentTime = 0;
    }
  });
  document.getElementById('mpPlay').addEventListener('click', () => toggleMusic());
  document.getElementById('mpNext').addEventListener('click', () => skipSong());
  document.getElementById('mpBarBg').addEventListener('click', (e) => {
    if (!musicPlayer || !musicPlayer.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    musicPlayer.currentTime = pct * musicPlayer.duration;
  });

  // Try to load playlist on startup
  loadPlaylist();
})();
</script>
</body>
</html>
