<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 数字苔藓</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1815;font-family:"Noto Serif SC",Georgia,serif;touch-action:none;user-select:none}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}

#topBar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;pointer-events:none}
#topBar>*{pointer-events:auto}
#topBar .title{font-size:16px;color:rgba(255,255,255,.7);letter-spacing:3px}
#topBar .title em{font-style:normal;font-size:10px;opacity:.4;margin-left:10px;letter-spacing:1px}
#topBar button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:5px 14px;font-size:11px;color:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;transition:all .25s}
#topBar button:hover{background:rgba(255,255,255,.12);color:rgba(255,255,255,.8)}

#gardenInfo{position:fixed;bottom:28px;right:28px;z-index:10;font-size:11px;color:rgba(255,255,255,.35);text-align:right;letter-spacing:1px;line-height:2;pointer-events:none}
#gardenInfo .s{font-size:24px;display:block}

#aboutBg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s}
#aboutBg.show{opacity:1;pointer-events:auto}
#aboutBox{background:#24201b;color:#d5cdc4;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:32px 28px;max-width:380px;width:90%;text-align:center;line-height:1.9;font-size:14px}
#aboutBox h3{font-size:22px;margin-bottom:14px;color:#c0a880}
#aboutBox p{margin-bottom:6px;color:#8a7e70}
#aboutBox button{background:#8b6f4e;color:#fff;border:none;border-radius:20px;padding:9px 28px;font-size:14px;cursor:pointer;font-family:inherit;margin-top:14px;transition:all .2s}
#aboutBox button:hover{background:#a08060}

#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(192,168,128,.9);color:#1a1815;padding:8px 20px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

/* Plant tooltip */
#plantTip{position:fixed;z-index:20;pointer-events:none;opacity:0;transition:opacity .15s;background:rgba(36,32,27,.92);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 14px;color:#d5cdc4;font-size:12px;line-height:1.7;max-width:200px;backdrop-filter:blur(8px)}
#plantTip .pt-name{font-size:14px;font-weight:700;color:#c0a880;margin-bottom:4px}
#plantTip .pt-bar{height:3px;border-radius:2px;margin-top:4px;background:rgba(255,255,255,.1)}

@media(max-width:480px){#topBar{padding:12px 14px}#topBar .title{font-size:14px}#gardenInfo{bottom:18px;right:16px;font-size:10px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="topBar">
  <span class="title">数字苔藓<em id="visitCount">访问 0 次</em></span>
  <span><button onclick="location.href='/'">← 博客</button><button onclick="readRandom()" style="margin-left:6px">📖 读</button><button onclick="showAbout()" style="margin-left:6px">关于</button></span>
</div>

<div id="gardenInfo">
  <span class="s" id="seasonIcon">☀️</span>
  <span id="plantSummary">0 株 · 0 朵盛开</span>
</div>

<div id="aboutBg" onclick="if(event.target===this)hideAbout()">
  <div id="aboutBox">
    <h3>🌿 数字苔藓</h3>
    <p>一个活着的网页花园<br>每次访问，土壤中都会长出新生命</p>
    <p>💧 <b>点击</b>浇水照料<br>被爱的植物开花，被遗忘的枯萎</p>
    <p>🌸 春 &nbsp;☀️ 夏 &nbsp;🍂 秋 &nbsp;❄️ 冬</p>
    <p style="font-size:11px;opacity:.4">悬停植物查看信息 · 连续7天浇水诞生稀有植物 ✨</p>
    <p style="font-size:12px;opacity:.6;margin-top:8px">📖 这里是<a href="/" style="color:#c0a880">虞舍博客</a>的后花园<br>每一株植物都是一次安静的到访</p>
    <button onclick="hideAbout()">知道了</button>
  </div>
</div>

<div id="toast"></div>
<div id="plantTip"><div class="pt-name"></div><div class="pt-info"></div><div class="pt-bar"><div class="pt-fill"></div></div></div>

<script>
// ===== CONFIG =====
var API='/garden',SID=sessionStorage._moss_sid||(sessionStorage._moss_sid='sess_'+Math.random().toString(36).slice(2,10));

// ===== STATE =====
var S={
  plants:[],totalVisits:0,season:'summer',month:6,
  assets:{},loaded:false,
  rain:[],snow:[],fireflies:[],
  anims:{},time:0,
  mouse:{x:0,y:0},hovered:null,
  snail:{x:.3,dir:1,ph:0,trail:[]} // snail state
};

// ===== DAY/NIGHT CYCLE =====
function dayPhase(){
  var h=new Date().getHours()+new Date().getMinutes()/60;
  // 6am=0, 12pm=0.5, 6pm=1, 12am=0.5 (night), 6am=0
  var p=Math.sin((h-6)/24*Math.PI*2)*.5+.5; // 0=night peak(12am), 0.5=transition, 1=day peak(12pm)
  return Math.max(0,Math.min(1,p));
}

// ===== SEASON =====
function getSeason(m){m=m||new Date().getMonth()+1;if(m>=3&&m<=5)return'spring';if(m>=6&&m<=8)return'summer';if(m>=9&&m<=11)return'autumn';return'winter'}

// Day palette (noon) and night palette (midnight) — blended by dayPhase()
var PAL_DAY={
  spring:{sky1:'#1a2820',sky2:'#1e3028',earth:'#3a4830',earthHi:'#4a5a3a',light:'#e8d8a0',icon:'🌸'},
  summer:{sky1:'#1a2418',sky2:'#1e2c20',earth:'#384528',earthHi:'#485a35',light:'#f0e0a0',icon:'☀️'},
  autumn:{sky1:'#1c1a15',sky2:'#241e18',earth:'#403020',earthHi:'#504030',light:'#f0d090',icon:'🍂'},
  winter:{sky1:'#181a1c',sky2:'#1e2024',earth:'#383430',earthHi:'#484440',light:'#e0e4e8',icon:'❄️'}
};
var PAL_NIGHT={
  spring:{sky1:'#0d1418',sky2:'#101a20',earth:'#1a2018',earthHi:'#222a20',light:'#8090c0',icon:'🌸'},
  summer:{sky1:'#0d1210',sky2:'#101a18',earth:'#182018',earthHi:'#202820',light:'#8090c0',icon:'☀️'},
  autumn:{sky1:'#0e0d10',sky2:'#121018',earth:'#1a1410',earthHi:'#221c14',light:'#8090c0',icon:'🍂'},
  winter:{sky1:'#0c0e10',sky2:'#101218',earth:'#181a18',earthHi:'#202220',light:'#8090c0',icon:'❄️'}
};

function pal(){
  var dp=dayPhase();
  var d=PAL_DAY[S.season]||PAL_DAY.summer;
  var n=PAL_NIGHT[S.season]||PAL_NIGHT.summer;
  // Blend between night and day
  function blend(a,b,t){var ah=parseInt(a.slice(1),16),bh=parseInt(b.slice(1),16);
    var ar=ah>>16,ag=(ah>>8)&255,ab=ah&255,br=bh>>16,bg=(bh>>8)&255,bb=bh&255;
    var rr=Math.round(ar+(br-ar)*t),rg=Math.round(ag+(bg-ag)*t),rb=Math.round(ab+(bb-ab)*t);
    return '#'+((rr<<16)|(rg<<8)|rb).toString(16).padStart(6,'0');}
  return {
    sky1:blend(n.sky1,d.sky1,dp),sky2:blend(n.sky2,d.sky2,dp),
    earth:blend(n.earth,d.earth,dp),earthHi:blend(n.earthHi,d.earthHi,dp),
    light:blend(n.light,d.light,dp),icon:d.icon
  };
}

// ===== API =====
async function G(p){var r=await fetch(API+p,{headers:{'X-Session-Id':SID}});return r.json()}
async function P(p,b){var r=await fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json','X-Session-Id':SID},body:JSON.stringify(b||{})});return r.json()}

// ===== STAGE =====
function stage(p){var h=p.health==null?30:p.health;if(h<=0)return'w';if(h<20)return'd';if(h<40)return's';if(h<70)return'g';return'b'}
function sSize(s){if(s==='d')return 0;if(s==='s')return.55;if(s==='g')return.8;if(s==='b')return 1;return.5}
var TYPE_NAMES={fern:'蕨',flower:'花',mushroom:'蘑菇',grass:'草',succulent:'多肉',vine:'藤蔓',glowing:'✨光'};
var STAGE_NAMES={d:'种子',s:'嫩芽',g:'成长中',b:'盛开',w:'枯萎'};

// ===== CANVAS =====
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function R(){cv.width=window.innerWidth;cv.height=window.innerHeight}
window.addEventListener('resize',R);R();
function X(x){return x*cv.width}
function Y(y){return y*cv.height}

// ===== FIREFLIES =====
var ff=[];
(function initFF(){for(var i=0;i<25;i++)ff.push({x:Math.random(),y:.5+Math.random()*.4,z:.3+Math.random()*.7,ph:Math.random()*Math.PI*2,sp:.3+Math.random()*.7})})();

// Stars — fixed positions, visible at night
var stars=[];
(function initStars(){for(var i=0;i<80;i++)stars.push({x:Math.random(),y:Math.random()*.45,r:.3+Math.random()*.8,tw:Math.random()*Math.PI*2})})();

// Pebbles on earth
var pebbles=[];
(function initPebbles(){for(var i=0;i<30;i++)pebbles.push({x:.05+Math.random()*.9,y:.5+Math.random()*.45,r:1.5+Math.random()*5,o:.03+Math.random()*.06})})();

// Fallen leaves on the ground
var leaves=[];
(function initLeaves(){for(var i=0;i<12;i++)leaves.push({x:.05+Math.random()*.9,y:.48+Math.random()*.45,a:Math.random()*Math.PI*2,r:.6+Math.random()*1.2,ph:Math.random()*Math.PI*2,sp:.2+Math.random()*.5})})();

// Dew sparkles along grass edge
var dews=[];
(function initDews(){for(var i=0;i<35;i++)dews.push({x:.02+Math.random()*.96,ph:Math.random()*Math.PI*2,sp:.5+Math.random()*1.2,r:.3+Math.random()*.6})})();

// Wild mushrooms (decorative scenery, not interactive)
var wildMushrooms=[];
(function initWild(){for(var i=0;i<5;i++)wildMushrooms.push({x:.05+Math.random()*.9,y:.52+Math.random()*.42,r:3+Math.random()*6})})();

// Signboard
var signQuotes=[
  '万物有裂痕，那是光照进来的地方',
  '安静地写，慢慢地读，深深地想',
  '要么写值得读的东西，要么做值得写的事',
  '简单是最高级的复杂',
  '写作是为了知道自己在想什么',
  '好的代码像一首诗，好的文章像一个人',
  '一个人只拥有此生是不够的，还应有诗意的世界',
  '思而不学则殆，学而不思则罔',
  '阅读是随身携带的避难所',
  '程序员的浪漫，是把一行行代码写成诗'
];
var signboard={x:.22,quoteIdx:0,timer:0,alpha:1};

// Butterfly
var butterfly={x:.5,y:.4,vx:0,vy:0,targetX:.5,targetY:.4,ph:0,wing:0,timer:0};

// Earth surface curve function — returns y for given normalized x
function earthY(nx){
  var w=cv.width,h=cv.height,baseY=h*.48,moundH=h*.52;
  return baseY-moundH*.35*Math.sin(nx*w*.0008+.3)-moundH*.15*Math.sin(nx*w*.002+1.8)-moundH*.08*Math.sin(nx*w*.005);
}

// ===== DRAW: BACKGROUND =====
function drawBG(){
  var p=pal();
  var g=ctx.createRadialGradient(cv.width*.5,cv.height*.25,0,cv.width*.5,cv.height*.6,cv.height*1.1);
  g.addColorStop(0,p.sky1);g.addColorStop(1,p.sky2);
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
}

function drawLight(){
  var p=pal(),dp=dayPhase();
  var a=.08+dp*.1; // brighter during day
  var g=ctx.createRadialGradient(cv.width*.5,cv.height*.15,cv.width*.01,cv.width*.5,cv.height*.4,cv.width*.6);
  g.addColorStop(0,p.light+Math.round(a*255).toString(16).padStart(2,'0'));
  g.addColorStop(.5,p.light+'05');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
}

// ===== DRAW: EARTH =====
function drawEarth(){
  var p=pal(),w=cv.width,h=cv.height,baseY=h*.48,moundH=h*.52;

  var g=ctx.createLinearGradient(0,baseY,0,h);
  g.addColorStop(0,p.earthHi);g.addColorStop(.15,p.earth);g.addColorStop(1,'#1a1815');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(0,h);
  for(var x=0;x<=w;x+=3)ctx.lineTo(x,earthY(x/w));
  ctx.lineTo(w,h);ctx.closePath();ctx.fill();

  // Highlight edge
  ctx.strokeStyle=p.earthHi+'40';ctx.lineWidth=1.5;
  ctx.beginPath();
  for(var x=0;x<=w;x+=3){var y=earthY(x/w);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
  ctx.stroke();

  // Sediment
  for(var ly=0;ly<6;ly++){
    var ly2=baseY+moundH*.08+ly*moundH*.1;
    ctx.strokeStyle='rgba(0,0,0,'+(.03+ly*.01)+')';ctx.lineWidth=1;
    ctx.beginPath();
    for(var x=0;x<=w;x+=20){var dy=ly2+moundH*.02*Math.sin(x*.001+ly);if(x===0)ctx.moveTo(x,dy);else ctx.lineTo(x,dy)}
    ctx.stroke();
  }

  // Small grass tufts along edge
  for(var x=0;x<w;x+=14){
    var ey=earthY(x/w),ex=x;
    ctx.strokeStyle='rgba(180,200,160,.12)';ctx.lineWidth=1;
    for(var gx=0;gx<3;gx++){
      ctx.beginPath();ctx.moveTo(ex+gx*3,ey);
      ctx.quadraticCurveTo(ex+gx*3+1,ey-3,ex+gx*3+2,ey-6-Math.random()*3);ctx.stroke();
    }
  }
}

// Distant tree silhouettes
function drawTrees(){
  var dp=dayPhase();
  ctx.fillStyle='rgba(10,12,8,'+(.25+dp*.05)+')';
  for(var i=0;i<18;i++){
    var tx=(i/17)*cv.width;
    var th=40+Math.sin(i*2.7)*20+Math.sin(i*5.1)*15;
    var ty=earthY(i/17)-th;
    // Simple pine/tree shape
    ctx.beginPath();ctx.moveTo(tx,ty+th);
    ctx.lineTo(tx-12,ty+th*.3);ctx.lineTo(tx-3,ty+th*.3);
    ctx.lineTo(tx-15,ty);ctx.lineTo(tx-1,ty+th*.15);
    ctx.lineTo(tx-18,ty-th*.3);ctx.lineTo(tx,ty-th*.4);
    ctx.lineTo(tx+18,ty-th*.3);ctx.lineTo(tx+1,ty+th*.15);
    ctx.lineTo(tx+15,ty);ctx.lineTo(tx+3,ty+th*.3);
    ctx.lineTo(tx+12,ty+th*.3);ctx.closePath();ctx.fill();
  }
}

// Pebbles on earth surface
function drawPebbles(){
  pebbles.forEach(function(b){
    var px=X(b.x),py=Y(b.y);
    var ey=earthY(b.x)/cv.height;
    if(Math.abs(b.y-ey)>.06&&b.y<ey)return;
    ctx.fillStyle='rgba(255,255,255,'+b.o+')';
    ctx.beginPath();ctx.ellipse(px,py,b.r,b.r*.6,0,0,Math.PI*2);ctx.fill();
  });
}

// Fallen leaves
function drawLeaves(){
  leaves.forEach(function(l){
    var px=X(l.x),py=Y(l.y);
    l.ph+=.003;l.a+=Math.sin(l.ph)*.005;
    ctx.save();ctx.translate(px,py);ctx.rotate(l.a);
    ctx.fillStyle='rgba(160,120,60,.15)';
    ctx.beginPath();ctx.ellipse(0,0,l.r*3,l.r,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(120,90,40,.2)';ctx.lineWidth=.5;
    ctx.beginPath();ctx.moveTo(0,-l.r);ctx.lineTo(0,l.r);ctx.stroke();
    ctx.restore();
  });
}

// Dew sparkles
function drawDews(){
  dews.forEach(function(d){
    var px=X(d.x),py=Y(earthY(d.x)/cv.height)-3;
    d.ph+=.02;
    var a=.1+.15*Math.sin(d.ph*d.sp);
    ctx.fillStyle='rgba(255,255,255,'+a+')';
    ctx.beginPath();ctx.arc(px,py,d.r,0,Math.PI*2);ctx.fill();
  });
}

// Wild mushrooms
function drawWildMushrooms(){
  wildMushrooms.forEach(function(m){
    var px=X(m.x),py=Y(m.y);
    ctx.fillStyle='rgba(180,160,140,.15)';
    ctx.beginPath();ctx.ellipse(px,py-m.r,m.r,m.r*.6,Math.PI,0,0);ctx.fill();
    ctx.fillStyle='rgba(200,180,160,.1)';
    ctx.fillRect(px-m.r*.2,py-m.r,m.r*.4,m.r);
  });
}

// Butterfly
function updateButterfly(dt){
  var b=butterfly;b.timer-=dt;
  if(b.timer<=0){
    b.timer=2+Math.random()*4;
    b.targetX=.1+Math.random()*.8;
    b.targetY=.35+Math.random()*.55;
  }
  b.vx+=(b.targetX-b.x)*dt*.3;b.vy+=(b.targetY-b.y)*dt*.3;
  b.vx*=Math.pow(.01,dt);b.vy*=Math.pow(.01,dt);
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  b.wing+=dt*12;
}
function drawButterfly(){
  var b=butterfly,px=X(b.x),py=Y(b.y);
  var wa=.4*Math.sin(b.wing);
  ctx.fillStyle='rgba(220,180,140,.25)';
  ctx.beginPath();ctx.ellipse(px+5,py-5,6,3,wa,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(px-5,py-5,6,3,-wa,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(240,220,180,.3)';
  ctx.beginPath();ctx.ellipse(px,py,2,4,0,0,Math.PI*2);ctx.fill();
}

// Signboard — polished wooden notice board
function updateSignboard(dt){
  var sb=signboard;sb.timer+=dt;
  if(sb.timer>22){sb.timer=0;sb.alpha=0;sb.quoteIdx=(sb.quoteIdx+1)%signQuotes.length}
  if(sb.alpha<1)sb.alpha=Math.min(1,sb.alpha+dt*.6);
}
function drawSignboard(){
  var sb=signboard,dp=dayPhase();
  var sx=X(sb.x),sy=earthY(sb.x);
  var ph=65; // post height in px

  // Shadow under post
  ctx.fillStyle='rgba(0,0,0,.1)';
  ctx.beginPath();ctx.ellipse(sx,sy+1,8,3,0,0,Math.PI*2);ctx.fill();

  // Wood post — draw grain with multiple lines
  var postGrad=ctx.createLinearGradient(sx-4,0,sx+4,0);
  postGrad.addColorStop(0,'#5a3a20');postGrad.addColorStop(.3,'#7a5030');postGrad.addColorStop(.5,'#8a6040');postGrad.addColorStop(.7,'#7a5030');postGrad.addColorStop(1,'#4a2a10');
  ctx.fillStyle=postGrad;
  ctx.fillRect(sx-4,sy-ph,8,ph);
  // Wood grain lines
  for(var gi=0;gi<8;gi++){
    var gy=sy-ph+5+gi*8,goff=1.5*Math.sin(gi*1.7);
    ctx.strokeStyle='rgba(0,0,0,'+(.06+Math.random()*.04)+')';ctx.lineWidth=.6;
    ctx.beginPath();ctx.moveTo(sx-3+goff,gy);ctx.lineTo(sx+3-goff,gy+2);ctx.stroke();
  }
  // Post top — slight round
  ctx.fillStyle='#6a4028';
  ctx.beginPath();ctx.ellipse(sx,sy-ph,4,2,0,0,Math.PI*2);ctx.fill();

  // Board
  var bw=105,bh=38,bx=sx-bw/2,by=sy-ph-bh+8;
  // Board shadow on post
  ctx.fillStyle='rgba(0,0,0,.08)';
  ctx.fillRect(bx+2,by+3,bw,bh);

  // Board body — subtle wood gradient
  var bGrad=ctx.createLinearGradient(0,by,0,by+bh);
  bGrad.addColorStop(0,'#c4a878');bGrad.addColorStop(.3,'#d4b888');bGrad.addColorStop(.7,'#b89868');bGrad.addColorStop(1,'#a08058');
  ctx.fillStyle=bGrad;
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,3);ctx.fill();

  // Board border — darker frame
  ctx.strokeStyle='#8a6848';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,3);ctx.stroke();
  // Inner border line
  ctx.strokeStyle='rgba(0,0,0,.1)';ctx.lineWidth=.8;
  ctx.beginPath();ctx.roundRect(bx+4,by+4,bw-8,bh-8,1);ctx.stroke();

  // Wood grain on board
  for(var bi=0;bi<5;bi++){
    var by2=by+6+bi*7;
    ctx.strokeStyle='rgba(0,0,0,'+(.02+bi*.005)+')';ctx.lineWidth=.5;
    ctx.beginPath();ctx.moveTo(bx+6,by2+Math.sin(bi*2)*2);ctx.lineTo(bx+bw-6,by2+Math.sin(bi*3)*2);ctx.stroke();
  }

  // Nail heads — 4 corners
  var nails=[[bx+8,by+6],[bx+bw-8,by+6],[bx+8,by+bh-6],[bx+bw-8,by+bh-6]];
  nails.forEach(function(n){
    ctx.fillStyle='#3a2a18';ctx.beginPath();ctx.arc(n[0],n[1],2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.arc(n[0]-.5,n[1]-.5,1,0,Math.PI*2);ctx.fill();
  });

  // Glow behind text for readability
  var glowCx=sx,glowCy=by+bh/2;
  var gl=ctx.createRadialGradient(glowCx,glowCy,0,glowCx,glowCy,bw*.6);
  gl.addColorStop(0,'rgba(20,15,8,'+(.25*sb.alpha)+')');gl.addColorStop(1,'rgba(20,15,8,0)');
  ctx.fillStyle=gl;ctx.fillRect(bx-10,by-5,bw+20,bh+10);

  // Text
  var txt=signQuotes[sb.quoteIdx],txtAlpha=.7+dp*.2;
  ctx.fillStyle='rgba(30,20,10,'+(txtAlpha*sb.alpha)+')';
  ctx.font='bold 11px "Noto Serif SC",Georgia,serif';ctx.textAlign='center';ctx.textBaseline='middle';
  if(txt.length>12){
    var mid=Math.ceil(txt.length/2);
    ctx.fillText(txt.slice(0,mid),sx,by+bh/2-6);
    ctx.fillText(txt.slice(mid),sx,by+bh/2+8);
  }else if(txt.length>6){
    var h1=Math.ceil(txt.length/2);
    ctx.fillText(txt.slice(0,h1),sx,by+bh/2-5);
    ctx.fillText(txt.slice(h1),sx,by+bh/2+7);
  }else{
    ctx.fillText(txt,sx,by+bh/2);
  }
}

// Stars (night only)
function drawStars(){
  var dp=dayPhase();
  if(dp>.35)return; // visible only when quite dark
  var a=(.35-dp)/.35*.7; // 0 to 0.7
  stars.forEach(function(s){
    var tw=a*(.5+.5*Math.sin(S.time*.001+s.tw));
    ctx.fillStyle='rgba(255,255,255,'+tw+')';
    ctx.beginPath();ctx.arc(X(s.x),Y(s.y),s.r,0,Math.PI*2);ctx.fill();
  });
}

// Moon
function drawMoon(){
  var dp=dayPhase();
  if(dp>.3)return;
  var a=.35-dp;
  var mx=cv.width*.75,my=cv.height*.15;
  var g=ctx.createRadialGradient(mx,my,0,mx,my,60);
  g.addColorStop(0,'rgba(255,250,240,'+(.2*a)+')');g.addColorStop(1,'rgba(255,250,240,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(mx,my,60,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,250,240,'+(.6*a)+')';
  ctx.beginPath();ctx.arc(mx,my,20,0,Math.PI*2);ctx.fill();
}

// Ground fog along horizon
function drawFog(){
  var base=cv.height*.42;
  var g=ctx.createLinearGradient(0,base-20,0,base+60);
  g.addColorStop(0,'rgba(180,190,200,0)');g.addColorStop(.4,'rgba(180,190,200,.04)');g.addColorStop(1,'rgba(180,190,200,0)');
  ctx.fillStyle=g;ctx.fillRect(0,base-20,cv.width,80);
}

// Vignette
function drawVignette(){
  var w=cv.width,h=cv.height;
  var g=ctx.createRadialGradient(w*.5,h*.5,w*.3,w*.5,h*.5,w*.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.35)');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
}

// Drifting particles (pollen/spring, dust/summer, leaves/autumn, snow already done for winter)
var drift=[];
(function initDrift(){for(var i=0;i<20;i++)drift.push({x:Math.random(),y:.35+Math.random()*.6,vy:-3-Math.random()*8,vx:(Math.random()-.5)*6,r:.4+Math.random()*1.5,life:3+Math.random()*6,ph:Math.random()*Math.PI*2})})();
function updateDrift(dt){
  for(var i=drift.length-1;i>=0;i--){
    var d=drift[i];d.y+=d.vy*dt;d.x+=d.vx*dt+Math.sin(d.ph+S.time*.001)*3*dt;d.ph+=dt;d.life-=dt;
    if(d.life<=0){d.life=3+Math.random()*6;d.y=.42+Math.random()*.55;d.x=Math.random();}
    if(d.y<.35){d.y=.42+Math.random()*.55;d.x=Math.random()}
  }
}
function drawDrift(){
  var dp=dayPhase();
  var a=.03+dp*.06;
  drift.forEach(function(d){
    ctx.fillStyle='rgba(220,210,190,'+a+')';
    ctx.beginPath();ctx.arc(X(d.x),Y(d.y),d.r,0,Math.PI*2);ctx.fill();
  });
}

function sortP(){S.plants.sort(function(a,b){return a.y-b.y})}

// ===== DRAW: PLANT =====
function drawPlant(p){
  var st=stage(p),sz=p.size||.5;
  if(st==='d')return;
  var px=X(p.x),py=Y(p.y);
  var bs=sSize(st),t=sz*bs;
  var a=S.anims[p.id];
  if(a){var el=(Date.now()-a.t)/1000;if(el<.4){var tt=el/.4;t*=1+.2*Math.sin(tt*Math.PI)*Math.exp(-tt*5)}else delete S.anims[p.id]}

  ctx.save();
  if(st==='w'){ctx.globalAlpha=.35;ctx.filter='grayscale(100%)'}

  // Shadow
  var sw=t*55+5;
  ctx.fillStyle='rgba(0,0,0,.12)';
  ctx.beginPath();ctx.ellipse(px,py,sw,sw*.3,0,0,Math.PI*2);ctx.fill();

  drawPlantShape(p.type,p.variant,px,py,t);

  if(st==='blooming'){
    var gr=ctx.createRadialGradient(px,py-t*55,0,px,py-t*55,t*28);
    gr.addColorStop(0,'rgba(240,220,140,.12)');gr.addColorStop(1,'rgba(240,220,140,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(px,py-t*55,t*28,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();

  // Highlight if hovered
  if(S.hovered&&S.hovered.id===p.id){
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(px,py-25*t,sw+8,0,Math.PI*2);ctx.stroke();
  }
}

function drawPlantShape(t,v,px,py,s,bloom){
  var cs={fern:['#5a8c3f','#4a7c30','#6a9c4f'],flower:['#e8a0b8','#d490a8','#f0b8c8'],mushroom:['#c45a4a','#b04a3a','#d46a5a'],grass:['#7a9c4a','#6a8c3a','#8aac5a'],succulent:['#8aaa7a','#7a9a6a','#9aba8a'],vine:['#4a7c3f','#3a6c2f','#5a8c4f']};
  var col=cs[t]?cs[t][v%3]:'#6b8c42';

  switch(t){
  case'fern':
    ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,2*s);ctx.lineCap='round';ctx.beginPath();
    var n=Math.floor(5+s*10);
    for(var i=0;i<n;i++){var a=(i/n)*Math.PI*1.5,r=3+i*(34/n)*s,cx=px+Math.cos(a)*r*.35,cy=py-8-r*.7+Math.sin(a)*r*.15;ctx.moveTo(cx,cy);ctx.arc(cx,cy,Math.max(1,2.5*s),0,Math.PI*2)}
    ctx.stroke();break;
  case'flower':
    var fh=30*s;
    ctx.strokeStyle='#7a9c50';ctx.lineWidth=Math.max(1,2*s);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,py-fh);ctx.stroke();
    var pc=bloom?Math.floor(4+s*4):Math.floor(3+s*2);
    for(var j=0;j<pc;j++){var an=j*Math.PI*2/pc;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(px+Math.cos(an)*6*s,py-fh+Math.sin(an)*6*s,Math.max(2,5*s),Math.max(2,8*s),an,0,Math.PI*2);ctx.fill()}
    ctx.fillStyle='#ffe080';ctx.beginPath();ctx.arc(px,py-fh,Math.max(1.5,3.5*s),0,Math.PI*2);ctx.fill();break;
  case'mushroom':
    var mh=20*s;ctx.beginPath();ctx.ellipse(px,py-mh,Math.max(4,12*s),Math.max(3,8*s),Math.PI,0,0);ctx.fill();
    ctx.fillStyle='#e8d8c0';ctx.fillRect(px-Math.max(1,3*s),py-mh,Math.max(2,6*s),mh);break;
  case'grass':
    ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,2.2*s);ctx.lineCap='round';var bn=Math.floor(3+s*4);
    for(var g=0;g<bn;g++){ctx.beginPath();ctx.moveTo(px,py);ctx.quadraticCurveTo(px+(g-(bn-1)/2)*6*s,py-20*s,px+(g-(bn-1)/2)*4*s,py-38*s);ctx.stroke()}break;
  case'succulent':
    var ll=Math.floor(2+s*3);
    for(var l=ll;l>=0;l--){var rr=Math.max(2,(l+1)*5*s);ctx.beginPath();ctx.ellipse(px,py-8*s,rr,rr*.55,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=col;ctx.globalAlpha=.6+.4*(l/ll)}
    ctx.globalAlpha=1;break;
  case'vine':
    ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,2*s);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px,py);
    var vi=Math.floor(8+s*12);
    for(var m=0;m<vi;m++)ctx.lineTo(px+5*s*Math.sin(m*.6),py-m*(36/vi)*s);
    ctx.stroke();ctx.fillStyle=col;
    for(var m=2;m<vi-2;m+=Math.floor(vi/5)+1)ctx.beginPath(),ctx.arc(px+5*s*Math.sin(m*.6)+3*s,py-m*(36/vi)*s,Math.max(1,2.5*s),0,Math.PI*2),ctx.fill();
    break;
  }
}

// ===== SNAIL =====
function updateSnail(dt){
  var sn=S.snail;
  sn.ph+=dt;
  sn.x+=sn.dir*dt*.015;
  if(sn.x>1.05){sn.dir=-1;sn.x=1.05}
  if(sn.x<-.05){sn.dir=1;sn.x=-.05}
  // Trail
  sn.trail.push({x:sn.x,y:earthY(sn.x)/cv.height,t:sn.ph});
  if(sn.trail.length>60)sn.trail.shift();
}
function drawSnail(){
  var sn=S.snail;
  var sx=X(sn.x),sy=earthY(sn.x)-3;
  // Trail
  for(var i=0;i<sn.trail.length;i++){
    var tr=sn.trail[i],age=(sn.ph-tr.t)/4; // age in seconds
    if(age>3)continue;
    var a=Math.max(0,.15*(1-age/3));
    ctx.fillStyle='rgba(200,200,180,'+a+')';
    ctx.beginPath();ctx.arc(X(tr.x),Y(tr.y)-2,2,0,Math.PI*2);ctx.fill();
  }
  // Shell
  ctx.fillStyle='#8a7a60';
  ctx.beginPath();ctx.arc(sx,sy-5,6,Math.PI,0,0);ctx.fill();
  // Swirl
  ctx.strokeStyle='#6a5a40';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(sx,sy-5,4,Math.PI,Math.PI*1.5,0);ctx.stroke();
  ctx.beginPath();ctx.arc(sx,sy-5,2,Math.PI,Math.PI*1.5,0);ctx.stroke();
  // Body
  ctx.fillStyle='#b0a080';
  ctx.beginPath();ctx.ellipse(sx-3*sn.dir,sy+1,4,2,0,0,Math.PI*2);ctx.fill();
  // Antennae
  ctx.strokeStyle='#b0a080';ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(sx-6*sn.dir,sy);ctx.lineTo(sx-8*sn.dir,sy-4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx-5*sn.dir,sy-1);ctx.lineTo(sx-6*sn.dir,sy-5);ctx.stroke();
}

// ===== FIREFLIES =====
function updateFF(dt){
  var dp=dayPhase();
  ff.forEach(function(f){
    f.ph+=dt*f.sp*1.5;
    f.x+=Math.sin(f.ph)*dt*.02;
    f.y+=Math.cos(f.ph*.7)*dt*.01+dt*.005;
    if(f.y>.92)f.y=.48;if(f.x<0)f.x=1;if(f.x>1)f.x=0;
  });
}
function drawFF(){
  var dp=dayPhase(),brightness=.08+Math.max(0,1-dp*2)*.2; // brighter at night
  ff.forEach(function(f){
    var a=brightness*.5+brightness*.5*Math.sin(f.ph*2+S.time*.001);
    var px=X(f.x),py=Y(f.y);
    ctx.fillStyle='rgba(240,220,140,'+a+')';
    ctx.beginPath();ctx.arc(px,py,f.z*1.5,0,Math.PI*2);ctx.fill();
    var g=ctx.createRadialGradient(px,py,0,px,py,f.z*8);
    g.addColorStop(0,'rgba(240,220,140,'+(a*.3)+')');g.addColorStop(1,'rgba(240,220,140,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,f.z*8,0,Math.PI*2);ctx.fill();
  });
}

// ===== RAIN =====
function spawnRain(x,y){for(var i=0;i<14;i++)S.rain.push({x:x+(Math.random()-.5)*40,y:y,vy:50+Math.random()*80,vx:(Math.random()-.5)*20,life:.4+Math.random()*.4,r:1.5+Math.random()*2})}
function upRain(dt){for(var i=S.rain.length-1;i>=0;i--){var p=S.rain[i];p.y+=p.vy*dt;p.x+=p.vx*dt;p.life-=dt;if(p.life<=0)S.rain.splice(i,1)}}
function drRain(){S.rain.forEach(function(p){var a=Math.max(0,p.life/.6);ctx.fillStyle='rgba(140,190,240,'+a+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()})}

// ===== SNOW =====
function upSnow(dt){
  if(S.season!=='winter'){S.snow=[];return}
  if(S.snow.length<40&&Math.random()<.4)S.snow.push({x:Math.random()*cv.width,y:-5,vy:12+Math.random()*25,vx:(Math.random()-.5)*12,r:1.5+Math.random()*3,w:Math.random()*Math.PI*2})
  for(var i=S.snow.length-1;i>=0;i--){var s=S.snow[i];s.y+=s.vy*dt;s.w+=dt;s.x+=Math.sin(s.w)*8*dt+s.vx*dt;if(s.y>cv.height)S.snow.splice(i,1)}
}
function drSnow(){S.snow.forEach(function(s){ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()})}

// ===== HOVER DETECTION =====
function findHovered(mx,my){
  var best=null,bestDist=Infinity;
  for(var i=S.plants.length-1;i>=0;i--){
    var p=S.plants[i];
    if(stage(p)==='d')continue;
    var px=X(p.x),py=Y(p.y),dx=mx-px,dy=my-py+15;
    var dist=Math.sqrt(dx*dx+dy*dy);
    var rad=25+(p.size||.5)*40;
    if(dist<rad&&dist<bestDist){bestDist=dist;best=p}
  }
  return best;
}

function updateTooltip(p,e){
  var tip=document.getElementById('plantTip');
  if(!p){tip.style.opacity='0';S.hovered=null;return}
  S.hovered=p;
  var st=stage(p);
  var age=Math.floor((Date.now()-p.createdAt)/86400000);
  var ageStr=age<1?'今天':age+' 天前';
  var health=Math.round(Math.max(0,p.health));
  var hColor=health>70?'#8bc080':health>40?'#c0a860':health>20?'#c08040':'#c05050';
  tip.querySelector('.pt-name').textContent=(TYPE_NAMES[p.type]||p.type)+' · '+STAGE_NAMES[st];
  tip.querySelector('.pt-info').innerHTML='💚 '+health+'% &nbsp;📅 '+ageStr+'<br>💧 '+((p.wateredBy||[]).length)+' 次浇水';
  tip.querySelector('.pt-fill').style.cssText='width:'+health+'%;background:'+hColor;
  tip.style.opacity='1';
  tip.style.left=(e.clientX+18)+'px';
  tip.style.top=(e.clientY-70)+'px';
}

// ===== INTERACTION =====
function getPos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left),y:(e.clientY-r.top)}}
function handleWater(e){
  var pos=getPos(e),nx=pos.x/cv.width,ny=pos.y/cv.height;
  spawnRain(pos.x,pos.y);
  P('/water',{x:nx,y:ny}).then(function(r){
    if(r.ok&&r.watered&&r.watered.length){
      var bt=randomBlogTitle();
      var msg=bt&&Math.random()<.4?'💧 「'+bt.slice(0,15)+'…」长出新芽':('💧 浇到了 '+r.watered.length+' 株植物');
      toast(msg);
      r.watered.forEach(function(w){S.anims[w.id]={t:Date.now()};var p=S.plants.find(function(pp){return pp.id===w.id});if(p){p.health=w.health;p.stage=w.stage}})
      updUI()
    }
  }).catch(function(){})
}
cv.addEventListener('click',handleWater);
cv.addEventListener('touchstart',function(e){if(e.touches.length===1){handleWater(e.touches[0]);e.preventDefault()}},{passive:false});
cv.addEventListener('mousemove',function(e){
  var pos=getPos(e),p=findHovered(pos.x,pos.y);
  if(p!==S.hovered)updateTooltip(p,e);
});
cv.addEventListener('mouseleave',function(){updateTooltip(null)});

// ===== UI =====
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function updUI(){
  document.getElementById('visitCount').textContent='访问 '+S.totalVisits+' 次';
  var bl=S.plants.filter(function(p){return stage(p)==='b'}).length;
  var al=S.plants.filter(function(p){var s=stage(p);return s!=='w'&&s!=='d'}).length;
  document.getElementById('plantSummary').textContent=al+' 株 · '+bl+' 朵盛开';
  document.getElementById('seasonIcon').textContent=(PAL_DAY[S.season]||PAL_DAY.summer).icon
}
function showAbout(){document.getElementById('aboutBg').classList.add('show')}
function hideAbout(){document.getElementById('aboutBg').classList.remove('show')}
document.addEventListener('keydown',function(e){if(e.key==='Escape')hideAbout()});
document.getElementById('aboutBg').addEventListener('click',function(e){if(e.target===this)hideAbout()});

// ===== LOOP =====
function drawAll(){
  ctx.clearRect(0,0,cv.width,cv.height);
  drawBG();drawStars();drawMoon();drawLight();drawTrees();
  drawEarth();drawPebbles();drawLeaves();drawWildMushrooms();drawDews();drawFog();
  drSnow();drRain();
  updateFF(.016);drawFF();updateDrift(.016);drawDrift();updateButterfly(.016);drawButterfly();updateSignboard(.016);
  drawSnail();drawSignboard();
  sortP();S.plants.forEach(function(p){drawPlant(p)})
  drawVignette();
}

function loop(ts){
  var dt=Math.min(.1,S.time?(ts-S.time)/1000:.016);
  S.time=ts;
  upRain(dt);upSnow(dt);updateSnail(dt);drawAll();
  requestAnimationFrame(loop)
}

// ===== BLOG INTEGRATION =====
var blogPosts=[];
async function loadBlogPosts(){
  try{var r=await fetch('/api/blog/articles');blogPosts=await r.json()}catch(e){}
}
function randomBlogTitle(){
  if(!blogPosts.length)return null;
  return blogPosts[Math.floor(Math.random()*blogPosts.length)].title;
}
function readRandom(){
  if(blogPosts.length){var p=blogPosts[Math.floor(Math.random()*blogPosts.length)];location.href='/?id='+p.id}
  else location.href='/'
}

// ===== INIT =====
async function init(){
  loadBlogPosts(); // non-blocking
  try{
    var d=await G('/state');S.plants=d.plants||[];S.totalVisits=d.totalVisits||0;S.season=d.season||getSeason();
    updUI();
    if(!sessionStorage._moss_visited){sessionStorage._moss_visited='1';var vr=await P('/visit');if(vr.ok&&vr.newPlant){S.plants.push(vr.newPlant);S.totalVisits=vr.totalVisits;updUI();toast('🌱 一株新植物破土而出！')}}
  }catch(e){}
  requestAnimationFrame(loop)
}
setInterval(async function(){try{var d=await G('/state');if(d.plants){S.plants=d.plants;S.totalVisits=d.totalVisits;updUI()}}catch(e){}},60000);
// Refresh blog posts every 5 min for random reading
setInterval(function(){loadBlogPosts()},300000);
init();
</script>
